name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: tests
        working-directory: engine
        run: python -m pytest -q
      - name: regen (deterministic, no LLM)
        run: bash scripts/regen.sh personal-wevolley
      - name: canon is byte-identical after regen
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
