<svg xmlns="http://www.w3.org/2000/svg" width="960" height="246" viewBox="0 0 960 246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6E7681"/></marker></defs><text x="20" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#9198A1">흩어져 있는 내용</text><rect x="20" y="42" width="400" height="52" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.5"/><text x="40" y="73" text-anchor="start" font-size="12" font-weight="600" fill="#9198A1">정책 문서</text><text x="116" y="73" text-anchor="start" font-size="13" fill="#E6EDF3">결제 후 30분 안에 취소할 수 있다</text><path d="M420 68 C470 68 470 132 518 132" fill="none" stroke="#6E7681" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="106" width="400" height="52" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.5"/><text x="40" y="137" text-anchor="start" font-size="12" font-weight="600" fill="#9198A1">회의록</text><text x="116" y="137" text-anchor="start" font-size="13" fill="#E6EDF3">취소 가능 시간을 1시간에서 30분으로</text><path d="M420 132 C470 132 470 132 518 132" fill="none" stroke="#6E7681" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="170" width="400" height="52" rx="10" fill="#161B22" stroke="#3D444D" stroke-width="1.5"/><text x="40" y="201" text-anchor="start" font-size="12" font-weight="600" fill="#9198A1">코드</text><text x="116" y="201" text-anchor="start" font-size="13" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#E6EDF3">CANCEL_WINDOW_MIN = 30</text><path d="M420 196 C470 196 470 132 518 132" fill="none" stroke="#6E7681" stroke-width="1.6" marker-end="url(#a)"/><rect x="520" y="20" width="420" height="206" rx="12" fill="#161B22" stroke="#6D28D9" stroke-width="1.5"/><text x="544" y="50" text-anchor="start" font-size="12" font-weight="600" fill="#A78BFA">개념</text><text x="544" y="80" text-anchor="start" font-size="20" font-weight="700" fill="#E6EDF3">주문 취소 가능 시간</text><path d="M544 96 H916" stroke="#3D444D" stroke-width="1.5"/><text x="544" y="122" text-anchor="start" font-size="12" font-weight="600" fill="#9198A1">지금</text><text x="604" y="122" text-anchor="start" font-size="13" fill="#E6EDF3">30분</text><text x="544" y="148" text-anchor="start" font-size="12" font-weight="600" fill="#9198A1">출처</text><text x="604" y="148" text-anchor="start" font-size="13" fill="#E6EDF3">문서 2곳 · 코드 1곳</text><text x="544" y="174" text-anchor="start" font-size="12" font-weight="600" fill="#9198A1">이력</text><text x="604" y="174" text-anchor="start" font-size="13" fill="#E6EDF3">1시간 → 30분</text><rect x="544" y="190" width="372" height="26" rx="6" fill="#2E2A1F" stroke="#2E2A1F" stroke-width="1.5"/><text x="556" y="208" text-anchor="start" font-size="12" font-weight="600" fill="#D29922">어긋남 후보 · 안내 문구에는 아직 '1시간'</text></svg>
