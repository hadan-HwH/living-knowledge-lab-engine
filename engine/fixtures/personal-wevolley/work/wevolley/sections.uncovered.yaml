- anchor: components.ui.AnimatedCheck
  doc: components/ui/AnimatedCheck.tsx
  text: 'AnimatedCheck — 체크마크 stroke 가 0.3s 동안 그려지는 SVG.

    왜:

    출석/완료 같은 "성취 모먼트" 가 그냥 정적 체크면 감흥이 없음.

    stroke-dasharray 트릭으로 stroke 가 그려지는 효과를 주면 짧지만 만족스러운 피드백.

    (디자인 시스템 P1 #8 — 마이크로 모션, 출석 체크)

    의존성:

    react-native-svg — 이미 RN 표준. 없으면 expo install react-native-svg.

    사용:

    <AnimatedCheck size={24} color={Colors.palette.primary500} />

    첫 마운트 시 자동 재생. value 가 true→false→true 면 다시 재생.

    ms 단위 stroke draw duration. default duration.gentle(300).

    ms 단위 시작 딜레이. default 0.

    true 면 즉시 그려진 상태 유지 (애니메이션 스킵).

    // 체크마크 path. 24x24 viewBox 기준, 좌하단→중앙→우상단.

    // 위 path 의 대략적 길이. dasharray/dashoffset 계산용. (Math.sqrt 두 번 합산해도 16~18 정도)'
