  doc: components/club/RecruitLevelChips.tsx
  text: 'RecruitLevelChips — 동호회 등록/수정 폼에서 "모집 레벨" 칩 그룹.

    왜 추출했나:

    ClubCreateSteps 와 ClubEditSections 두 곳에서 동일한 칩 그룹을 인라인으로 그리고 있었고,

    "무관(all)" 은 다른 레벨들과 의미가 다른 옵션 (= 레벨 제한 없음) 이라 시각적으로

    분리해주어야 한다는 디자인 시스템 P0 #3 결정을 한 곳에서만 지키게 하기 위함.

    레이아웃:

    [입문] [초급] [중급] [상급]      ← 등급 그룹

    ── 또는 ──  [무관]              ← 별개 의미라 다음 줄에 ''or'' 톤으로

    - 1 행에 4칩 (한 줄 보장; 360px 폭에서도 단어 짧아 여유)

    - 2 행에 ''또는'' 보조 텍스트 + 무관 칩 한 개'
