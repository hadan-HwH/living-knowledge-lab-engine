    시리즈 허브 (56 Task 7, 디자인 F4). 진입 = 피드 표지·커버의 시리즈 스큐 칩 +

    리더 헤더 시리즈 라인. 볼트 티커(최신 EP 미완독일 때만) → 커버 스택 → 채널 행 →

    이어서 읽기 CTA → EP 목록(오름차순, 완독 딤 · 읽는 중 진행바 · 새 화 도트).

