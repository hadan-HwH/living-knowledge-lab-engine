- anchor: planning/reference/improvement-catalog#F1.-데이터-루프-—-Sentry-알림-+-푸시-대시보드-(D1과-연계)
  doc: planning/reference/08-improvement-catalog.md
  text: '### F1. 데이터 루프 — Sentry 알림 + 푸시 대시보드 (D1과 연계)


    - **현재**: Phase 1/4로 데이터는 **모이지만** 자동으로 사람에게 안 옴.

    - **접근**: Sentry 알림 규칙(신규/급증/특정 domain) + `_push_log` 기반 전달률 대시보드.

    - **개선 효과(§8)**: 모인 데이터가 행동으로 연결. **D1(제품 분석) 착수 시 함께 깔면 시너지** — 에러·전달률·제품 퍼널을
    한 데이터 루프로.'
- anchor: planning/reference/improvement-catalog#권장-흐름-(개정-2026-06-03-·-라이브-제품-기준)
  doc: planning/reference/08-improvement-catalog.md
  text: '## 권장 흐름 (개정 2026-06-03 · 라이브 제품 기준)


    > A1·A2는 완료(✅). 이하는 실유저 90명/동호회 56개가 도는 현 단계의 순서다. 초판의 "기술부채 우선"에서 **"실유저 폴리시
    → 가시화 → 리텐션 대응 → 기술부채"** 로 재편.


    0. **G2 동호회 활성도 실태 점검** — DB 한 방. 싸고 이후 방향을 가르는 선행 조사.

    1. **E1 거친 버그 4건** — 실유저가 매일 부딪침. 싸고 효과 즉각적. 라이브 제품 최우선.

    2. **D1 퍼널·리텐션 가시화** — 90 유저 행동이 깜깜이. 측정 없이는 다음을 못 정함(이미 늦음). F1을 함께 깔면 시너지.

    3. **G1 이탈 지점 대응 루프** — D1로 보인 가장 큰 누수 1개부터 수정→재측정.

    4. **B2 푸시 receipt** — 리텐션 직결 신뢰성. 그다음 A3·B1·B3·C·D2·D3는 여력 보고. F2는 상시.


    > 각 항목 착수 시 `/plan-doc <항목>`으로 `22-`+ 상세 문서 생성 → 8섹션(§8 효과·활용 포함)으로 구체화 후 구현.'
- anchor: planning/reference/prod-key-rotation-runbook#배포-런북-—-service_role-키-회전-+-Vault-주입
  doc: planning/reference/13-prod-key-rotation-runbook.md
  text: '# 배포 런북 — service_role 키 회전 + Vault 주입


    > 작성일: 2026-05-31

    > 상위/연계: [04-phase4-backend-durability.md](../작업완료/04-phase4-backend-durability.md)
    §0(P0) · Step 0

    > 성격: **prod 배포 시점에 1회 실행하는 운영 작업**(대시보드/SQL Editor). 코드(마이그레이션 `00095`)는 이미 완료되어
    있고, 이 문서는 그 코드를 prod에 적용할 때 함께 해야 하는 **수동 키 작업**만 다룬다.

    > 담당: 배포 권한자(대시보드 접근 필요)


    ---'
- anchor: planning/reference/prod-key-rotation-runbook#0.-왜-필요한가-(배경)
  doc: planning/reference/13-prod-key-rotation-runbook.md
  text: '## 0. 왜 필요한가 (배경)


    `supabase/migrations/00076_push_config_table.sql:16`에 **live 레거시 `service_role`
    키**(JWT, `role=service_role`, exp 2088)가 **평문으로 git에 커밋**되어 있었다. service_role
    키는 **RLS를 전부 우회하는 마스터 키**라, 커밋 히스토리에 박제된 것 자체가 사고(P0)다.


    - `00095_push_secret_to_vault.sql`가 **평문 키를 `_push_config`에서 제거**하고, 트리거/크론이 **Supabase
    Vault**에서 키를 읽도록(`_get_push_service_key()`) 바꿨다. (코드 완료)

    - **그러나** 유출된 키는 **회전(재발급) 전까지 계속 유효**하다. 그리고 Vault에 새 키를 넣기 전까지는 푸시가 나가지 않는다.
    → 이 두 가지가 이 런북의 작업.


    > 메모: repo는 private(`deploy-push-gotchas`)이라 노출 위험은 제한적이지만, **회전 완료까지 P0는 닫히지
    않는다.**


    ---'
- anchor: planning/reference/prod-key-rotation-runbook#1.-선행-조건
  doc: planning/reference/13-prod-key-rotation-runbook.md
  text: '## 1. 선행 조건


    - [ ] `00095_push_secret_to_vault.sql` 포함 마이그레이션이 **prod에 적용**될 배포여야 한다(또는 이미
    적용됨). 적용 전이라면 트리거가 아직 `_push_config`의 평문 키를 참조하므로, 회전하면 푸시가 즉시 끊긴다 → **00095 적용과
    키 회전을 같은 배포 윈도우에** 둘 것.

    - [ ] 저트래픽 시간대 권장(회전 중 짧은 푸시/클라이언트 영향 최소화).

    - [ ] 대시보드 접근 권한 확인.


    ---'
- anchor: planning/reference/prod-key-rotation-runbook#2.-⚠️-핵심-함정-—-레거시-키는-anon과-묶여-있다
  doc: planning/reference/13-prod-key-rotation-runbook.md
  text: '## 2. ⚠️ 핵심 함정 — 레거시 키는 anon과 묶여 있다


    유출된 키는 **레거시 service_role JWT**(`eyJ...`)다. 대시보드의 새 `sb_secret_*` 탭이 아니라 **"Legacy
    anon, service_role API keys" 탭**에 있다.


    **레거시 키는 anon 키와 같은 JWT secret으로 서명**된다 → 레거시를 회전하면 **anon 키도 함께 바뀐다.** anon 키는
    **배포된 앱·웹 클라이언트가 쓰는 키**라서, 회전하는 순간 **재배포 전까지 클라이언트가 접속 불가**가 된다.


    > 따라서 **레거시 키 회전 + 클라이언트(앱/웹) 새 anon 키로 재배포**를 반드시 **한 배포에 묶어야** 한다. 그냥 "Roll"
    버튼만 누르면 운영 장애.


    대안(새 `sb_secret_*` 체계로 전환)은 send-push의 JWT role 디코드 검증과 게이트웨이 `verify_jwt` 동작을
    다시 설계해야 하므로 **이번 범위 밖**(04 문서 §6). 이번엔 레거시 JWT를 유지·회전한다.


    ---'
- anchor: planning/reference/prod-key-rotation-runbook#3.-실행-순서
  doc: planning/reference/13-prod-key-rotation-runbook.md
  text: '## 3. 실행 순서'
- anchor: planning/reference/prod-key-rotation-runbook#3.1-키-회전-(유출-키-무효화)
  doc: planning/reference/13-prod-key-rotation-runbook.md
  text: '### 3.1 키 회전 (유출 키 무효화)


    1. 대시보드 → **Settings → API → "Legacy anon, service_role API keys" 탭**.

    2. service_role 키 **Roll/재발급**. ⚠️ anon도 같이 바뀜(§2).

    3. **새 service_role 키와 새 anon 키를 모두 복사**해 둔다.'
- anchor: planning/reference/prod-key-rotation-runbook#3.2-클라이언트-재배포-(anon-키-갱신)
  doc: planning/reference/13-prod-key-rotation-runbook.md
  text: '### 3.2 클라이언트 재배포 (anon 키 갱신)


    4. 새 **anon(publishable) 키**를 클라이언트 환경변수(EAS / Vercel 등 `EXPO_PUBLIC_*` anon 키)에
    반영하고 **앱·웹 재배포**. (회전과 같은 윈도우에)'
- anchor: planning/reference/prod-key-rotation-runbook#3.3-새-service_role-키를-Vault에-주입
  doc: planning/reference/13-prod-key-rotation-runbook.md
  text: "### 3.3 새 service_role 키를 Vault에 주입\n\n5. 대시보드 → **SQL Editor**에서 실행(`<새\
    \ service_role 키>` 교체):\n   ```sql\n   select vault.create_secret('<새 service_role\
    \ 키>', 'push_service_role_key');\n   ```\n\n   - 시크릿 이름은 반드시 `push_service_role_key`\
    \ (코드가 이 이름으로 조회).\n   - 이미 같은 이름이 있으면 `vault.update_secret`로 갱신:\n     ```sql\n\
    \     select vault.update_secret(\n       (select id from vault.secrets where\
    \ name = 'push_service_role_key'),\n       '<새 service_role 키>'\n     );\n   \
    \  ```\n   - ⚠️ 이 키 값은 **어디에도 커밋/메모 금지**. Vault에만.\n\n---"
- anchor: planning/reference/prod-key-rotation-runbook#4.-배포-후-검증
  doc: planning/reference/13-prod-key-rotation-runbook.md
  text: "## 4. 배포 후 검증\n\n- [ ] Vault 주입 확인:\n  ```sql\n  select _get_push_service_key()\
    \ is not null as ok;  -- true 기대\n  ```\n- [ ] 평문 키 부재 확인:\n  ```sql\n  select\
    \ 1 from _push_config where key = 'service_role_key';  -- 0 rows 기대\n  ```\n-\
    \ [ ] **푸시 실발송 1건**: 테스트 알림 trigger(예: 본인에게 알림 발생) → 단말 수신 확인. 또는 `_push_log`에서\
    \ 최근 `status='sent'` 행 확인:\n  ```sql\n  select status, error_code, sent_at from\
    \ _push_log order by id desc limit 5;\n  ```\n- [ ] 클라이언트(앱/웹) **로그인·데이터 조회 정상**(새\
    \ anon 키 반영 확인).\n- [ ] 구 키 무효 확인(선택): 구 service_role 키로 REST 호출 시 401.\n\n---"
- anchor: planning/reference/prod-key-rotation-runbook#5.-롤백-/-사고-대응
  doc: planning/reference/13-prod-key-rotation-runbook.md
  text: '## 5. 롤백 / 사고 대응


    - **푸시가 안 나감**: `_get_push_service_key()`가 NULL이면 Vault 주입 누락 → 3.3 재실행. 키 값 오타
    가능 → `vault.update_secret`로 재주입.

    - **클라이언트 접속 불가(401/JWT)**: anon 키 미반영 → 3.2 재배포 확인. 환경변수에 구 anon 키가 남아있는지 점검.

    - **회전을 되돌릴 수는 없다**(구 키는 영구 무효). 따라서 §1 선행조건(00095 적용 + 클라이언트 재배포 준비)을 반드시 회전
    **전에** 갖출 것.


    ---'
- anchor: planning/reference/prod-key-rotation-runbook#6.-후속-(이번-범위-밖)
  doc: planning/reference/13-prod-key-rotation-runbook.md
  text: '## 6. 후속 (이번 범위 밖)


    - **git history purge**: 회전으로 유출 키가 무효화되면 긴급도 낮음. 강제 push 위험(`deploy-push-gotchas`)이라
    신중히 별도 판단.

    - **새 `sb_secret_*` 키 체계 전환**: send-push의 JWT role 검증 + 게이트웨이 `verify_jwt` 재설계
    필요. 레거시 키 의존 제거를 원하면 별도 작업으로(04 문서 §6).'
