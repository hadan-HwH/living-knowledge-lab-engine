- anchor: app.(auth).login.LoginScreen
  doc: app/(auth)/login.tsx
  text: 'export default function LoginScreen() {

    // 로그인은 전부 이 화면 위에서 끝난다 (이메일·네이티브 카카오 SDK는 in-place,

    // 웹 카카오는 redirectTo=/login 으로 복귀). 세션이 생기면 RouteGuard 가 홈으로

    // 보낼 때까지 폼 대신 메인 진입 EntryLoading(SPLASH.md)을 노출한다.

    // 웹 카카오 복귀 직후, 코드 교환이 끝나 session 이 생기기 전 구간도 커버.

    // 네이티브 모듈 미포함 빌드 → 브라우저 OAuth 폴백

    // 세션이 생기면(네이티브 카카오 SDK in-place·이메일 로그인) 폼 대신 EntryLoading 으로 전환.

    // 하드컷 대신 Crossfade 로 폼을 페이드아웃 / 로딩을 페이드인 — 부팅 흐름 연속감 (SPLASH.md).'
