sections:
- anchor: api.landing
  doc: api/landing.ts
  text: 'SEO 랜딩 페이지 (Vercel Serverless, Node) — VOLT 디자인.

    비로그인 웹 방문자·크롤러에게 앱 소개 HTML을 서버 렌더링한다.

    wv_app 쿠키가 없는 루트(/) 요청에 대해 vercel.json rewrite로 연결된다.

    디자인: VOLT (잉크 #17181A + 볼트 라임 #C8F135). 외부 이미지 에셋 0개 —

    모든 아이콘/도형은 순수 CSS 기하. 웹폰트만 CDN 로드. og.png(OG용)만 예외.

    {margin:0;padding:0;box-sizing:border-box}

    // 런칭일 2026-04-28 (KST). D+ 카운터는 요청 시점 경과일로 계산 — 하드코딩 없음.

    // 잉크 타일 위 4px 회색 도트 (기능1 지도 그리드)

    // 마퀴 트랙 그룹 (동일 콘텐츠 2벌 → -50% 무한 루프)

    // Android UA는 시작 CTA를 Play Store로 분기

    // 스크롤 리빌 (stagger, 1회)

    // D+ 카운트업 (뷰포트 50% 진입 시 1회)'
