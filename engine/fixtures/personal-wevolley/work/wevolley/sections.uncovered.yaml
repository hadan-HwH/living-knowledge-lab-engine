- anchor: components.home.MyClubsSection
  doc: components/home/MyClubsSection.tsx
  text: 'MyClubsSection — 홈 "내 동호회" 섹션.

    디자인 시스템 P0 #4: 정보 밀도를 "compact" → "standard" 로 승격.

    기존: avatar + name + role + region 뿐. (홈 화면의 60% 를 먹는 카드인데 정보량이 검색 결과 수준.)

    변경: 같은 카드 위에 모집 레벨 / 게임 타입 뱃지 한 줄 추가 — 가입 후에도 "우리 동호회가 무엇인지"

    스쳐 보이도록.

    트레일링 슬롯은 기존과 동일하게 [일정][채팅] 2-액션. ClubCard 의 trailing prop 으로 전달.

    관리자 카드 하단 운영 액션 행 — 홈을 운영 대시보드 입구로.

    카드(=동호회) 컨텍스트에 액션이 붙으므로 멀티 동호회에서도 모호함 없음.

    관리자 카드는 footer의 ''일정 등록''과 중복이라 일정 버튼을 숨긴다.

    // ''all'' 단독은 의미 없음 — 다른 레벨이 있으면 ''all'' 제외.'
