  text: 'EventMarkers — 캘린더 / 주간 일정 strip 등에서 "이 날짜에 어떤 종류의 일정이 있는지"

    를 표시하는 점(dot) 마커 묶음.

    왜 추출했나:

    - 이전엔 EventCalendarGrid 안에서 5px 점을 직접 그렸고, WeeklySchedule strip

    에선 1x1 점을 별도로 그리고 있어서 두 곳의 의미·크기·색이 어긋났음.

    - 색을 hex 로 직접 박지 말고 palette.marker.* 토큰을 통해 단일 source 로 통일.

    - 점 크기를 4-5px → 6px 로 키워 시인성 개선 (디자인 시스템 P0 #2).

    책임:

    - "있는 종류"만 그린다 (없는 종류는 자리 잡지 않음).

    - 선택된 셀(짙은 primary 배경) 위에서는 onSelected 톤으로 대비 보정.

    책임이 아닌 것:

    - 마커가 0개일 때 자리 차지 (호출자가 height 고정값으로 강제할지 결정).'
