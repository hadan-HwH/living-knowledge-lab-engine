    - [ ] **음성**: ON 상태에서 my-clubs의 ''관리자'' 뱃지는 **그대로 ''관리자''** (정보 유지 — §3.2).

    - [ ] **음성**: pill이 FabMenu(우하단)와 겹치지 않는다 — 동호회 탭(지도 기본)에서 확인.

