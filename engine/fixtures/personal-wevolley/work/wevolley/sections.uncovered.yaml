- anchor: planning/reference/improvement-catalog#B1.-데이터-모델-정규화
  doc: planning/reference/08-improvement-catalog.md
  text: '### B1. 데이터 모델 정규화


    - **현재(증거)**: `admin_positions TEXT[]` 배열(마이그레이션 00066/67/68, `lib/api/clubs.ts`·`ClubDetailContext`·`useClubMemberActions`에서
    사용, 사용처 18곳). `clubs.level/positions`도 배열. jsonb(`notifications.metadata` 등) 스키마
    검증 없음. **마이그레이션 fix류 비율 실측 11.5%(12/104)** — 스키마 아직 흔들림(초판 "18%"는 과대였음).

    - **접근**: 배열→enum/정규화 테이블(예: `club_admin_positions`), 유니크 제약. jsonb는 경계 zod(Phase
    7과 연계). **마이그레이션 전진만(00105+)**, 점진.

    - **검증**: 마이그레이션 후 `db:types:local` drift 0, L2 통합 테스트(권한·직책).

    - **개선 효과(§8)**: 직책/레벨 쿼리·제약이 타입·DB 레벨로 보장. 배열 인덱스 성능 위험 제거.

    - **착수 시**: Phase 4(권한)·7(타입)과 묶어 판단. 영향 크니 신중히. **단 동작엔 문제 없으므로 E·D1·G 뒤.**'
- anchor: planning/reference/improvement-catalog#B2.-푸시-Receipt-확인-(Tier-3)
  doc: planning/reference/08-improvement-catalog.md
  text: '### B2. 푸시 Receipt 확인 (Tier 3)


    - **현재(검증)**: Phase 4가 Tier 1(로그)·2(재시도)까지. `send-push/index.ts:249-256`은 Expo
    응답의 `ticket_id`만 저장 → **receipt(실제 단말 도달) 미확인**.

    - **접근**: 발송 시 ticket 저장 → 별도 cron이 Expo receipt 조회 → 최종 상태 `_push_log` 기록.

    - **검증**: 발송→receipt 폴링→상태 기록 확인.

    - **개선 효과(§8)**: 전달률을 "서버가 보냄"에서 "단말이 받음"으로. **실유저 90명 리텐션에 직접** — 알림이 안 가면 안
    돌아옴. 그래서 백엔드 중 가장 상위(권장순 4).'
- anchor: planning/reference/improvement-catalog#B3.-RLS-정책-전수-재감사
  doc: planning/reference/08-improvement-catalog.md
  text: '### B3. RLS 정책 전수 재감사


    - **현재**: 채팅 재귀(00027)·anon 우회(00085)는 사후 발견·수정됨. 다른 자기참조/정책 일관성은 미검증.

    - **접근**: 자기참조 정책이 모두 SECURITY DEFINER 헬퍼 경유하는지, 정책 네이밍·banned 적용 일관성 점검. L2로
    음성 테스트.

    - **개선 효과(§8)**: "사후 발견" 보안 결함을 사전 차단. 안 보이지만 사고 예방.


    ---'
