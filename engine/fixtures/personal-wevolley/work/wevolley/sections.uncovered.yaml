  doc: components/ui/AnimatedPressable.tsx
  text: 'AnimatedPressable — press 시 scale 0.98 로 살짝 줄어드는 공용 Pressable.

    왜:

    wevolley 의 카드들은 TouchableOpacity activeOpacity 만으로 처리되어 있어

    터치 피드백이 "단조롭게 흐려짐" 1가지 였음. 카드 단위에서는 살짝 scale 이 들어가야

    프로덕션 톤이 되며, Button 컴포넌트는 이미 같은 패턴(0.97)을 쓰고 있음 — 일관성.

    (디자인 시스템 P1 #8 — 마이크로 모션, 카드 press)

    사용:

    <AnimatedPressable onPress={...}>{children}</AnimatedPressable>

    scale, springConfig override 가능.

    press 시 줄어드는 scale 값. default 0.98.

    opacity 도 같이 줄일지. default true (기존 activeOpacity 와 동등한 시각 효과).'
