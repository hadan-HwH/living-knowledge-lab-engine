    - **✅ 완료(2026-06-04)**: RN `^0.83.4`→exact 고정(위험 caret 1→0), `.cursor/rules/dependency-policy.mdc`(변동성
    3등급표·patch-package 추적표), `.github/dependabot.yml`(weekly·그룹 6개·major ignore·PR
    한도 5).

    - **개선 효과(§8)**: 다음 메이저에서 안 헤맴. 안 보이지만 유지보수 비용↓. 메이저 업그레이드 자체(React 19/RN 0.83/Reanimated
    4 조합)는 dependabot 인지 후 별도 계획.'
- anchor: planning/reference/improvement-catalog#D3.-릴리즈-자동화-→-24-상세-문서-§D3(../작업완료/24-scalability-product-infra.md)
  doc: planning/reference/08-improvement-catalog.md
  text: '### D3. 릴리즈 자동화 → [24 상세 문서 §D3](../작업완료/24-scalability-product-infra.md)


    - **✅ 완료(2026-06-04)**: share-link 헬스체크(`deploy-healthcheck.yml` + `scripts/check-share-links.sh`),
    배포 설정 정적 게이트(`scripts/check-deploy-config.sh` → ci.yml fail-fast 스텝), 릴리즈 체크리스트(`.cursor/rules/release-checklist.mdc`
    — DB·엣지 함수 수동 단계 포함).

    - **개선 효과(§8)**: "배포가 무서운" 상태 완화, share-link 회귀가 사람 손 없이 잡힘. EAS 빌드 자동 트리거·단계적
    롤아웃은 범위 밖 잔여(24 §6).


    ---'
- anchor: planning/reference/improvement-catalog#G2.-동호회-활성도-실태-점검-(싼-선행-조사-—-권장순-0)
  doc: planning/reference/08-improvement-catalog.md
  text: '### G2. 동호회 활성도 실태 점검 (싼 선행 조사 — 권장순 0)


    - **현재(가설)**: prod 동호회는 대부분 `registration_type=''shared''`로 추정. 56개 중 **실제 멤버십·활동이
    도는 managed가 몇 개인지** 미확인.

    - **왜 중요**: 56이 다 활성이면 콘텐츠 충분, 대부분 정보성 shared면 "동호회는 많은데 참여 동선은 비어있는" 다른 그림 →
    G1·D1 이벤트 정의 방향이 갈림.

    - **접근**: DB 집계 한 방(`registration_type`·멤버수·최근 활동 분포)이면 나옴. **비용 소, 레버리지 큼** →
    G1·D1·E보다 먼저 슬쩍.

    - **권장순 0**: 이후 방향을 가르는 사전 확인.'
- anchor: planning/reference/improvement-catalog#G1.-이탈-지점-대응-루프-(권장순-3)
  doc: planning/reference/08-improvement-catalog.md
  text: '### G1. 이탈 지점 대응 루프 (권장순 3)


    - **현재**: 측정도 대응도 없음. 90 유저가 어디서 멈추는지 모름.

    - **접근**: D1 퍼널이 깔린 뒤, 가장 큰 이탈 구간 1개를 골라 개선 → 재측정(예: 프로필 완성 이탈, 첫 동호회 참여 이탈, 경기
    신청 전환). 한 번에 하나, 측정 기반.

    - **개선 효과(§8)**: 신기능 추가가 아니라 **이미 온 유저를 머물게** — 초기 단계 ROI가 가장 높은 트랙.


    ---'
