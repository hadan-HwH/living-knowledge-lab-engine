  doc: lib/online-manager.ts
  text: 'export function setupOnlineManager(): void {

    React Query onlineManager 를 NetInfo 에 배선한다(Phase 41 — 축 B). 앱 진입에서 1회 호출.

    네이티브 기본 onlineManager 는 네트워크 복귀를 감지하지 못한다(navigator.onLine 은 웹

    전용). 배선해야 오프라인엔 쿼리가 멈추고 복귀 시 `refetchOnReconnect` 가 실제로 발동한다.

    captive/no-internet Wi-Fi 오판을 막기 위해 `isInternetReachable !== false` 를 함께 본다.

    웹은 기본 동작(online/offline 이벤트)을 유지한다.

    이 배선을 query-client.ts 가 아니라 여기 둔 이유: query-client.ts 는 Node 테스트에서

    import 되는데, react-native/NetInfo 를 끌어오면 그 테스트가 ESM 파싱 에러로 깨진다.'
