  text: 'export default function CommunityScreen() {

    커뮤니티 탭 루트 (45B). 피드는 게스트 열람 가능.

    로그인 유저가 커뮤니티 프로필이 없으면(needsSetup) 첫 진입 모달로 자동 생성.

    FAB(글쓰기)·☰(드로어)는 게스트면 로그인 시트. 카테고리는 칩·드로어가 같은 상태 공유.

    // 카테고리 — 피드 칩과 드로어가 같은 필터 상태 공유 (디자인 3B)

    // 좌측 엣지 스와이프 → 드로어 열기 (로그인 + 닫힘일 때만) — 오버레이 없는 capture 방식

    // ☰ — 드로어는 프로필 수정 포함이라 로그인 게이트 (게스트는 시트)

    // 실패 시 무한 모달 방지 — 피드백 후 재시도 가능 (UNIQUE 경합은 재탭 시 기존 프로필 반환)'
