- anchor: lib.hooks.useModalPresence.useModalPresence
  doc: lib/hooks/useModalPresence.ts
  text: "export function useModalPresence(visible: boolean): boolean {\nuseModalPresence\
    \ — RN <Modal>의 exit 모션용 지연 언마운트.\nRN Modal은 visible=false 순간 즉시 사라져 Reanimated\
    \ exiting 애니메이션이\n재생될 틈이 없다. Modal 자체는 exit 페이드(duration.fast)가 끝날 때까지\n마운트를 유지하고,\
    \ 내부 콘텐츠는 visible로 마운트/언마운트해\nentering/exiting이 재생되게 한다. (MOTION.md — AppModal·CenterModal)\n\
    열림은 반드시 동기여야 한다: `visible || exitTail` 형태라 open 시 상태 갱신\n홉 없이 같은 커밋에 콘텐츠가 DOM에\
    \ 들어간다. (effect 로 mounted 를 올리면\n\"컨트롤 탭 → 다음 프레임 모달\" 레이스가 생겨 e2e/실사용 탭이 씹힌다\
    \ — 09/10)\n사용:\n  const mounted = useModalPresence(visible);\n  <Modal visible={mounted}\
    \ animationType=\"none\">{visible && <Animated.View exiting=... />}</Modal>\n\
    // exitTail: 닫힌 뒤에도 exit 애니메이션 동안 Modal 마운트를 유지하는 래치."
