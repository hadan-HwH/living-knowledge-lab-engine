- anchor: planning/backlog/view-as-member-v2#핵심-통찰
  doc: planning/backlog/37-view-as-member-v2.md
  text: '### 핵심 통찰


    - **"일반 회원처럼 보기"의 체감은 app_role이 아니라 club role 표면에서 나온다.** 홈 footer(방금 36에서 추가)와
    클럽 상세 관리 UI가 유저 시야의 90%.

    - club role 게이트도 사실상 두 곳(`MyClubsSection:138`, `ClubDetailContext:103` + 부채 인라인
    1곳)에 모여 있어 v2 변경도 좁다 — v1과 같은 "파생 지점만 고치면 일괄 적용" 구조가 성립한다.'
