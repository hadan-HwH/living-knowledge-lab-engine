- anchor: planning/backlog/view-as-member-v2#v1(81)이-이미-만든-것-—-재사용
  doc: planning/backlog/37-view-as-member-v2.md
  text: '### v1(#81)이 이미 만든 것 — 재사용


    | 자산                                                        | 위치                                                    |
    상태                                                             |

