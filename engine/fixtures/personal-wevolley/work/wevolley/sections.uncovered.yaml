- anchor: components.club.ClubCard
  doc: components/club/ClubCard.tsx
  text: 'ClubCard — 동호회를 카드로 표시하는 공용 컴포넌트 (VOLT — 목업 clubs-list 카드).

    왜 추출했나:

    홈("내 동호회"/"동호회 추천")과 동호회 목록(ClubListContent)이 거의 같은 카드를

    각자 인라인으로 그리고 있어 정보 밀도와 시각 위계가 화면마다 어긋났음 (디자인 시스템 P0 #4).

    38B 에서 목업 구조([타일 48 + 이름·모집배지 + 메타 1줄 + ›])로 재작성 — 목록·홈이 같은 카드.

    슬롯:

    titleBadge    — 이름 옆에 붙는 작은 뱃지 (StatusChip 등).

    meta          — 이름 아래 1줄 메타 텍스트 (예: "서울 강서 · 혼성 · 화/목 저녁"). 넘치면 말줄임.

    metaTrailing  — meta 뒤에 '' · '' 로 이어 붙는 부가 정보 (예: MonoText 거리).

    bottomBadges  — 카드 아래 한 줄로 깔리는 시각 뱃지 그룹 (flex-wrap).

    description   — 본문 텍스트 (numberOfLines=2 ellipsis).

    trailing      — 카드 우측 슬롯. 기본 chevron, 액션 버튼으로 대체 가능 (예: 홈 "내 동호회"의 일정/채팅).

    footer        — 카드 하단 풀폭 슬롯 (예: 관리자 운영 액션 행). Pressable 바깥 — 인터랙티브 요소 안전.

    업로드된 클럽 사진 URL. 있으면 타일에 사진 표시.

    이름 아래 1줄 메타 (지역·성별·요일 시간대 등을 '' · '' 로 이어 붙인 문자열).

    meta 뒤에 '' · '' 로 이어 붙일 부가 정보 (예: 거리 MonoText).

    카드 오른쪽 슬롯. 미지정시 chevron-forward 자동 표시.

    카드 하단 풀폭 슬롯 (예: 관리자 운영 액션 행). Pressable 바깥 — 인터랙티브 요소 안전.

    // Badge 의 variant 유니온을 단일 소스로 참조 — 뱃지 시스템 변경 시 자동 동기화.'
