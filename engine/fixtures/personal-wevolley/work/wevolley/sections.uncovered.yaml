    // 45A: 가입 신청·문의 DM·게스트 문의는 로그인 필요 — 비로그인이면 유도 시트.

    // 멤버가 보는 동안 공지·일정·멤버 변경 실시간 수신 (59 C2). 비멤버는 인가 불가라 미구독.

    // 신청 시트는 화면 레벨 - CTA 모집 시트를 닫고 열어 RN Modal 이중 중첩을 피한다 (패리티 리뷰)

    // degrade-ok: CTA 라벨 분기용 카운트 - 실패 시 기존 문의(DM) 동선으로 저하

    // 일정 카운트 뱃지 — 이 시점에 이미 로드된 데이터(recurrences)만 사용 (새 쿼리 추가 금지).

    // 초대 링크 진입을 퍼널 상단으로 기록 (구 share/club 화면에서 이관).

    // 카운트 뱃지는 해당 카운트가 이미 로드된 경우만 (공지는 탭 진입 시 로드라 생략).

    // 바깥 시트 먼저 닫기 - community/[id]의 시트 전환 관례와 동일'
