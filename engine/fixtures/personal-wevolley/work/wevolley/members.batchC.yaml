    quote: confirmed charge 중 셀프 신고(reported) 경유 비율 ≥ 60%
  wevolley#sc-treasury-pain-three:
  - unit: backlog/club-treasury#1.-문제
    quote: '**대조 노동**: 은행 내역과 멤버 명단을 수동 대조 — 입금자명이 제각각, 몰아내기(3개월치)·대납이 섞임.'
  - unit: backlog/club-treasury#1.-문제
    quote: '**독촉의 감정 비용**: 미납자에게 개인적으로 돈 얘기를 꺼내는 어색함. 기능이 아니라 관계 문제.'
  - unit: backlog/club-treasury#1.-문제
    quote: '**투명성 보고**: 회식비·유니폼·장비비 지출까지 엑셀에 적어 총회 때 공개 — 보고가 연 1~2회 이벤트라 평소엔 블랙박스.'
  - unit: backlog/club-treasury#1.-문제
    quote: '근거: 운영자 본인이 1차 사용자(도그푸딩). 엑셀+카톡이 사실상 표준 워크플로.'
