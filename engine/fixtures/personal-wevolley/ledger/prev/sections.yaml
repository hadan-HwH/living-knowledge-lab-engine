    \          | POST 수동 호출(§3)                       | 수동 장면 주입: body에 `scenes`가\
    \ 있으면 LLM 호출 없이 검증·시각 배정·승인 흐름만. 크론(00126, KST 06:30)은 남아 있으나 prod에 키가 없어 자동 집필\
    \ 미사용 | 수동 주입이면 불필요 |\n| `community-bot-events-retention`  | 크론 매일 KST 04:05(00145)\
    \               | 이벤트 큐 정리: done/skipped 14일·pending 30일 경과분 삭제 (/bot-react 마무리\
    \ 정리의 백스톱)                                                              | 불필요\
    \               |\n\nreactor는 00145에서 폐기됐다 - 사람 글 반응은 /bot-react(구독 기반, 키 0)가\
    \ 대체. 상세는 planning/작업완료/51·53.\n컴포넌트별 상세 매뉴얼은 **§6**, 소재·발행 대장은 **`bot/` 폴더**(topics.md·content-log.md).\n\
    \n파이프라인 흐름:\n\n```\n사람/봇 글·댓글 INSERT --트리거(00141)--> community_bot_events (큐,\
    \ http 호출 없음)\n                                            |\n               \
    \           /bot-react (딸깍)이 소비: 반응 판단·집필\n                                  \
    \          |  댓글 = bot_enqueue_reaction RPC (하드 가드)\n                        \
    \                    |  글 = /bot-chat·/bot-cards·/bot-article이 직접 INSERT (승인 게이트)\n\
    \                                            v\n                          community_bot_schedule\
    \ (pending | awaiting_approval)\n                                            |\
    \  글 승인: require_approval / 댓글: auto_react_enabled\n                         \
    \                   v\n                          publisher (5분 크론) --발행--> community_posts\
    \ / community_comments\n                                            |\n      \
    \                                      +--> 발행분도 다시 이벤트 큐로 (봇끼리 창발 루프)\n\n병행:\
    \ liker (3회/일, 사람 글 좋아요 즉시) · moderator (2회/일, 킬스위치 무관)\n```\n\n**API 키는 앱에 없는\
    \ 게 정상이다.** prod에 `ANTHROPIC_API_KEY`를 넣지 않는다(사용자 확정) - LLM 두뇌는 전부 Claude Code\
    \ 구독(봇 스킬 4종)이고, 키가 필요한 경로는 모더레이터의 LLM 판정 보강뿐이다(없으면 하드 룰만 동작). 클라이언트 앱은 키를 절대\
    \ 갖지 않는다(번들 노출).\n\n**킬스위치**: `community_bot_config.enabled=false`면 봇 스킬 4종·publisher·liker·director(실주입)\
    \ 전부 skip - dry 미리보기와 moderator만 예외."
