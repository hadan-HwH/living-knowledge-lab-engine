- anchor: reference/improvement-catalog#E1.-거친-버그·미완-→-22-상세-문서(../작업완료/22-launch-polish-ime-foreground-push.md)-(실측-정정:-4건→실작업-2건)
  doc: reference/08-improvement-catalog.md
  text: '### E1. 거친 버그·미완 → [22 상세 문서](../작업완료/22-launch-polish-ime-foreground-push.md)
    (실측 정정: 4건→실작업 2건)


    > **착수 전 코드 전수 확인(2026-06-03) 결과 "4건"이 재판정됨.** 추측이 아니라 실재 기준으로 좁힘:


    1. ~~**대회 등록 후 네비게이션 락**~~ — **이미 해결.** `game/[id]/index.tsx`가 아니라 `tournament-create.tsx:74-81`이
    등록 성공 후 추적필드를 비워 `usePreventRemove` 가드를 해제(game/create·club/create 동일 패턴, [11
    문서](../작업완료/11-tournament-create-navfix.md)). → 드롭.

    2. ✅ **프로필 web 한글 입력 — 완료(2026-06-03).** `WizardSteps.tsx` 닉네임 `onChangeText`의
    redundant `.slice(0,10)` 제거(maxLength={10}가 상한 보장). verifier-web로 한글 입력 정확성·10자
    상한·숫자필드 회귀 0 확인, tsc/lint/단위 136/L3 07-profile e2e 통과. (22 §4-A)

    3. ⏳ **안드 포그라운드 푸시 + 임시코드 — 미착수(네이티브 빌드 대기).** 임시코드 2곳(`mypage/index.tsx:218-232`
    + `push-notifications.ts:106-126`)은 **안드 포그라운드 푸시 미표시**라는 미해결 버그의 진단기구(주석 "원인
    확정 후 제거", 메모리 `push-foreground-display-pending`). 단순 제거 ≠ 해결. **다음 안드 빌드에서 원인
    확정 후 제거.** (22 §4-B)

    4. ~~**채팅 복구 flaky**~~ — **버그 아님.** `useChatForegroundRecovery.ts`는 완결·정상. "flake"는
    `e2e/05` realtime Tier2의 관리되는 타이밍 이슈(README: CI retries 흡수). → 드롭.


    - **상태**: A 트랙(#2 web) ✅ 완료, B 트랙(#3 네이티브) ⏳ 빌드 대기. **권장순 1.**

    - **접근(verify-then-fix)**: 실재 확인(web 런타임 / 네이티브 빌드) → 확인된 것만 최소 수정. 각각 독립 PR.
    → [22 문서](../작업완료/22-launch-polish-ime-foreground-push.md).

    - **개선 효과(§8)**: 헛수정/이미 끝난 일에 시간 안 씀 + 확인된 통점만 안전하게 정리.'
- anchor: reference/improvement-catalog#E2.-위저드-콜드-로드-prefill/저장-버그-(🆕-22번-검증-중-발견)
  doc: reference/08-improvement-catalog.md
  text: '### E2. 위저드 콜드 로드 prefill/저장 버그 (🆕 22번 검증 중 발견)


    - **현재(증거)**: 딥링크/리로드로 edit 위저드 진입 시 현재값 prefill 안 됨 + 저장 미반영. 원인 추정 `profile-wizard.tsx:77`
    `useState(profile?.nickname ?? '''')`가 첫 렌더 profile에서 초기화 → 콜드 로드 시 profile async
    미도착으로 ''''로 굳음(전 필드 공통). 웜 인앱 흐름(`my-profile` client-side push)은 정상(성별 male→female
    DB 영속 확인).

    - **실유저 영향**: 제한적(콜드 로드/딥링크 한정 + 닉네임 edit은 인앱 진입점 없음). **권장순: 낮음(E1 이후 여력 시).**

    - **접근**: 위저드 필드 state를 profile 로드에 동기화(`useEffect` 초기화) 또는 profile 준비 전 렌더 가드
    강화. 22 §6.


    ---'
