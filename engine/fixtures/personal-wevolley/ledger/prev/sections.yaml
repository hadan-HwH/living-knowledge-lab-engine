- anchor: reference/bot-ops-runbook#prod:-DB-URL을-export한-세션에서만.-스킬이-"prod에-반응-틱을-돌립니다"-고지-후-진행
  doc: reference/49-bot-ops-runbook.md
  text: '# prod: DB URL을 export한 세션에서만. 스킬이 "prod에 반응 틱을 돌립니다" 고지 후 진행

    export WEVOLLEY_BOT_DB_URL="<prod DB 연결 문자열>"

    /bot-react

    ```


    - **자동화(옵션)**: `scripts/bot-auto.sh on|off|status` - launchd가 45분마다 `claude -p
    "/bot-react"` 헤드리스 실행. prod 자동화는 `WEVOLLEY_BOT_DB_URL`을 export한 셸에서 `on`을 실행해야
    plist에 박힌다. 2026-07-20 개명(bot-tick→bot-react) 전부터 켜져 있었다면 off→on으로 plist 재생성 필요(구
    plist는 삭제된 /bot-tick 호출).

    - **승인**: 글 예약(`require_approval=true`)은 `awaiting_approval`로 들어온다. prod 승인은 **콘솔
    UI가 정도(正道)** - 터미널 승인(§3-3 시프트+승인 psql)은 로컬용이고, prod DB psql 직결은 시프트 실수 시 도배로
    직결되므로 지양. 터미널만 쓰려면 super_admin JWT로 RPC 호출이 안전: `curl <PROD_URL>/rest/v1/rpc/admin_approve_bot_run
    -H "Authorization: Bearer <JWT>" -H "apikey: <ANON_KEY>" -d ''{"p_run_id":"..."}''`.

    - 댓글은 `auto_react_enabled=true`라 승인 없이 pending → 자동 발행 (단계 1: 댓글 자율·글 승인, 51 §4).

    - **긴급 정지**: `UPDATE community_bot_config SET enabled = false;` 한 방 (§0 킬스위치).'
- anchor: reference/bot-ops-runbook#§2-콘텐츠-채널-운영-(54)
  doc: reference/49-bot-ops-runbook.md
  text: '## §2 콘텐츠 채널 운영 (54)


    3채널 = `community_bot_personas` 중 concept이 `[콘텐츠채널]`로 시작하는 계정. /bot-react·/bot-chat이
    이 계정들을 반응 댓글·잡담 집필 페르소나에서 제외하고 콘텐츠 집필 전담으로 쓴다.


    | 채널       | 슬롯(KST) | 소재                                                                       |

    | ---------- | --------- | --------------------------------------------------------------------------
    |

    | 오늘의배구 | 화        | 프로 배구 뉴스(WebSearch 소화). **공개 보도 사실에 한해 실명·구단명 허용** |

    | 배구연구소 | 목        | 꿀팁·훈련법(community_bot_topics 소재 풀)                                  |

    | 장비창고   | 토        | 배구화·유니폼·보호대·공 등 장비 잡지식                                     |


    - 집필·예약은 **/bot-cards·/bot-article 딸깍**이 담당 (2026-07-20 포맷별 분리, planning/57 -
    슬롯 요일에 실행하거나 채널·주제를 지정. 포맷은 운영자가 소재를 보고 스킬로 선택 - 자동 판단 폐기): 리서치→집필→비평 파이프라인으로
    v3 포인트 정형을 쓰고, `body`는 구버전 앱용 폴백 텍스트. 슬롯 요일을 놓치면 따라잡지 않는다(다음 슬롯 정상 발행 - 주간 리듬
    유지). 규격: cards 포인트 3~~5개·head ≤17자·body ≤90자(하드), article 포인트 4~~6개·body 150~~300자·전체
    800~~1500자, title ≤24자·`highlight`(head의 부분 문자열만 유효)·태그 1~~3개 필수 공통. 잡담 글(/bot-chat)은
    태그 0~~2개.

    - 승인·발행·킬스위치는 일반 글과 동일(§1). 발행된 콘텐츠 글도 bot_post 이벤트로 적재돼 대화 페르소나가 기존 확률로 댓글을 단다.

    - **콘텐츠 예약 수정 금지**: `awaiting_approval` 콘텐츠를 `admin_update_bot_schedule`(00139)로
    고치지 않는다 - 그 RPC는 body(폴백)만 수정해 content JSONB와 어긋난다. 고칠 게 있으면 취소(`admin_cancel_bot_schedule`)
    후 재집필.

    - 채널 시드: `scripts/seed-content-channels.sql` (멱등, ON_ERROR_STOP. **prod는 사용자 승인
    후에만** - 실사용자 노출 신규 계정).

    - 상세 집필 규칙은 `.claude/skills/bot-cards/SKILL.md`·`.claude/skills/bot-article/SKILL.md`,
    설계·E2E 결과는 planning/작업완료/54, 파이프라인 설계는 planning/57.'
- anchor: reference/bot-ops-runbook#§3-수동-장면-주입-(director,-키-없이)
  doc: reference/49-bot-ops-runbook.md
  text: '## §3 수동 장면 주입 (director, 키 없이)


    대본을 사람/Claude Code가 쓰고 디렉터에 주입하는 경로. body에 `scenes`가 있으면 LLM을 아예 호출하지 않으며, 검증·상한·시각
    배정·승인 흐름은 LLM 경로와 100% 동일하다.'
- anchor: reference/bot-ops-runbook#3-1.-대본-형식-(v1-스키마)
  doc: reference/49-bot-ops-runbook.md
  text: "### 3-1. 대본 형식 (v1 스키마)\n\n```json\n{\n  \"scenes\": [\n    {\n      \"post\"\
    : {\n        \"persona\": \"활성 페르소나 닉네임\",\n        \"category\": \"free\",\n\
    \        \"body\": \"글 본문 (10~2000자)\"\n      },\n      \"replies\": [\n     \
    \   { \"persona\": \"다른 페르소나 닉네임\", \"body\": \"답글 (5~500자)\", \"offset_minutes\"\
    : 60 }\n      ]\n    }\n  ]\n}\n```\n\n규칙(디렉터 검증이 강제 - 위반 행은 조용히 드롭): `persona`는\
    \ 활성 페르소나 닉네임과 **정확히** 일치, 자기 글에 자기 답글 금지, `category` ∈ free·info·question, 답글\
    \ 최대 3개/글, 일일 상한(config) 재강제. 발행 시각은 코드가 배정한다(아침/점심/저녁 윈도우 난수, 지난 시각이면 자동 +1일)."
