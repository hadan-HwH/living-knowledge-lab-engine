  text: '## §3 설계 고려사항'
- anchor: backlog/view-as-member-v2#3.1-토글의-의미론-—-어디까지-내리나-(가장-중요한-결정)
  doc: backlog/37-view-as-member-v2.md
  text: '### 3.1 토글의 의미론 — 어디까지 내리나 (가장 중요한 결정)


    - **A. app_role만 (v1 현행)**: 이미 배포. 체감 0 — 실패로 판명.

    - **B. A + club admin 클라이언트 표면 다운그레이드**: `isClubAdmin` 파생에 `&& !viewAsMember`.
    유저가 기대한 "일반 회원 눈" 충족. 변경 3곳.

    - **C. 서버 impersonation** (RLS까지 회원 권한): JWT claim 조작 또는 별도 세션 필요 — 보안 표면 확대 +
    복잡도 폭발. 완전 시뮬레이션은 이미 있는 **테스트 계정**이 정답.

    - **결정: B.** C는 과욕 (테스트 계정이 대체재). B의 한계(서버가 더 주는 데이터)는 §6에 명시하고 배너 문구로도 암시하지 않는다(운영자용
    기능이라 과설명 불필요).'
- anchor: backlog/view-as-member-v2#3.2-정보성-뱃지는-두고-행동-게이트만-내린다-(과표준화-경고)
  doc: backlog/37-view-as-member-v2.md
  text: '### 3.2 정보성 뱃지는 두고 행동 게이트만 내린다 (과표준화 경고)


    `item.role === ''admin''` 소비처를 전부 바꾸면 my-clubs·members의 ''관리자'' 뱃지도 ''회원''으로 표시된다.
    이건 **거짓 정보**다(실제 role은 admin). 일반 회원 모드의 목적은 "회원이 보는 화면의 문제를 발견"이지 "내 정체를 속이기"가
    아니다. **결정: 기능/CTA 게이트(footer, 관리 진입, canEdit)만 내리고 정보 표시는 유지.** 전수 소비처 중 대상: `MyClubsSection:138`,
    `ClubDetailContext:103`(+파생), `club/[id]/index.tsx:61`. 비대상: `my-clubs.tsx:81-82`,
    `MemberCard.tsx:42,53` 뱃지.'
- anchor: backlog/view-as-member-v2#3.3-어디서-내리나-—-파생-지점-vs-소비처
  doc: backlog/37-view-as-member-v2.md
  text: '### 3.3 어디서 내리나 — 파생 지점 vs 소비처


    `viewAsMember`를 각 소비처에서 체크하면 새 화면마다 잊기 쉽다. **결정: 파생 지점에서 내린다** — v1이 auth.tsx에서
    한 것과 동일 원칙:


    - `ClubDetailContext.tsx:103`: `const isClubAdmin = membership?.role === ''admin''
    && !viewAsMember;` (useAuth를 :72에서 이미 호출 중 — viewAsMember만 추가로 꺼냄). `isPresident`·`isAdmin`·`canEdit`·`isMember`가
    연쇄로 내려간다.

    - `MyClubsSection.tsx:138`: 컴포넌트가 `useAuth()` 미사용 → `viewAsMember`를 꺼내 `item.role
    === ''admin'' && !viewAsMember`.

    - `club/[id]/index.tsx:61` 인라인: 동일 패치. (이 화면의 인라인 read 정리는 알려진 부채 — 이번엔 게이트만 고치고
    리팩토링 금지 원칙 준수.)'
- anchor: backlog/view-as-member-v2#3.4-모드-인디케이터-—-위치와-형태
  doc: backlog/37-view-as-member-v2.md
  text: '### 3.4 모드 인디케이터 — 위치와 형태


    - **A. 탭 레이아웃 상단 스트립**: `app/(tabs)/_layout.tsx`에서 `Tabs` 위에 조건부 밴드 — 탭 화면 전체
    커버, 삽입점 1곳. 단 헤더 없는 화면(SafeArea 직접 처리하는 club 등)과 겹침 계산 필요.

    - **B. 각 화면 헤더에 뱃지**: 커버리지 구멍(화면마다 삽입) — 탈락.

    - **C. 플로팅 pill (하단 탭바 위)**: 삽입점 1곳(탭 레이아웃), SafeArea 간섭 없음, 탭바 바로 위라 시선에 걸림.
    FabMenu와 좌우 분리 필요(우하단은 FAB 자리 — 메모리: fabmenu-web-tap-intercept, 좌하단 배치).

    - **결정: C (좌하단 pill, "👁 일반 회원 모드 · 끄기").** 탭하면 즉시 OFF. 스택 화면(chat/[roomId], admin
    등)은 탭 밖이라 안 뜨지만, 문제가 되는 표면(홈·클럽)이 전부 탭 안이므로 충분. 과욕 금지 — 전역 오버레이 시스템을 만들지 않는다.'
- anchor: backlog/view-as-member-v2#3.5-쿼리·캐시
  doc: backlog/37-view-as-member-v2.md
  text: '### 3.5 쿼리·캐시


    club role은 서버 데이터 그대로 두고 **게이트에서만** 내리므로 캐시 조작이 필요 없다 (v1의 `enabled: isSuperAdmin`
    쿼리들도 자동 disable). 토글 시 invalidate 불필요 — 상태 전파는 React context 리렌더로 즉시. 단, `isMember`
    하락으로 클럽 상세의 멤버 전용 쿼리가 있다면 disable될 뿐 (오작동 아님).'
- anchor: backlog/view-as-member-v2#§4-구현-계획-(단일-PR,-커밋-3개)
  doc: backlog/37-view-as-member-v2.md
  text: '## §4 구현 계획 (단일 PR, 커밋 3개)


    - [ ] 1. **club role 게이트 다운그레이드**: `ClubDetailContext.tsx:103`, `MyClubsSection.tsx:138`,
    `club/[id]/index.tsx:61`에 `!viewAsMember` 반영. 검증: tsc + 기존 테스트.

    - [ ] 2. **모드 인디케이터 pill**: `app/(tabs)/_layout.tsx`에 `viewAsMember && <ViewAsMemberPill
    />` (좌하단 absolute, 탭바 위, 탭하면 `setViewAsMember(false)`). 컴포넌트는 `components/ui/`가
    아닌 로컬 정의로 시작 (단일 소비처).

    - [ ] 3. **마이페이지 토글 부제 갱신**: "관리자 UI를 숨기고…" → 클럽 관리 UI 포함을 반영한 문구.

    - [ ] 각 커밋 후 `npx tsc --noEmit`, 마지막에 `npm run lint`(≤77)·`npm test`.'
- anchor: backlog/view-as-member-v2#§5-검증-(Verification)
  doc: backlog/37-view-as-member-v2.md
  text: '## §5 검증 (Verification)


    - [ ] **양성 (web, verifier-web)**: test-a(강남 스파이크 club admin + super_admin)로 토글
    ON → ① 홈 내 동호회 카드 footer 소멸 ② 강남 스파이크 상세에서 관리 UI 소멸 + 회원 시점 CTA ③ 좌하단 pill 표시
    → pill 탭 → 전부 복귀.

    - [ ] **양성**: ON 상태에서 앱 재시작(새로고침) → 모드·pill 유지 (v1 영속 재확인).

    - [ ] **음성**: 일반 계정(비 super_admin)에는 토글도 pill도 절대 안 뜬다.

    - [ ] **음성**: ON 상태에서 my-clubs의 ''관리자'' 뱃지는 **그대로 ''관리자''** (정보 유지 — §3.2).

    - [ ] **음성**: pill이 FabMenu(우하단)와 겹치지 않는다 — 동호회 탭(지도 기본)에서 확인.

    - [ ] native: 다음 EAS 빌드에서 35·36 잔여와 함께 일괄 확인.'
- anchor: backlog/view-as-member-v2#§6-이번-범위-밖-(후속/별도)
  doc: backlog/37-view-as-member-v2.md
  text: '## §6 이번 범위 밖 (후속/별도)


    - **서버 권한 전환(impersonation)** — §3.1 결정 C 탈락. 완전한 일반 회원 시뮬레이션은 테스트 계정으로 (RLS가
    super admin에게 더 반환하는 행 — 정책류 12건 — 은 이 모드에서도 보일 수 있음).

    - **비회원(게스트) 모드** — "회원도 아닌 사람"의 시점은 별개 축. 필요성이 확인되면 별도 기획.

    - **스택 화면(탭 밖) pill 커버리지** — admin/·chat/[roomId] 등. 문제 표면이 아니라 잘라냄.

    - `club/[id]/index.tsx` 인라인 read 정리 — 기존 부채 트래킹대로 해당 화면 리팩토링 시.'
- anchor: backlog/view-as-member-v2#§7-리스크-&-완화
  doc: backlog/37-view-as-member-v2.md
  text: '## §7 리스크 & 완화


    | 리스크                                                                        |
    영향                                  | 완화                                                                                                                       |

    | -----------------------------------------------------------------------------
    | ------------------------------------- | --------------------------------------------------------------------------------------------------------------------------
    |

    | `isMember` 하락(ClubDetailContext:106)으로 자기 클럽에서 "가입 신청" CTA가 뜸 | 운영자가 실수로 자기
    클럽에 가입 신청 | 실제로는 membership이 있어 서버가 중복 신청 거부 + 이게 바로 "회원이 아닌 시점" 재현이므로 의도된 동작.
    §5에서 눈으로 확인 |

    | pill이 콘텐츠/FAB 가림                                                        | 시각
    간섭                             | 좌하단 배치 + 탭바 위 오프셋, 동호회 탭(FAB 존재)에서 검증 (§5)                                                            |

    | 파생 지점 밖의 새 club-role 게이트가 미래에 추가돼 모드를 무시                | 커버리지 침식                         |
    `MyClubsSection` 사례처럼 role 게이트는 파생/전달로 받는 관례를 DECISIONS.md에 1줄 기록                                    |

    | viewAsMember ON을 잊고 "버그다" 오인                                          | 헛디버깅                              |
    pill 상시 표시가 바로 이 리스크의 완화책 (§3.4)                                                                            |'
- anchor: backlog/view-as-member-v2#§8-구현-후-—-무엇이-달라지나-&-어떻게-활용하나-(기대)
  doc: backlog/37-view-as-member-v2.md
  text: '## §8 구현 후 — 무엇이 달라지나 & 어떻게 활용하나 (기대)


    **Before → After**


    - v1: 토글 ON → 마이페이지 메뉴 몇 줄만 사라짐, 홈·클럽은 그대로 → "달라지는 게 없는데?" / v2: ON 즉시 **홈 footer
    소멸 + 자기 클럽이 회원 시점 + 좌하단 pill** — 모드가 켜졌음이 3초 안에 보인다.

    - 운영자가 일반 회원의 실제 화면(빈 상태, CTA, 막힌 진입)을 자기 계정으로 재현 가능 — "평소에 뭐가 안 되는지"를 드디어 본다.


    **개선 지표**: §1 성공 측정. 정성: 일반 모드로 발견한 회원 UX 이슈 리포트 수.


    **누가 어떻게 쓰나**


    - 운영자(super_admin): 마이페이지 토글 ON → 회원 눈으로 앱 순회 → pill로 복귀. 완전한 권한 시뮬이 필요하면 테스트
    계정(§6 한계).

    - 개발자: 새 관리자 UI는 `ClubDetailContext.isAdmin`/`isClubAdmin` 파생을 소비하면 모드가 공짜로 적용된다
    — 개별 화면에서 `membership.role`을 직접 읽지 말 것.

    - 후속: 게스트 모드·서버 impersonation이 필요해지면 이 토글의 의미론(§3.1)을 기준선으로 논의.


    **보이나/안 보이나**: 일반 유저에겐 완전히 안 보임 (super_admin 전용). 운영자 QoL + "회원 UX 문제를 운영자가 직접
    발견"이라는 품질 루프를 만드는 도구.'
- anchor: reference/improvement-catalog#Phase-8+-—-개선-후보-통합-카탈로그-&-추적-(Improvement-Catalog)
  doc: reference/08-improvement-catalog.md
  text: '# Phase 8+ — 개선 후보 통합 카탈로그 & 추적 (Improvement Catalog)


    > 작성일: 2026-05-31 · **개정: 2026-06-03 (실유저 90명 / 동호회 56개 — 라이브 단계 반영)**

    > 상위 문서: [00-architecture-stabilization-plan.md](../작업완료/00-architecture-stabilization-plan.md)

    > 성격: **0~7(기초 공사)이 끝나고 실유저가 도는 라이브 제품에서, 다음에 손볼 것의 통합 카탈로그 + 추적표.**

    > 사용법: 아래 §0 추적표로 진행 상황을 체크한다. 착수할 항목은 `/plan-doc <항목>`으로 **개별 상세 문서(`22-` …)로
    승격**시킨 뒤 구현한다. 이 문서는 그 인덱스이자 각 후보의 1차 설계 메모.

    > 한 줄 요약: "유저 90명·동호회 56개가 도는 지금, 무엇을 고치고 무엇을 측정해야 이들이 머무는가"의 답을, 근거와 함께 늘어놓고
    하나씩 지워나간다.


    > **개정 배경 (2026-06-03)**: 초판은 "기초 공사 이후 기술부채 정리"에 초점을 뒀고 우선순위도 기술부채 기준이었다. 그러나
    코드 전수 재조사 + 운영 데이터로 세 가지가 드러났다 — (1) 이미 **실유저 90명 / 동호회 56개**가 도는 **라이브 제품**이다(출시
    전 아님). (2) **실유저가 매일 부딪치는 거친 버그가 카탈로그 밖에 남아있다**(아래 E). (3) 행동 데이터가 **0**(`analytics`
    호출처 0건)이라 의사결정이 깜깜이다. 이에 우선순위를 **① 실유저 폴리시(E) → ② 가시화·분석(D1) → ③ 리텐션 대응(G) → ④
    기술부채(A3·B·C…)** 로 재편한다. 기술부채는 폐기가 아니라 **후순위 배경 트랙**으로 내린다. 또한 초판 진단의 두 편차를 정정했다:
    **A3 "거대 화면 혼재"는 과장**(이미 훅으로 분해됨 → 범위 축소), **B1 fix비율 18%→실측 11.5%**.


    ---'
