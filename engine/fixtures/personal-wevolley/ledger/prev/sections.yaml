    완성. context로 전역 노출                                        |

    | app_role 파생 오버라이드                                    | `lib/auth.tsx` — `isSuperAdmin
    = real && !viewAsMember` | 완성. 소비처 15파일 일괄 적용                                    |

    | 토글 UI (`MenuToggle`)                                      | `app/(tabs)/mypage/index.tsx`                           |
