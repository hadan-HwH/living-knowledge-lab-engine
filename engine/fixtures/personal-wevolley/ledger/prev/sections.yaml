- anchor: reference/linkedin-ep1-draft#링크드인-버전-(본문,-약-1,400자)
  doc: reference/linkedin-ep1-draft.md
  text: '## 링크드인 버전 (본문, 약 1,400자)


    혼자서 전부 하면, 어디까지 갈 수 있을까.


    늘 궁금했습니다.


    몇 번의 창업을 거치며 기획, 개발, 디자인, 사업, 마케팅을 조금씩 다 만져봤습니다. 문제는 그 지식이 전부 흩어져 있었다는 겁니다. 분야마다
    뚜렷한 경계선이 있었고, 저는 그 선을 넘는 것이 늘 막연히 두려웠습니다.


    그래서 실험을 하나 설계했습니다.


    100일 동안 서비스 하나를 처음부터 끝까지 혼자. 요구사항 발굴, 기획, 아키텍처와 DB 설계, 프론트, 백엔드, 배포, 운영까지. 흩어진
    지식을 하나의 파이프라인으로 연결해 보자. 이건 사업이 아니라 공부다.


    AI를 쓴 것도 같은 이유였습니다. AI를 "잘" 쓴다는 게 뭔지는 결국 끝까지 써본 사람만 압니다. 그래서 타이핑은 AI(Claude Code)에게
    맡기고, 저는 설계와 결정만 붙잡기로 역할을 갈랐습니다.


    소재는 제일 잘 아는 것으로 골랐습니다. 매주 뛰는 배구 동호회. 운영의 짐이 소수에게 몰리고, 총무가 지치면 모임이 죽는 걸 계속 봐 왔거든요.
    "운영자 없이 자동으로 돌아가는 동호회, 멋지지 않나?" 이 비전이 공부의 범위를 운영과 자동화까지 끌고 가는 장치가 됐습니다.


    시작은 코드가 아니라 DB였습니다. 도메인 모델과 권한 구조를 먼저 고정하고, 화면은 언제든 갈아엎을 수 있는 소모품으로 취급했습니다.


    그렇게 레포 만들고 5일째에 스토어 제출, 45일째에 정식 출시. 지금은 유저 90명이 실제로 쓰는 라이브 서비스가 됐습니다.


    이 100일에서 확인한 것 하나. AI 덕분에 만들기는 정말 빨라졌습니다. 그런데 빨라질수록 병목이 선명해집니다. 무엇을 만들지, 어떤 구조
    위에 만들지 정하는 일. 그건 끝까지 제 몫이었습니다.


    물론 청구서도 왔습니다. 출시 한 달 뒤 코드를 감사해 보니 테스트 커버리지 1.1%. 아키텍처는 버텼는데, 규율이 무너져 있었습니다. 그
    빚을 갚은 3번의 리팩토링이 다음 글입니다.


    100일의 기록을 5편으로 씁니다. 성공담이 아니라 실패한 것, 그래서 선택한 것, 그리고 회사 업무로 가져간 것 위주로요.


    미리 결론 하나만 말씀드리면, 그 경계선은 생각보다 얇았습니다. 여러분이 긋고 있는 선은 어디인가요.


    #바이브코딩 #1인개발 #풀스택 #사이드프로젝트 #ClaudeCode #PM


    ---'
- anchor: reference/linkedin-ep1-draft#발행-전-체크
  doc: reference/linkedin-ep1-draft.md
  text: '## 발행 전 체크


    - [ ] 접힘 전 2줄이 "혼자서 전부 하면, 어디까지 갈 수 있을까. / 늘 궁금했습니다."로 보이는지 모바일에서 확인

    - [ ] ERD 캡처: Supabase Studio 스키마 뷰에서 민감 테이블명(봇 관련) 노출 여부 확인

    - [ ] "유저 90명" 수치는 발행일 기준으로 갱신

    - [ ] 서비스 링크(랜딩)는 첫 댓글에 (본문 외부링크 도달 패널티 통설)

    - [ ] 마지막 질문이 어색하면 여운형("그 경계선은 생각보다 얇았습니다.")에서 끊기


    ---'
- anchor: reference/linkedin-ep1-draft#긴-버전-(브런치/블로그-크로스포스팅용-보관)
  doc: reference/linkedin-ep1-draft.md
  text: '## 긴 버전 (브런치/블로그 크로스포스팅용 보관)


    > 주의: 아래는 동기 개편(공부/파이프라인/경계선) 반영 전의 1차본. 크로스포스팅 시 도입부를 위 링크드인 버전의 동기 구조로 맞춘 뒤
    사용.


    **[100일간의 1인 풀스택 개발 ①] 운영자 없는 동호회라는 낭만**


    "운영자가 갈려 나가지 않는 동호회. 총무 없이, 공지 담당 없이, 자동으로 돌아가는 커뮤니티. 멋지지 않나?"


    이 문장 하나로 시작했습니다. 그리고 100일을 썼습니다.


    배구 동호회를 다니면서 계속 같은 장면을 봤습니다. 운영의 짐은 소수에게 몰리고, 그 사람이 지치면 모임이 죽습니다. 회비 정산, 게스트 모집,
    경기 공지. 좋아서 시작한 사람이 행정 때문에 떠나는 구조. 이걸 앱으로, 그것도 "완전 자동화"를 목표로 풀어보고 싶었습니다.


    먼저 고백부터 하겠습니다.


    저는 전공자이고, 개발에 깊게 관여해온 PM입니다. 데이터 구조를 중심으로 사고하고, 인프라 이야기에 낄 수 있을 만큼은 압니다. 그런데도
    풀스택은 두려웠습니다. 기획과 프론트 언저리까지가 제 땅이고, 백엔드와 배포는 남의 땅이라고 선을 그어 왔습니다.


    이 프로젝트는 그 선을 지우는 실험이기도 했습니다. AI가 타이핑을 맡아준다면, 내 설계 역량은 어디까지 갈 수 있을까.


    그래서 제 바이브코딩은 프롬프트가 아니라 설계에서 시작했습니다.


    코드를 한 줄도 만들기 전에 DB부터 그렸습니다. 동호회, 멤버, 경기, 요청이라는 도메인 모델. 앱 전체 역할과 동호회 내 역할을 분리한
    권한 구조. 모든 테이블에 행 단위 보안(RLS). 화면은 언제든 갈아엎어도 데이터 구조는 안 건드리는 것이 목표였습니다.


    결과는 속도로 나타났습니다.


    - 레포 생성 5일째, Play 스토어 제출

    - 45일째, 정식 출시

    - 오늘, 유저 약 90명과 동호회 56개가 실제로 쓰는 라이브 서비스


    100일간 마이그레이션은 146개까지 쌓였지만, 21개 테이블의 골격은 첫 설계에서 거의 그대로입니다. 추가는 많았고 재설계는 없었습니다.


    속도의 원인을 분해하면 세 가지였습니다.


    1. 도메인을 알았다. 요구사항이 기획서가 아니라 매주 뛰는 코트에서 나왔다.

    2. 스택을 고민하지 않았다. 검증된 조합(Expo, Supabase, Vercel) 하나로 고정.

    3. 설계를 먼저 고정했다. 데이터 모델이 서 있으면 나머지 결정의 절반은 자동으로 내려진다.


    AI 시대에 만들기는 정말 빨라졌습니다. 그런데 그럴수록 병목은 명확해집니다. 무엇을 만들지, 어떤 구조 위에 만들지 결정하는 일. 그건 AI가
    대신해주지 않았습니다.


    물론, 청구서는 왔습니다.


    다만 제가 예상한 곳(아키텍처)이 아니라 전혀 다른 곳으로 왔습니다. 출시 한 달 뒤에 제 코드를 감사했더니, 테스트 커버리지 1.1%, API
    경계에 any가 67개. 다음 편에서 그 빚을 갚는 이야기, "아키텍처는 버텼다, 무너진 건 규율이었다"로 이어가겠습니다.


    앞으로 5편, 실패한 것과 그래서 선택한 것, 그리고 회사 업무에 가져간 것을 기준으로 씁니다. 잘된 것만 보여주는 회고는 쓰지 않으려 합니다.'
- anchor: reference/perf-loading-realtime-history#성능·로딩·실시간성-개선의-전체-역사-(2026-04-~-2026-07)
  doc: reference/perf-loading-realtime-history.md
  text: '# 성능·로딩·실시간성 개선의 전체 역사 (2026-04 ~ 2026-07)


    > **성격**: 상시 참조 문서(reference). 위볼리 앱의 로딩 속도·반영 지연·실시간성·번들 크기 개선이 어떤 순서로, 어떤 근거로,
    어떤 의사결정을 거쳐 진행됐는지의 종합 기록.

    > **작성일**: 2026-07-30

    > **근거 자료**: planning/작업완료/ 문서 15개+, DECISIONS.md(0002·0008·0012·0021), git 커밋
    메시지·diff 실측. 각 사이클마다 "참고 자료" 항목에 원본 경로를 명시했다.

    > **읽는 법**: 각 사이클은 `참고 자료 → 당시 지표 → 문제점 → 개선 방법 고안(대안 비교) → 의사결정 → 구현 → 구현 후 지표`의
    반복 구조다. 이 반복이 곧 이 프로젝트의 성능 개선 방법론이다.


    ---'
- anchor: reference/perf-loading-realtime-history#0.-전체-조감---7개-흐름,-하나의-방법론
  doc: reference/perf-loading-realtime-history.md
  text: '## 0. 전체 조감 - 7개 흐름, 하나의 방법론


    | 시기               | 흐름                                  | 대표 산출물                                                                 |
    핵심 지표 변화                                                                               |

    | ------------------ | ------------------------------------- | ---------------------------------------------------------------------------
    | --------------------------------------------------------------------------------------------
    |

    | 2026-04-20 ~ 05-23 | ① 초창기 로딩 개선 (계측 이전)        | query-persister, prefetch,
    placeholderData, 번들 다이어트                   | 네이티브 번들 ≈ -4MB, 상세 진입 "0ms 표시"                                                   |

    | 2026-05-23 ~ 07-19 | ② 채팅 실시간성·안정성                | useResilientChannel, realtime-reconnect,
    드래프트 DM                        | 실시간 미수신 영구 누락 → 백오프 복구, 셀당 Date 파싱 8→0                                    |

    | 2026-06-01 ~ 06-04 | ③ 개별 화면 데이터 로딩 적정화        | admin RPC 페이지네이션, 지도 payload
    다이어트, PostHog 계측                 | 전량 로드 → 페이지당 20행, 지도 limit 200→4000 안전밸브                                      |

    | 2026-07-01 ~ 07-09 | ④ 캐시 반영 지연 (React Query)        | refetchType 계층화, persist
    denylist 반전, 낙관적 업데이트                  | claim 반영 최대 5분 → ~0초, persist 커버리지 17%→70%+                                        |

    | 2026-07-05 ~ 07-06 | ⑤ 부팅·로그인 로딩 흐름               | EntryLoading, useWarmHomeData,
    Crossfade                                    | 2단 로딩 → 1단, 고정 타이머 → 데이터 게이트(MIN
    2.4s/MAX 8s)                                 |

    | 2026-07-13 ~ 07-16 | ⑥ 검색 성능 + 응답성 hang             | trigram GIN 인덱스, 디바운스
    300ms, 픽커 워치독                             | 검색 ×232, 인기 정렬 ×170, 무반응 경로 4곳→0곳                                               |

    | 2026-07-28 ~ 07-29 | ⑦ 앱 전체 실시간 동기화 아키텍처 (59) | Broadcast 도메인 이벤트, useRealtimeScreen,
    sync-latency 계측, 웹 번들 분할 | 타 유저 변경 반영 ∞→100~400ms, 방 진입 480→132ms, postgres_changes
    4→0, 웹 초기 JS 4.7→3.7MB |


    **방법론의 진화가 이 문서의 진짜 주제다**:


    - 시대 ①은 커밋 메시지가 "로딩 개선" 한 줄이고 수치가 없다. 감으로 고쳤다.

    - 시대 ②(Phase 10)부터 **"계측 먼저, 수정은 계측이 가리키는 곳만"** 원칙이 확립됐다. 진단 스크립트(`diag-chat-send.sh`)로
    재현 → 원인 표(C0~C7) → 반증된 가설(C7)은 손대지 않음.

    - 시대 ③~⑥은 planning 문서 체계 안에서 **실측 baseline → 대안 비교 표 → 트레이드오프 명시 → 기각 사유 기록 →
    구현 후 재실측**이 표준이 됐다.

    - 시대 ⑦은 계측 자체를 공용 인프라(sync-latency 로거)로 승격했고, "개선 주장은 이 수치로만 한다"를 DoD에 박았다.


    관통 원칙 (여러 Phase에서 반복 확인된 것):


    1. **realtime은 best-effort 가속, 정확성은 refetch/invalidate가 보장한다** (Phase 10에서 확립,
    41·59가 계승).

    2. **"전체 받아 클라에서 후처리"를 "필요한 만큼만 서버가 처리"로** (16·17·47).

    3. **규모 적정화 - 과설계의 명시적 기각** (17 부동산식 viewport, 47 외부 검색엔진, 59 APM·폴링. prod ~90명/56클럽이라는
    실규모가 판단 기준).

    4. **좋은 기본값 + 소수 예외** 로 사람 기억 의존 제거 (40 denylist 반전).

    5. **로딩은 연출보다 응답성·비끊김·무한대기 방지가 우선** (부팅 6커밋의 수렴).

    6. **동작 불변·앱 코드 무변경으로 성능만 개선할 수 있으면 그 길을 먼저** (47 인덱스, 16 RPC).


    ---'
- anchor: reference/perf-loading-realtime-history#1.-시대-①---초창기-로딩-개선-(2026-04-20-~-05-23)
  doc: reference/perf-loading-realtime-history.md
  text: '## 1. 시대 ① - 초창기 로딩 개선 (2026-04-20 ~ 05-23)


    planning 문서 체계 이전. 커밋 메시지가 "로딩 개선"/"성능개선" 한 줄이라 당시 지표 기록이 없고, 문제와 해법은 diff에서 복원했다.
    그러나 이 시기에 이후 모든 캐시 전략의 뼈대(query-persister, prefetch, placeholderData)가 만들어졌다.'
- anchor: reference/perf-loading-realtime-history#1-1.-무한-로딩·멈춤-제거-(2026-04-20-~-05-13)
  doc: reference/perf-loading-realtime-history.md
  text: "### 1-1. 무한 로딩·멈춤 제거 (2026-04-20 ~ 05-13)\n\n- **참고 자료**: 커밋 `d37ad47`(성능개선),\
    \ `9196868`(로딩문제), `b7f82e9`(로딩 개선), `b490946`(카카오 SDK 에러 핸들링)\n- **당시 지표**: 없음(계측\
    \ 이전).\n- **문제점**:\n  - 동호회 상세가 캐시에 데이터가 있어도 진입마다 로딩 스피너를 깜빡임 (`isLoading` 조건이\
    \ 데이터 유무를 안 봄).\n  - 홈에서 프로필 로드 실패 시에도 무한 스피너 (실패와 로딩의 미구분).\n  - `supabase.auth.getSession()`·프로필\
    \ fetch가 무응답이면 초기화 무한 대기.\n  - 카카오 지도 SDK 스크립트 로딩 실패 시 조용히 무한 대기 (JS 키 미설정 포함).\n\
    - **의사결정·구현**:\n  - `ClubDetailContext.tsx`: `isLoading`을 `(!club && clubQuery.isLoading)`으로\
    \ - \"데이터가 이미 있으면 로딩이 아니다\". context value `useMemo`화.\n  - `app/(tabs)/home/index.tsx`:\
    \ `!profile`을 authLoading이면 스피너, 아니면 `ErrorRetry`로 분기.\n  - `lib/promise-timeout.ts`\
    \ 신설 + `lib/auth.tsx`: getSession 20초 / 프로필 fetch 25초 타임아웃, 타임아웃 시 Sentry breadcrumb.\n\
    \  - `ClubMapViewWeb.tsx`: SDK 타임아웃 10초 + `failAll` + `ErrorRetry` 재시도 경로.\n \
    \ - `web-canonical-redirect.ts` + `vercel.json` 301: `.vercel.app` 진입을 커스텀 도메인으로\
    \ 정규화 (클라+서버 이중 안전장치).\n- **구현 후 지표**: 없음. 다만 \"무한 대기 상태를 시스템에서 제거한다(타임아웃·재시도·에러\
    \ UI)\"는 원칙이 여기서 시작돼 Phase 50(픽커 hang)까지 이어진다."
- anchor: reference/perf-loading-realtime-history#1-2.-캐시·prefetch-아키텍처의-태동-(2026-04-21-~-05-13)
  doc: reference/perf-loading-realtime-history.md
  text: "### 1-2. 캐시·prefetch 아키텍처의 태동 (2026-04-21 ~ 05-13)\n\n- **참고 자료**: 커밋 `b7f82e9`,\
    \ `aa688d1`, `e09ac9c` + `63f797b`(3분 뒤 핫픽스)\n- **문제점**:\n  - 홈 → 찾기/채팅 탭 첫 진입마다\
    \ 네트워크 로딩.\n  - 홈의 여러 훅이 \"내 소속 클럽 ID\"를 각자 `club_members`에 중복 쿼리.\n  - 리스트가 `select('*')`로\
    \ 전 컬럼 수신.\n  - 채팅방 목록이 방 메타 → DM 프로필 → 아이콘 → 멤버 수 → 마지막 메시지를 순차(waterfall) 조회.\n\
    \  - **앱 재시작마다 캐시 전멸** - TanStack Query 캐시가 메모리뿐이라 콜드 스타트마다 빈 화면+스켈레톤.\n- **의사결정·구현**:\n\
    \  - `usePrefetchTabListsOnHome`(신설, 116줄): 홈에서 세션당 1회 club→game→chat 순차 prefetch.\
    \ ※ 이 훅은 이후 Phase 40에서 \"하드코딩 opt-in 리스트\"라는 이유로 **삭제**된다 - 초기 해법이 나중에 부채로 재분류된\
    \ 대표 사례.\n  - `getMyClubIds()`: `queryClient.fetchQuery` 캐시 기반으로 중복 네트워크 제거. `select('*')`\
    \ → 명시 컬럼.\n  - `lib/api/chat.ts`: waterfall → 2단 `Promise.all` 병렬화.\n  - **`lib/query-persister.ts`\
    \ 신설(e09ac9c)**: MMKV 기반 디스크 영속 + `PersistQueryClientProvider`. 화이트리스트 방식(실시간성\
    \ 키 제외), maxAge 24h, throttle 2s. 3분 뒤 `63f797b`로 웹(localStorage)/네이티브(MMKV 지연\
    \ 로드) 분기 핫픽스 - RN 전용 모듈 최상단 import가 웹을 깨는 멀티플랫폼 함정의 첫 기록.\n  - `useViewablePrefetch`:\
    \ 리스트에 보이는 아이템 상세를 세션당 1회 자동 prefetch.\n- **구현 후 지표**: 없음. 오프라인 재진입 stale-first\
    \ 체계의 시작점."
- anchor: reference/perf-loading-realtime-history#1-3.-Perceived-speed---"0ms-진입"-(2026-05-20-~-05-23)
  doc: reference/perf-loading-realtime-history.md
  text: "### 1-3. Perceived speed - \"0ms 진입\" (2026-05-20 ~ 05-23)\n\n- **참고 자료**:\
    \ 커밋 `b81d276`(perf(club): 상세 진입 perceived speed), `27087c8`(일정 즉시 표시)\n- **문제점**:\
    \ 상세 진입 시 club은 prefetch돼도 membership/positionHolders는 새로 로딩 → CTA 버튼·회장 칩 깜빡임.\
    \ 리스트 헤더 count가 로드된 페이지 기준이라 \"20+\"로 부정확. 웹 첫 쿼리마다 TLS 핸드셰이크 비용.\n- **의사결정·구현**:\n\
    \  - 리스트 캐시를 `placeholderData`로 재사용해 상세 **0ms 진입** (ClubDetailContext). 일정(recurrences)도\
    \ 목록 select에 컬럼을 추가해 같은 메커니즘으로 0ms 표시, 콜드 진입(딥링크)은 '미입력' 오표시 대신 스켈레톤.\n  - `prefetchClubDetail`이\
    \ club/membership/positionHolders 3쿼리 모두 워밍. persister 화이트리스트에 club 계열 추가.\n \
    \ - `fetchClubsCount()` 별도 count 쿼리로 헤더 총합 정확화.\n  - `gcTime` 1h → 24h (persister\
    \ maxAge와 정렬).\n  - `app/+html.tsx`에 Supabase `<link rel=\"preconnect\">` - 첫\
    \ 데이터 쿼리 **100~200ms 단축**(주석 기록).\n- **구현 후 지표**: \"0ms 진입/표시\"(캐시 히트 시), preconnect\
    \ 100~200ms. 이 placeholderData 패턴은 이후 채팅 프리페치(990cb50, 59 D1)의 참조 모델."
- anchor: reference/perf-loading-realtime-history#1-4.-번들·자산-다이어트-1차-(2026-05-15-~-05-21)
  doc: reference/perf-loading-realtime-history.md
  text: "### 1-4. 번들·자산 다이어트 1차 (2026-05-15 ~ 05-21)\n\n- **참고 자료**: 커밋 `fcae76e`(웹\
    \ 스플래시+정적 캐시), `2b2cc7e`(perf(bundle))\n- **당시 지표**: icon.png 838KB, Pretendard\
    \ otf 5종, 웹 JS 로드 전 빈 흰 화면.\n- **문제점**: 네이티브 번들에 폰트 5종·미사용 폰트·미압축 PNG. RN 기본 `<Image>`의\
    \ 약한 디스크 캐시. 콜드 스타트 첫 페인트가 인앱 업데이트 체크 네트워크와 경쟁. AsyncStorage 캐시 읽기와 세션 조회가 직렬.\n\
    - **의사결정·구현**:\n  - Pretendard 5종→3종(Regular/SemiBold/Bold, `WEIGHT_TO_FAMILY`\
    \ 매핑 흡수): **-3MB**. SpaceMono 삭제: -91KB. pngquant 70-90 일괄(icon 838→234KB): **-1MB**.\
    \ 합계 **네이티브 번들 ≈ -4MB**.\n  - 아바타·히어로 `<Image>` → `expo-image`(memory-disk 캐시).\n\
    \  - `useForceUpdate`를 `InteractionManager.runAfterInteractions`로 지연 - 첫 페인트와\
    \ 네트워크 경쟁 제거.\n  - AuthProvider: AsyncStorage read와 `getSession()` 병렬화.\n  - 웹:\
    \ `+html.tsx`에 순수 HTML/CSS 인라인 스피너(JS 로드 전 즉시 표시), `vercel.json`에 `/_expo/static/*`·`/assets/*`\
    \ `max-age=31536000, immutable`.\n- **구현 후 지표**: -4MB(커밋 메시지 실측). 이 트랙은 2026-07-28\
    \ 웹 번들 다이어트(§7-3)로 이어진다.\n\n---"
- anchor: reference/perf-loading-realtime-history#2.-시대-②---채팅-실시간성·안정성-(2026-05-23-~-07-19)
  doc: reference/perf-loading-realtime-history.md
  text: '## 2. 시대 ② - 채팅 실시간성·안정성 (2026-05-23 ~ 07-19)


    "카톡은 즉시 뜨는데 이건 지연이 확연하다"는 유저 체감에서 출발해, realtime 채널의 수명주기 전체(구독·끊김·zombie·포그라운드
    복귀·렌더 비용)를 단계적으로 정복한 흐름. 여기서 만든 복구 계층이 시대 ⑦(59)의 재사용 자산이 된다.'
- anchor: reference/perf-loading-realtime-history#2-1.-룸-채널-churn-제거-(2026-05-23)
  doc: reference/perf-loading-realtime-history.md
  text: '### 2-1. 룸 채널 churn 제거 (2026-05-23)


    - **참고 자료**: 커밋 `e9a2860` (전용 planning 문서 없음)

    - **문제점**: 채팅방에서 상대 메시지가 실시간으로 안 뜨고 staleTime(5분) 만료 후에야 보임.

    - **원인**: ① `useChatRealtime` effect deps에 `myProfile`/`partner`/`isGroup`이 들어
    있어 DM 진입 시 async 값이 채워질 때마다 채널 unsubscribe→resubscribe. **같은 topic을 빠르게 떼고 붙이면
    postgres_changes 바인딩이 조용히 끊긴다.** ② `messages` INSERT를 안읽음 채널과 목록 채널이 각각 무필터로 중복
    구독.

    - **의사결정·구현**: deps `[roomId]` 고정 + 패칭 값은 `ctxRef`로 읽어 방당 1회 구독. 중복 채널을 `useChatRealtimeSync`
    단일 채널로 통합하고 **상시 마운트되는 탭 레이아웃**에 배치. 구독 상태 로깅(`CHANNEL_ERROR` 등) 추가 - 이것이 Phase
    10 계측의 기반.

    - **구현 후**: 두 기기 DM 실시간 수신 확인.'
- anchor: reference/perf-loading-realtime-history#2-2.-Phase-10---끊김-복구·포그라운드-회복-(2026-05-31)
  doc: reference/perf-loading-realtime-history.md
  text: "### 2-2. Phase 10 - 끊김 복구·포그라운드 회복 (2026-05-31)\n\n- **참고 자료**: `planning/작업완료/10-chat-realtime-bugfix.md`,\
    \ 커밋 `117a7a5` (PR #39)\n- **당시 지표 (실측 - 이 프로젝트 최초의 체계적 성능 계측)**:\n  - 계측 방법:\
    \ Android 에뮬레이터 1대 + 로컬 Postgres 직접 INSERT로 상대 역할(`scripts/diag-chat-send.sh`),\
    \ `[DIAG P10]` 로그 수집.\n  - 결과: 포그라운드 수신은 빠름(음수 latency는 에뮬레이터 시계 skew). **백그라운드\
    \ 중 도착분은 realtime이 통째로 누락**(3건 INSERT → 수신 0건). 서버 재시작 시 전 채널 `CHANNEL_ERROR`\
    \ 수십 회 → `CLOSED` 방치, **재구독·refetch 0**. `AppState→active` 스냅샷은 항상 `connected:true`\
    \ - **죽는 것은 소켓이 아니라 채널**.\n  - 증상 5종: S1 실시간 미표시(영구 누락) / S2 푸시 탭 후 스켈레톤 무한 /\
    \ S3 콜드 스타트는 정상 / S4 확연한 지연(느린 회복) / S5 뱃지 미갱신(~5분 뒤).\n- **문제점(구조 결함 표 C0~C7)**:\
    \ 핵심은 C1(채널 실패 시 복구 없음 - subscribe 콜백이 `logger.warn`만)과 C3(warm=stale 서빙). C7(인증\
    \ 타이밍)은 **계측으로 반증되어 보류** - \"추측 픽스 금지\"의 실천.\n- **개선 방법 고안·의사결정**:\n  - **결정 ①\
    \ \"patch + 폴백 refetch\" 이중화**: realtime은 best-effort 가속으로 쓰고 정확성은 refetch가 진다.\
    \ SUBSCRIBED 시 1회 invalidate, 실패 시 invalidate+백오프 재구독. 이 원칙이 이후 모든 실시간 작업의 헌법이\
    \ 된다.\n  - **결정 ② AppState 포그라운드 재연결은 앱 레벨 단일 핸들러**: 소켓·inbox 재동기는 앱 레벨, 열린 방\
    \ refetch는 화면 focus effect - 이중 안전망. \"매 전이마다 소켓 강제 재접속\" 과욕은 경고로 기각.\n  - 채팅\
    \ 신선도: 짧은 staleTime(전역 오염) 대신 **진입/포커스 시 무조건 refetch**(국소 해결) 채택.\n- **구현**: `useResilientChannel`\
    \ 신설(지수 백오프 1s→30s 재구독 + onSubscribed invalidate + Sentry 집계), `useChatForegroundRecovery`\
    \ 신설(active 복귀 시 `realtime.connect()` + 목록·뱃지·홈 invalidate), ChatSkeleton(메시지\
    \ 버블형).\n- **구현 후 지표**: S1·S4 재현 시나리오 통과(이전엔 콜드 스타트 전까지 영구 누락). DoD로 세운 p50 ≤1s/p95\
    \ ≤3s 정량은 skew 보정 계측 후속으로 이월 - 이 부채가 59 A3(sync-latency 로거)에서 청산된다."
- anchor: reference/perf-loading-realtime-history#2-3.-콜드스타트-채팅-콜드로딩-해소-(2026-06-15)
  doc: reference/perf-loading-realtime-history.md
  text: '### 2-3. 콜드스타트 채팅 콜드로딩 해소 (2026-06-15)


    - **참고 자료**: 커밋 `990cb50`

    - **문제점**: `chat-rooms`/`chat-messages`가 persister 화이트리스트에 없어 앱 재시작마다 스켈레톤. `prefetchChatRoom`이
    메타만 데우고 메시지 본문은 안 데움.

    - **의사결정·구현**: 영속 정책을 RN 무의존 `lib/query-persist-policy.ts`로 분리(테스트 가능화)하고 채팅 키를
    화이트리스트에 추가. `prefetchInfiniteQuery`로 메시지 본문 prefetch. 진입 refetch 중복 제거는 "realtime
    누락 복구 장치라 회귀 위험"으로 **보류** - 이 중복은 59 D1에서 계측과 함께 제거된다.

    - **구현 후**: verifier-web localStorage 영속 확인 + 단위 3종.'
- anchor: reference/perf-loading-realtime-history#2-4.-Phase-41---총체적-안정화-3축-(2026-07-08)
  doc: reference/perf-loading-realtime-history.md
  text: "### 2-4. Phase 41 - 총체적 안정화 3축 (2026-07-08)\n\n- **참고 자료**: `planning/작업완료/41-chat-overhaul-stability-perf.md`,\
    \ 커밋 `3e8991c` (PR #99)\n- **당시 지표(성공 측정으로 세운 것)**: \"새 방 안 보임\" 재현율 0 / 백그라운드\
    \ 복귀 후 누락 0 / 읽음 이벤트 1건당 재렌더 = 변경 셀만(당시 전 가시 셀) / 셀당 Date 파싱 8→0.\n- **문제점 3축**:\n\
    \  - **A. 방 생성이 목록 캐시 신호가 못 됨**: 빈 DM이 상대 목록에 노출, 그룹방 생성 놓침(`chat_room_members`\
    \ INSERT 미구독), 정렬 하드코딩 버그.\n  - **B. 소켓 zombie 시 채널 영구 정지**: `CHANNEL_ERROR` 콜백에만\
    \ 의존해 SUBSCRIBED인 채 조용히 죽으면(zombie) 감지 불가. `isConnected()`가 zombie에 true. 원시 채널\
    \ 2개는 죽으면 영구 freeze. `refetchOnReconnect`가 NetInfo 미연결로 사문.\n  - **C. 렌더 고정비용**:\
    \ `extraData={membersReadAt}`이 읽음 UPDATE마다 전 가시 셀 무효화, 셀당 `new Date()` 5~8회, 전\
    \ 셀 reanimated worklet 4종 무조건 장착, landmine `fa941c1`(entering 레이아웃 애니가 웹 셀 높이\
    \ 0 붕괴).\n- **개선 방법 고안·의사결정**:\n  - **A(가장 중요): DM은 방을 미리 안 만든다 - 드래프트 흐름**. tap\
    \ 시 화면만 열고 첫 전송 시점에 `findOrCreateDm`. 대안 \"빈 DM도 실시간 양쪽 노출\"은 제품 요구와 정반대라 폐기.\n\
    \  - **B: zombie 감지는 전면 force-rebuild(방식 A)** - 채널별 last-received 가드(방식 B)보다 4~5개\
    \ 채널 전면 재구독이 저렴·즉시. heartbeat 콜백으로 트리거. `refetchOnReconnect`는 `'always'`가 아닌 `true`(refetch\
    \ 스톰 방지)로 NetInfo 연결, 독립 PR로 격리(단독 revert 가능).\n  - **C: extraData 제거는 셀 내부 select\
    \ 구독(방식 A)** - 숫자가 바뀐 tail 셀만 재렌더. Date 파싱은 모듈 `WeakMap` 메타 캐시. 애니메이션은 순수 `MessageRow`\
    \ + 조건부 `MessageEnter`(스타일 구동만 - 레이아웃 애니 금지 유지). inverted 리스트 전환은 실익 0 + 웹 리스크로\
    \ 채택 안 함.\n- **구현**: PR 7개. `lib/realtime-reconnect.ts` 신설(`forceReconnectAllChannels`\
    \ 레지스트리), `lib/supabase.ts` heartbeat 콜백, `lib/online-manager.ts`, 원시 채널 2곳 `useResilientChannel`로\
    \ 통일, `getMessageMeta` WeakMap, 셀별 `useMessageUnreadCount` select 구독.\n- **구현\
    \ 후 지표**: 드래프트 흐름·즉시 노출 verifier-web 확인, 읽음 연타 시 변경 셀만 갱신, 셀 붕괴 회귀(fa941c1) 게이트\
    \ 통과. `forceReconnectAllChannels`가 이후 모든 realtime 기능의 복원력 기반이 됨."
- anchor: reference/perf-loading-realtime-history#2-5.-Phase-42---알림-딥링크·인앱-배너-(2026-07-09)
  doc: reference/perf-loading-realtime-history.md
  text: '### 2-5. Phase 42 - 알림 딥링크·인앱 배너 (2026-07-09)


    - **참고 자료**: `planning/작업완료/42-chat-notification-deeplink-active-room-suppression.md`

    - **문제점**: 포그라운드 수신 리스너 부재, 콜드 스타트 시 알림 응답 이벤트가 리스너 등록 전에 유실 → 목적지 직행 실패.

    - **의사결정**: OS/인앱 배너 이중 표시는 4종(`BANNERABLE`)만 OS 억제로 방지. 아바타는 payload 적재(서버 수정)
    기각, 클라 캐시 우선 조립 채택. 애니메이션은 entering 프리셋 금지(웹 absolute 잔존 회귀) → 스타일 구동 `EntranceFade`.
    콜드 스타트는 `getLastNotificationResponseAsync` + identifier dedupe.

    - **구현 후 지표(목표)**: 콜드 스타트 목적지 직행 0→~100%, 서버 diff 0줄. 실기기 검증 항목.'
- anchor: reference/perf-loading-realtime-history#2-6.-supabase-js-2.110-채널-재사용-크래시-핫픽스-(2026-07-19)
  doc: reference/perf-loading-realtime-history.md
  text: '### 2-6. supabase-js 2.110 채널 재사용 크래시 핫픽스 (2026-07-19)


    - **참고 자료**: 커밋 `a06a6a5` (PR #148)

    - **문제점**: 설정 화면 재진입 반복 시 크래시. supabase-js 2.99→2.110 회귀로 `client.channel(topic)`이
    같은 topic 채널을 재사용(dedup)하는데, 이미 subscribe된 채널에 `.on(''postgres_changes'')`를 추가하면
    throw. `removeChannel`이 async라 재구독·리마운트가 겹치는 순간 옛 채널을 집음.

    - **의사결정·구현**: topic에 고유 접미 `#n`을 붙여 dedup을 원천 차단(`uniqueRealtimeTopic`). 옛 채널은
    `useResilientChannel`이 remove하므로 누수 없음. 채널 4곳 적용.

    - **교훈**: 라이브러리 마이너 업데이트가 realtime 수명주기 가정을 깰 수 있다 - CLAUDE.md의 "학습 컷오프 이후 API
    변경 잦음, 의심 시 공식 문서" 원칙의 실제 사례.


    ---'
- anchor: reference/perf-loading-realtime-history#3.-시대-③---개별-화면-데이터-로딩-적정화-+-계측-인프라-(2026-06-01-~-06-04)
  doc: reference/perf-loading-realtime-history.md
  text: '## 3. 시대 ③ - 개별 화면 데이터 로딩 적정화 + 계측 인프라 (2026-06-01 ~ 06-04)'
- anchor: reference/perf-loading-realtime-history#3-1.-Phase-16---유저-관리-리스트-(2026-06-01)
  doc: reference/perf-loading-realtime-history.md
  text: "### 3-1. Phase 16 - 유저 관리 리스트 (2026-06-01)\n\n- **참고 자료**: `planning/작업완료/16-admin-user-list-performance.md`,\
    \ 마이그레이션 `00102_admin_user_list_rpc.sql`\n- **당시 지표·문제점**: `profiles` **전 행을 limit\
    \ 없이 수신** 후 클라이언트에서 검색(`includes`)·필터·카운트 - 유저 수에 선형으로 느려짐. 근본 원인: \"한 화면에 다 그릴\
    \ 것도 아니면서 전체를 받아 클라에서 후처리\".\n- **의사결정**:\n  - 서버 `.range()` 오프셋 페이징(페이지당 20)\
    \ + `useInfiniteQuery`. keyset은 수만 행 이상에서 후속 전환으로 리스크 표에 기록.\n  - 검색은 `ilike`\
    \ 서버 처리 + **디바운스 300ms**(`useDebouncedValue` 첫 도입 - Phase 47에서 전수 확산).\n  - 칩\
    \ 카운트는 리스트 쿼리에 합치지 않고 별도 경량 RPC(`admin_user_counts`)로 분리.\n  - 최근 활동일은 `auth.users.last_sign_in_at`을\
    \ SECURITY DEFINER RPC로 노출(PII라 super_admin 전용). 상세는 캐시 의존 대신 단건 RPC(딥링크 직진입에도\
    \ 동작).\n  - `pg_trgm`을 `WITH SCHEMA extensions`로 설치 - Phase 47이 재사용하는 선례.\n- **구현\
    \ 후**: 로컬 RPC 런타임 검증(가드/검색/필터/카운트), 게이트 통과. 첫 페이지 20행 고정."
- anchor: reference/perf-loading-realtime-history#3-2.-Phase-17---지도-데이터-로딩-규모-적정화-(2026-06-01)
  doc: reference/perf-loading-realtime-history.md
  text: "### 3-2. Phase 17 - 지도 데이터 로딩 규모 적정화 (2026-06-01)\n\n- **참고 자료**: `planning/작업완료/17-map-data-loading.md`\
    \ (PR #47)\n- **당시 지표**: 클럽 현재 ~50개, 계획 천장 ~2000개. `fetchClubsForMap`이 무거운 select\
    \ + `.limit(200)`.\n- **문제점**: ① `limit(200)` **사일런트 컷** - 200개 초과분이 에러 없이 지도에서\
    \ 소실(천장 가정 시 최대 1800개 누락). 성능 이전에 정확성 버그. ② 마커에 과한 select(description·recurrences·age_range).\
    \ ③ viewport 카드 10개는 과다.\n- **개선 방법 고안 (대안 비교 표)**:\n\n  | 전략                \
    \               | 적합 규모 | 판정                                                 \
    \       |\n  | ---------------------------------- | --------- | -----------------------------------------------------------\
    \ |\n  | 전체 로드 + 클라 클러스터링 (현행) | ~수천     | ✅ 유지. 1쿼리·패닝 재요청 0·오프라인 stale-first\
    \           |\n  | viewport bbox 로드 (부동산식)      | 수천~수만 | ❌ 과설계. 패닝마다 왕복(현재 0회)\
    \ → 체감 악화, 캐시 파편화 |\n  | 줌별 서버 집계                     | 수만~     | ❌ RPC+PostGIS\
    \ 복잡도 대비 효용 0                           |\n\n- **의사결정**: **방향 전환 없음, 세 곳만 수선**.\
    \ limit은 \"예상치에 맞추는 값이 아니라 정상이면 절대 안 닿는 폭주 방어 캡\"으로 개념 재정의 → `MAP_FETCH_LIMIT=4000`(천장×2)\
    \ + 캡 90% 근접 시 dev 경고. 재검토 트리거(실수 3000 상시 초과 시 viewport 승격)를 코드 주석에 명문화. select에서\
    \ 미사용 필드 제거, 카드 10→5.\n- **교훈**: \"부동산 앱처럼\"이라는 벤치마크 발상을 실규모 데이터로 반박한 첫 사례. 이후\
    \ 47(외부 검색엔진 기각)·59(APM 기각)에서 같은 논법이 반복된다."
- anchor: reference/perf-loading-realtime-history#3-3.-Phase-24---계측·확장성-인프라-(2026-06-04)
  doc: reference/perf-loading-realtime-history.md
  text: '### 3-3. Phase 24 - 계측·확장성 인프라 (2026-06-04)


    - **참고 자료**: `planning/작업완료/24-scalability-product-infra.md` (PR #59)

    - **성능 역사에서의 위치**: 화면 개선이 아니라 **성능을 측정·보호하는 기반**. PostHog 분석은 RN SDK 대신 capture
    HTTP API(fetch 직접 전송) 채택 - 의존성 0·플랫폼 분기 0, "분석 SDK가 콜드스타트를 저하시키지 않게" no-op 가드
    + lazy init를 DoD에 명시. RN 버전 exact 고정, 배포 게이트 CI 승격, 공유 링크 헬스체크(본문 마커 검사).


    ---'
- anchor: reference/perf-loading-realtime-history#4.-시대-④---React-Query-캐시-반영-지연-(2026-07-01-~-07-09)
  doc: reference/perf-loading-realtime-history.md
  text: '## 4. 시대 ④ - React Query 캐시 반영 지연 (2026-07-01 ~ 07-09)


    "앱이 느리게 반영돼요"라는 체감의 정체를 밝히고 3개의 축(refetchType / persist 정책 / 무효화 키 누락)으로 분해해 각개격파한
    흐름. **빌드나 네트워크가 아니라 캐시 정책이 범인이었다.**'
- anchor: reference/perf-loading-realtime-history#4-1.-Phase-31---교차-화면-반영-지연:-refetchType-계층화-(2026-07-01-~-07-02)
  doc: reference/perf-loading-realtime-history.md
  text: "### 4-1. Phase 31 - 교차 화면 반영 지연: refetchType 계층화 (2026-07-01 ~ 07-02)\n\n\
    - **참고 자료**: `planning/작업완료/31-cache-invalidation-reflection.md`, 커밋 `6943f72`(PR\
    \ A) `f622203`(PR B) `346384c`(PR C), DECISIONS 문맥\n- **당시 지표 (grep 실측)**:\n \
    \ - `invalidateQueries` 총 **105곳**, 그중 `refetchType` 명시 **1곳**.\n  - 105곳 중 **62%(65곳)가\
    \ 교차 화면** 무효화인데 전부 기본값 `refetchType:'active'`.\n  - 목표: 미표기 교차 화면 호출 64 → 0 (길목\
    \ 커버 기준).\n- **문제점**: \"내가 방금 한 행동이 다른 화면에 바로 안 뜬다\". 폼 제출 시점에 unmount 상태인 다른\
    \ 화면 목록은 `'active'` 기본값 때문에 stale 표시만 되고, 진입할 때 **옛 캐시가 먼저 뜨고 왕복 뒤 \"뿅\" 갱신**된다.\n\
    - **핵심 통찰**: 근본 원인은 무효화 방식이 아니라 **\"내 쓰기를 반영하는 도구 선택\"**. invalidate→refetch는\
    \ 구조적으로 왕복 후 반영이라 즉시성이 필요한 액션엔 애초에 부적합. 그리고 통점 대부분이 폼→목록 흐름이며 이미 공통 길목(폼 훅·useDeleteEntity·useRequestAction)을\
    \ 지나므로 65곳이 아니라 **길목 ~8곳** 수정으로 8할이 해결된다.\n- **개선 방법 고안 (Tier 계층화 - 이 시대의 가장 중요한\
    \ 결정)**:\n\n  | 계층   | 대상                                     | 도구           \
    \            | 근거                                                            \
    \                 |\n  | ------ | ---------------------------------------- | --------------------------\
    \ | --------------------------------------------------------------------------------\
    \ |\n  | Tier A | 폼 제출/액션 → 다른 화면 목록            | `refetchType:'all'`        |\
    \ 이동하는 동안 미리 당겨 \"거의 즉시\". 폼에 낙관적은 오버킬(서버 id·파생필드 모름) |\n  | Tier B | 즉시성 토글(승인·투표·좋아요)\
    \            | 낙관적 setQueryData + 롤백 | \"누르자마자 뜬다\"                          \
    \                                      |\n  | Tier C | 같은 화면·상시 마운트 뱃지·realtime\
    \ 구동 | 기본값 유지                | 이미 즉시. 손대면 낭비 refetch                         \
    \                          |\n\n  기각: 전역 defaultOptions 변경·staleTime 인하(오프라인 이점\
    \ 파괴 + refetch storm + CLAUDE.md 규약 충돌), invalidate 래퍼 전면 마이그레이션(105곳 비용, 후속으로).\n\
    \n- **의사결정 디테일**: `refetchType:'all'`의 네트워크 비용 증가는 **prod ~90명 규모에서 무시 가능**으로\
    \ 판단. Tier C를 \"일관성\" 명목으로 Tier A에 욱여넣지 말라는 과표준화 경고를 문서에 명시.\n- **구현**: PR A(제네릭\
    \ 길목 2훅) → PR B(폼/액션 훅 10파일 - 교차 화면 키만 'all', 같은 화면 키는 유지) → PR C(회원 승인 낙관적 파일럿:\
    \ `handleAction`을 `Promise<boolean>`으로 바꿔 롤백 판단, 임시 멤버 즉시 삽입 + 실패 시 스냅샷 복원).\n\
    - **구현 후 지표**: `refetchType:'all'` 41곳. verifier-web 양성 2종(정보 수정 → 목록 재진입 즉시 최신\
    \ / 승인 → 목록 즉시 노출). 전역 설정 변경 0줄. 게이트 전부 통과(166 tests)."
- anchor: reference/perf-loading-realtime-history#4-2.-Phase-40---persist-정책-반전:-allowlist-→-denylist-(2026-07-05)
  doc: reference/perf-loading-realtime-history.md
  text: "### 4-2. Phase 40 - persist 정책 반전: allowlist → denylist (2026-07-05)\n\n\
    - **참고 자료**: `planning/작업완료/40-query-cache-policy-simplification.md`, 커밋 `599aa5c`\
    \ (PR #86), **DECISIONS 0008**\n- **당시 지표 (grep 전수)**:\n  - persist 화이트리스트 **10개**\
    \ vs 실제 `qk.*` 키 계열 **58개** → **48개 계열이 새로고침 시 무캐시 → 스켈레톤**. 커버리지 **17%**.\n \
    \ - 프리페치 훅(1-2에서 만든 `usePrefetchTabListsOnHome`) 140줄이 하드코딩 4키를 데우는데, 그중 3키는 persist\
    \ 화이트리스트에 없어 **두 캐시 메커니즘이 서로 다른 키 집합을 커버하는 불일치**.\n  - 유저 통점: 알림 화면이 새로고침·첫 진입\
    \ 양쪽 다 스켈레톤(어느 리스트에도 없어서).\n- **핵심 통찰**: \"끝없이 고치는 원인은 캐싱이 아니라 **예외가 기본값인 3중 opt-in\
    \ 리스트**(persist 화이트리스트·프리페치 하드코딩·화면별 staleTime)다. 사람이 항목 추가를 기억해야 하는 구조는 반드시 드리프트한다.\"\
    \n- **의사결정**: 극성 반전 - 기본 영속 + **명확한 사유 3범주만 제외**: ① 초휘발성 카운터(unread-* 등 - stale\
    \ 표시가 거짓정보) ② 프라이버시 민감(admin-* - 타 유저 데이터를 localStorage 평문에 안 남김) ③ 의도적 staleTime\
    \ 0(share-*). 프리페치 훅은 반전으로 redundant → **삭제(140줄)**. 렌더 계약 성문화: 스켈레톤은 콜드(`!data\
    \ && isLoading`)에만, 백그라운드 fetch엔 이전 데이터 유지. buster `v2-whitelist`→`v3-denylist`(안\
    \ 바꾸면 옛 정책 캐시와 섞여 비결정적). 기각: 화이트리스트 유지(근본 원인 미해결), 전부 무조건 영속(3범주가 실제 위험).\n- **구현\
    \ 후 지표 (verifier-web 실측)**: 전체 브라우징 후 직렬화 **35.1KB**(localStorage 5MB 한계 대비 무시\
    \ 가능 - infinite 쿼리 우려를 추측이 아닌 실측으로 해소). denylist 누수 0. 알림 영속 확인. 커버리지 17% → 70%+(41/58).\
    \ **새 화면 추가 시 캐시 부기 2~3곳 → 0곳.**"
- anchor: reference/perf-loading-realtime-history#4-3.-Phase-40의-부작용-마감-2건-(2026-07-06)
  doc: reference/perf-loading-realtime-history.md
  text: '### 4-3. Phase 40의 부작용 마감 2건 (2026-07-06)


    - **참고 자료**: 커밋 `3afe027`, `8cda98f`

    - **후속 A - pending dehydrate 경고**: denylist 오버라이드가 RQ 기본의 `status===''success''`
    검사를 삼켜 진행 중 쿼리까지 영속 → fetch 취소 시 "dehydrated as pending ended up rejecting" 경고.
    `shouldPersistQuery`에 success 조건 복원.

    - **후속 B - 탈퇴·삭제한 동호회 일정이 개인 캘린더에 잔존**: 탈퇴/삭제 흐름이 `myClubIds`·`clubSchedules`·`upcomingEventsForUser`를
    무효화하지 않았는데, **denylist 반전으로 이 키들이 자동 영속되면서 stale이 재시작에도 살아남아** 잠복 버그가 표면화. 두 성공
    핸들러에 순서 있는 무효화(`myClubIds` 먼저) 추가.

    - **교훈**: 캐시를 더 오래 살리는 개선은 무효화 누락을 증폭시킨다. 영속 범위를 넓힐 때 무효화 감사(audit)가 세트다.'
- anchor: reference/perf-loading-realtime-history#4-4.-Phase-43---claim-수락-반영-지연:-무효화-키-누락-(2026-07-09)
  doc: reference/perf-loading-realtime-history.md
  text: '### 4-4. Phase 43 - claim 수락 반영 지연: 무효화 키 누락 (2026-07-09)


    - **참고 자료**: `planning/작업완료/43-club-claim-accept-latency-my-club-banner.md`, 커밋
    `10ff925`

    - **당시 지표**: 운영자 claim 수락 후 클럽이 shared→managed로 바뀌는 데 **최대 5분**(staleTime) 또는
    재시작 전까지. pending 행 제거는 2연속 왕복 뒤.

    - **원인 (진단이 핵심)**: Phase 31이 이미 `useRequestAction`에 `refetchType:''all''`을 넣었으므로
    **이번엔 refetchType 문제가 아니라 무효화 대상 키 누락** - `invalidateKeys` 4개에 UI 전체를 게이트하는 `qk.club(id)`가
    빠져 있었다. 서버 RPC는 정상(서버 diff 0줄).

    - **의사결정**: 방식 A(키 1줄 추가 - "한참"은 제거되나 2 RTT) vs 방식 B(A + 낙관적 반영). **B를 점진 안전판으로**:
    최소 지점(A)을 먼저 커밋하고 낙관적을 얹음. `qk.club(id)`를 공용 `useRequestAction`에 넣지 않고 **호출부에만**(claim만
    registration_type을 바꾸므로 - 가입 수락까지 클럽 상세를 refetch시키는 과잉 방지).

    - **구현 후 지표**: managed 반영 **최대 5분 → ~0초**, pending 행 제거 왕복 2→1(낙관 시 체감 0). verifier-web에서
    하드 리로드 없는 back 복귀로 캐시 반영을 검증(캐시 검증 방법론).


    ---'
- anchor: reference/perf-loading-realtime-history#5.-시대-⑤---부팅·로그인-로딩-흐름-(2026-07-05-~-07-06)
  doc: reference/perf-loading-realtime-history.md
  text: '## 5. 시대 ⑤ - 부팅·로그인 로딩 흐름 (2026-07-05 ~ 07-06)


    이틀간 6커밋의 연속 서사. 문서보다 커밋 메시지에 근거가 담겨 있다. **"화려한 로딩 연출 < 빠르고 안 끊기는 진입"으로 우선순위가 수렴한
    과정** 자체가 기록 가치.


    - **참고 자료**: 커밋 `07588ef` → `b9c4d63` → `5bf5dc6` → `1bdfbb8` → `d1eb432` → `31779cb`


    | 단계                  | 문제                                                                                                        |
    결정·구현                                                                                                                                                                                                            |

    | --------------------- | -----------------------------------------------------------------------------------------------------------
    | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
    |

    | `07588ef` (7/5 00:30) | 스플래시에서 D+ 구력 연출을 하려던 계획이 부적절                                                            |
    D+를 인앱 로딩으로 이동. `EntryLoading` 신설(D+ 롤링 variant A / ''시작해볼까요?'' variant B), 스플래시는
    인디터미네이트 바로 단순화                                                                                   |

    | `b9c4d63` (7/5 01:39) | EntryLoading이 auth/callback에만 있어 실제 로그인 경로(웹 카카오·이메일)에선
    **로그인 화면에 머문 채 로딩** | 세션 생성/OAuth 복귀 시 폼 대신 EntryLoading. 코드 교환 10s grace 초과 시
    폼+에러 폴백(로딩 갇힘 방지). `MIN_ENTRY_MS(2400)` 홀드로 연출이 플래시로 잘리지 않게                                                      |

    | `5bf5dc6` (7/5 03:05) | 부팅 화면 전환이 하드컷으로 툭 끊김                                                                         |
    `Crossfade` 신설 - **스타일 구동 opacity로 구현**(웹 FadeIn/FadeOut absolute 잔존 회귀 회피, Phase
    41·42와 같은 landmine 대응). Reduce Motion 시 즉시 교체                                                           |

    | `1bdfbb8` (7/5 21:09) | ① In-App Update Immediate 모드가 매 콜드 스타트마다 전체화면 차단 ② "EntryLoading
    → 홈 스피너" 2단 로딩     | ① Immediate→**Flexible**(백그라운드 다운로드) ② `useWarmHomeData`
    신설 - 세션 등장 즉시 홈 3쿼리를 홈과 동일 키로 프리페치, EntryLoading 동안 캐시를 데워 **2단→1단**                                                |

    | `d1eb432` (7/5 21:35) | 고정 2.4초 타이머는 데이터 준비와 무관                                                                      |
    **데이터 기반 게이트**: 3쿼리 settled까지 EntryLoading 유지, 하한 MIN 2.4s(연출 완주)·상한 MAX 8s(오프라인
    무한대기 방지). 스코프는 새 로그인(빈 캐시)만 - 재방문 콜드스타트는 Phase 40 denylist persist가 이미 커버 |

    | `31779cb` (7/6 08:55) | 로딩의 D+ 연출이 ① 홈 스탯 카드와 중복 ② 프로필 로딩 전 ''B→A'' 리마운트 **flicker의
    원인**                   | D+ 롤링을 홈 스탯 카드로 이관(`RollingDday`, 세션 1회 롤업), EntryLoading은
    variant B 단일화 → **flicker 원천 소멸**                                                                                                 |


    **교훈**: 연출(D+ 롤링)을 위해 만든 로딩 시간이 flicker와 중복을 낳자, 연출을 로딩에서 걷어내고 상주 위치로 옮기는 것으로
    해소했다. 로딩 화면의 책임은 "데이터가 준비될 때까지 끊기지 않게 버티기"뿐이다.


    ---'
- anchor: reference/perf-loading-realtime-history#6.-시대-⑥---검색-성능과-응답성-hang-(2026-07-13-~-07-16)
  doc: reference/perf-loading-realtime-history.md
  text: '## 6. 시대 ⑥ - 검색 성능과 응답성 hang (2026-07-13 ~ 07-16)'
- anchor: reference/perf-loading-realtime-history#6-1.-Phase-47---커뮤니티-검색·인기-정렬-최적화-(2026-07-13)
  doc: reference/perf-loading-realtime-history.md
  text: "### 6-1. Phase 47 - 커뮤니티 검색·인기 정렬 최적화 (2026-07-13)\n\n- **참고 자료**: `planning/작업완료/47-community-search-optimization.md`,\
    \ 커밋 `8f961ae`, 마이그레이션 `00119_community_search_indexes.sql`, **DECISIONS 0012**\n\
    - **당시 지표 (로컬 합성 5만 건, EXPLAIN ANALYZE, 트랜잭션 내 실험 후 ROLLBACK)**:\n\n  | 쿼리   \
    \                     | 인덱스 전                      | 인덱스 후                | 배율\
    \     |\n  | --------------------------- | ------------------------------ | ------------------------\
    \ | -------- |\n  | `ILIKE '%리베로%'` (3글자+) | 28.3ms Seq Scan(49,951행 버림) | 0.12ms\
    \ Bitmap Index Scan | **×232** |\n  | `ILIKE '%수비%'` (2글자)    | 27.4ms       \
    \                  | 27.4ms (인덱스 못 탐)    | ×1       |\n  | 인기 정렬 LIMIT 20    \
    \      | 6.8ms Seq Scan+sort            | 0.04ms Index Scan        | **×170**\
    \ |\n\n  추가: 디바운스 0 + 최소 글자수 0이라 타이핑 글자 수만큼 풀스캔 쿼리 발화(같은 패턴이 클럽·스크리미지 포함 `ilike`\
    \ 7곳).\n\n- **핵심 통찰**: ① pg_trgm은 3글자 미만 패턴에 인덱스를 못 쓴다(최소 글자수 정책 = 인덱스 정책). ②\
    \ **한국어엔 trigram이 FTS보다 정답** - Postgres tsvector는 한국어 형태소 분석기 부재(\"배구를\"≠\"배구\"\
    ), trigram은 문자 단위라 조사가 붙어도 부분일치. 현행 `ilike` 방식 자체가 옳았고 인덱스만 빠진 것이라 **앱 코드 무변경**으로\
    \ 해결 가능.\n- **의사결정**: trigram GIN 채택 / FTS 기각(토크나이저 부재) / 외부 검색엔진 기각(~90명에 과잉,\
    \ 10만 건+ 시 재논의). 최소 글자수는 3이 인덱스에 좋으나 배구 도메인 핵심어가 2글자(\"배구\",\"세터\")라 **2글자로 결정**하고\
    \ 2글자 Seq Scan(27ms@5만)은 수용. 디바운스는 쉘 내부가 아니라 **소비처에서 파생 값만**(쉘 내부면 한글 IME 조합이\
    \ 깨짐). 게이트·인덱스는 **커뮤니티만**(무한 증가 UGC), 클럽·스크리미지는 상한 있는 운영 데이터라 디바운스만 - 조건이 다른 걸\
    \ 억지로 통일하지 않는다는 과표준화 경고.\n- **구현 중 발견한 함정**: 벌크 INSERT 직후 GIN fastupdate pending\
    \ list 때문에 플래너가 인덱스를 안 탐(실측) → 인덱스를 `WITH (fastupdate = off)`로 생성해 근본 제거(재실측 0.144ms).\n\
    - **구현 후 지표**: 검색 ×232·인기 ×170(음성 검증: 트랜잭션 내 DROP INDEX로 28ms 회귀 재현 - 인덱스가 실제\
    \ 원인임을 증명). 타이핑당 서버 요청 4~5건 → 1건. \"지금 규모엔 체감 없는, 성장 시 장애를 선제 제거하는 보이지 않는 개선\"\
    으로 성격을 문서에 명시."
- anchor: reference/perf-loading-realtime-history#6-2.-Phase-50---이미지-픽커-무반응(hang)-복구-(2026-07-16)
  doc: reference/perf-loading-realtime-history.md
  text: '### 6-2. Phase 50 - 이미지 픽커 무반응(hang) 복구 (2026-07-16)


    - **참고 자료**: `planning/작업완료/50-image-picker-hang-recovery.md`, **DECISIONS 0017**

    - **문제점**: "사진 버튼이 아예 안 먹힌다". Android에서 픽커 도중 액티비티 재생성 시 expo-image-picker 코루틴
    미재개 → JS Promise 영구 pending(`isPending` 고착으로 모달 버튼 전체 사망) + 네이티브 `isPickerOpen`
    래치(프로세스 전역, 이후 모든 픽이 조용히 즉시 취소). **권한은 원인이 아님을 소스 레벨로 확인**(시스템 포토 픽커는 무권한) - 오히려
    기존 권한 가드가 Android 12 이하를 오차단.

    - **의사결정**: 전역 포그라운드 회수(기각 - 플로우 문맥 소실로 라우팅 불가) / patch-package 네이티브 수정(기각 - SDK
    업그레이드마다 파손) / 고정 타임아웃(기각 - 갤러리 장시간 탐색이 정상 UX) vs **픽 호출 컨텍스트 안의 워치독 래퍼(채택)**:
    active 복귀 + 5초 유예 후 `getPendingResultAsync()`로 결과 회수해 원 플로우를 잇고, 실패 시 한국어 에러 throw로
    고착을 푼다. 래치 의심은 3중 AND 휴리스틱으로 감지해 재시작 안내.

    - **구현 후 지표**: 무반응 경로 4곳 → 0곳. TDD 유닛 9종(회수 경로 사보타주 음성 검증 포함), 호출처 4곳 수정 0(래퍼가
    기존 에러 통로로 흐름).

    - **역사적 위치**: 시대 ①의 "무한 대기를 시스템에서 제거"(타임아웃·재시도) 원칙이 네이티브 모듈 결함까지 확장된 종착점.


    ---'
- anchor: reference/perf-loading-realtime-history#7.-시대-⑦---앱-전체-실시간-동기화-아키텍처:-Phase-59-(2026-07-28-~-07-29)
  doc: reference/perf-loading-realtime-history.md
  text: '## 7. 시대 ⑦ - 앱 전체 실시간 동기화 아키텍처: Phase 59 (2026-07-28 ~ 07-29)


    이전 시대들의 종합. 채팅에서 검증한 복구 계층(②) + 캐시 규율(④) + 계측 문화(③⑥)를 **앱 표준 아키텍처**로 승격했다.


    - **참고 자료**: `planning/작업완료/59-realtime-sync-architecture.md`, **DECISIONS 0021**,
    커밋 `972f939`(A1) `81acafc`(A2·A3) `5c323c7`(B) `7acbcd3`(C1) `129405c`(C2) `2097a48`(C3·C4)
    `7507fa6`(D1) `cc79e37`+`50e3dcc`(D2 구현·기각 롤백) `3227879`(D3) `8757d05`(E), 마이그레이션
    00154~00160'
- anchor: reference/perf-loading-realtime-history#7-1.-당시-지표-(착수-전-실측,-§2)
  doc: reference/perf-loading-realtime-history.md
  text: '### 7-1. 당시 지표 (착수 전 실측, §2)


    - 실시간 구독이 채팅·알림에만 4개(postgres_changes). 커뮤니티·클럽 훅에는 **0건**.

    - invalidate 179곳은 전부 "내 캐시"만 갱신 - **다른 유저**는 같은 글을 보고 있어도 아무 신호를 못 받는다.

    - 타 유저 변경의 반영 지연(정량): 전역 staleTime 5분 + focus refetch 화면이 앱 전체 2개뿐 → 화면을 계속 보고
    있으면 **무한정**, 재마운트해도 최대 **5분** stale. "실시간으로 잘 되나요?"의 실제 답은 "채팅 외에는 아니다".

    - postgres_changes의 구조적 한계(Supabase 소스 확인): WAL 변경 1건마다 구독자별 RLS 검사가 선형, 테넌트 100
    events/sec 초과분 **조용히 드롭** - 화면 구독을 이 방식으로 늘리면 막다른 길.'
- anchor: reference/perf-loading-realtime-history#7-2.-의사결정-(DECISIONS-0021로-성문화)
  doc: reference/perf-loading-realtime-history.md
  text: '### 7-2. 의사결정 (DECISIONS 0021로 성문화)


    - **전달 수단(가장 중요)**: postgres_changes 확장(기각 - 선형 RLS·드롭) / Edge Function fanout(기각
    - 콜드스타트·새 장애점) / **Broadcast from Database 채택**(`realtime.broadcast_changes` 트리거
    + private 채널, 인가는 구독 시점 1회).

    - **전환 전략(운영자 결정 2026-07-28)**: 신규 표면(댓글·공지·멤버십)은 처음부터 Broadcast, **검증된 채팅 postgres_changes
    4개는 신규 인프라 안정 운영 후 마지막(Phase E)에 이관** - 검증 안 된 인프라로 핵심 기능을 재작성하지 않는다.

    - **갱신 규칙 성문화**: 잦은 이벤트(채팅 메시지)는 payload delta(`setQueryData`), 드문 이벤트(공지·멤버십)는
    invalidate. 어느 쪽이든 재구독·focus 시 HTTP refetch가 정합성을 소유 - delta는 지연 최적화이지 정합성 수단이
    아니다.

    - **기각 목록**: 화면별 주기 폴링(배터리·부하 대비 무익), 전면 optimistic(롤백 복잡도), 전용 APM(Date.now 단순
    계측으로 충분), 모든 화면 실시간화(저빈도 화면은 focus refetch + user 채널 신호로 충분).

    - **가명 경계(45D)**: `post:{id}` payload에 실명·본문을 싣지 않음(차단 필터 RLS 우회 방지 - C1에서 delta가
    아닌 invalidate로 결정 변경된 이유).

    - **계측 우선**: "Phase D 채팅 최적화는 계측 후에만 착수" - A3에서 sync-latency 로거(dev 로그 + Sentry
    breadcrumb 1% 샘플)를 먼저 깔고 baseline 확보.'
- anchor: reference/perf-loading-realtime-history#7-3.-구현과-실측-(Phase별)
  doc: reference/perf-loading-realtime-history.md
  text: "### 7-3. 구현과 실측 (Phase별)\n\n- **A (일반화)**: push-data-sync를 chat_message 1종\
    \ → NotificationType 27종 매핑으로, `useChatForegroundRecovery` → `useForegroundRecovery`\
    \ 승격, sync-latency 계측 삽입.\n- **B (인프라)**: `realtime.messages` RLS(user/post/club\
    \ 채널 인가) + `emit_domain_event` 래퍼(EXCEPTION 삼킴 - 발행 실패가 원 쓰기를 막지 않게) + `useRealtimeScreen`\
    \ 표준 훅(useResilientChannel 위 합성) + 전역 `user:{userId}` 채널.\n- **C (화면 적용)**: C1\
    \ 커뮤 글 상세 댓글 반영 **356~399ms** 실측(1초 목표 충족). C2 클럽 상세 **355~364ms** - 음성 프로브가 super_admin\
    \ 비멤버 클럽의 Unauthorized 재시도 폭주를 실측으로 발견 → RLS 예외(00157) + Unauthorized 시 백오프 중단으로\
    \ 해소. C3 회원 관리는 refetchOnMount로 충분(과표준화 회피). C4 댓글 낙관적 삽입.\n- **D (채팅 지연 제로)**:\
    \ D1 계측이 **pressIn 프리페치 직후 focus refetch가 같은 데이터를 중복 요청**함을 발견(2-3에서 보류했던 그 중복)\
    \ → 3초 신선도 게이트로 제거, 방 진입 **480ms → 132ms**. 푸시 탭 딥링크는 알림 탭 시점 프리페치로 워터폴을 네비게이션\
    \ 300ms와 병렬화. **D2 typing indicator는 구현·2계정 검증까지 마쳤으나 운영자 결정으로 기각·롤백** - \"입력\
    \ 중\" 표시가 제품 방향과 안 맞음. 완성도가 아니라 제품 판단으로 기능을 버린 기록. D3 메시지 삭제(본인 delta 23ms, 상대\
    \ 225ms).\n  - **D-보너스(2계정 검증 중 발견)**: 세션 복원 전 구독이 익명 claims로 SUBSCRIBED되어 WALRUS\
    \ RLS가 이벤트를 조용히 거르는 무배달 버그 - userId 게이트로 수정. 푸시 탭 콜드스타트 \"안 보임\" 제보의 유력한 실제 원인.\n\
    - **E (이관 완성)**: messages 트리거 → `room:{id}` Broadcast(payload는 raw row - community_dm\
    \ 실명 와이어 유출 방지), inbox·unread 채널을 user 채널로 수렴. **앱 내 postgres_changes 구독 0 달성.**\
    \ 메시지 수신·삭제 전파 ~100ms, 목록 fan-out ~1s, 오프라인 복구 306ms(리로드·포커스 없이 자동 회수 실측)."
- anchor: reference/perf-loading-realtime-history#7-4.-구현-후-지표-종합
  doc: reference/perf-loading-realtime-history.md
  text: '### 7-4. 구현 후 지표 종합


    | 지표                          | Before                | After                    |

    | ----------------------------- | --------------------- | ------------------------
    |

    | 타 유저 변경 반영 (커뮤·클럽) | ∞ (재마운트 시 ≤5분)  | 100~400ms                |

    | 채팅 소켓 좀비 시             | ≤25s (heartbeat 대기) | ≤2s (푸시 신호)          |

    | 채팅방 진입                   | 480ms                 | 132ms                    |

    | 오프라인 복구                 | 수동 새로고침         | 306ms 자동               |

    | postgres_changes 구독         | 4                     | 0                        |

    | 새 화면에 실시간 붙이는 비용  | 채팅 3파일 분량 복제  | 트리거 1줄 + 훅 선언 1개 |


    - 웹 배포 완료, 네이티브는 8/1 EAS 빌드 대기(실기기 QA 잔여).'
- anchor: reference/perf-loading-realtime-history#7-5.-웹-초기-로딩-다이어트-(59-후속,-2026-07-28)
  doc: reference/perf-loading-realtime-history.md
  text: '### 7-5. 웹 초기 로딩 다이어트 (59 후속, 2026-07-28)


    - **참고 자료**: 커밋 `d6bb964`

    - **당시 지표**: 단일 번들 **4.7MB**(브로틀리 1.23MB)가 웹 초기 진입을 지배.

    - **구현·의사결정**: ① `asyncRoutes`(web 한정) 라우트 78청크 분할 - 화면 코드 ~450KB 지연 로드. 네이티브는
    Hermes라 무이득 + 프로드 suspense 미지원이라 **제외**(플랫폼별 판단). ② `@expo/vector-icons` 배럴 임포트
    101파일이 전 아이콘 패밀리 454KB를 실음 → 사용 패밀리가 Ionicons뿐임을 전수 확인 후 서브모듈 직접 임포트로 교체. ③ 로그인
    로고 512px/204KB → 256px/66KB(표시 76pt, 3x 커버).

    - **구현 후 지표**: 초기 JS **4.7MB → 3.7MB (-21%)**. 남은 큰 덩어리는 Sentry 스택 ~890KB(replay·feedback
    포함) - 트리밍 후속 검토로 기록.


    ---'
- anchor: reference/perf-loading-realtime-history#8.-도구·검증-방법론의-축적-(역사에서-뽑은-재사용-자산)
  doc: reference/perf-loading-realtime-history.md
  text: '## 8. 도구·검증 방법론의 축적 (역사에서 뽑은 재사용 자산)


    | 자산                                                 | 태어난 곳                                        |
    현재 위치·역할                                                       |

    | ---------------------------------------------------- | ------------------------------------------------
    | -------------------------------------------------------------------- |

    | `lib/query-persister.ts` + `query-persist-policy.ts` | e09ac9c(1-2) → 990cb50
    → Phase 40 반전 → 3afe027 | denylist 기본 영속, buster v3, success만 dehydrate                   |

    | `useResilientChannel`                                | Phase 10                                         |
    백오프 재구독 + onSubscribed invalidate. 59 Broadcast 채널도 이 위에 |

    | `lib/realtime-reconnect.ts`                          | Phase 41                                         |
    zombie 전면 재구독 + `uniqueRealtimeTopic`(2.110 핫픽스)             |

    | `useForegroundRecovery`                              | Phase 10(chat 전용) → 59
    A2 승격                 | 포그라운드 복귀 회수의 전역 표준                                     |

    | `push-data-sync`                                     | 2026-07-28(chat 1종) →
    59 A1                     | 27종 NotificationType → 쿼리 키 매핑 (백그라운드 판 이벤트 버스)     |

    | `useRealtimeScreen` + `emit_domain_event`            | 59 B                                             |
    실시간을 "선언 가능한 속성"으로                                      |

    | sync-latency 로거 (`lib/observability/`)             | 59 A3                                            |
    이후 모든 성능 작업의 공용 계측 자산                                 |

    | `useDebouncedValue`                                  | Phase 16                                         |
    Phase 47에서 리스트 검색 전수 확산                                   |

    | placeholderData 0ms 진입 패턴                        | b81d276(1-3)                                     |
    상세 진입 표준, 채팅 프리페치의 참조 모델                            |

    | verifier-web 증거 캡처                               | Phase 31~                                        |
    캐시·실시간 검증의 표준 절차 (2계정 시나리오는 59)                   |

    | 로컬 5만 건 + EXPLAIN + ROLLBACK 실험                | Phase 47                                         |
    DB 성능 검증 표준 (음성 검증: DROP INDEX 회귀 재현)                  |'
- anchor: reference/perf-loading-realtime-history#9.-반복해서-밟은-함정-(재발-방지-목록)
  doc: reference/perf-loading-realtime-history.md
  text: '## 9. 반복해서 밟은 함정 (재발 방지 목록)


    1. **웹에서 reanimated entering/레이아웃 애니 = absolute 잔존·셀 붕괴** (fa941c1 → Phase 41
    C·42 §3.3·부팅 Crossfade에서 3회 회피). 리스트 셀·오버레이엔 스타일 구동 애니만.

    2. **invalidateQueries 기본 refetchType:''active''** - "앱이 느리게 반영"의 정체는 빌드가 아니라
    이것 (Phase 31, 메모리에도 기록됨).

    3. **캐시 영속 확대는 무효화 누락을 증폭** (Phase 40 → 8cda98f). 영속 정책 변경 시 무효화 감사 세트로.

    4. **같은 realtime topic의 빠른 재구독/재사용** - churn으로 바인딩이 조용히 끊기거나(e9a2860), dedup으로
    크래시(2.110). 채널 수명주기는 항상 명시 관리.

    5. **세션 복원 전 realtime 구독** = 익명 claims로 SUBSCRIBED인데 무배달 (59 D-보너스, 메모리 realtime-auth-gate).

    6. **GIN fastupdate pending list** - 벌크 삽입 직후 인덱스 비활용 (Phase 47).

    7. **opt-in 리스트(화이트리스트·하드코딩 프리페치)는 반드시 드리프트** - 좋은 기본값+명시 예외로 극성 반전 (Phase 40).

    8. **limit은 예상치가 아니라 폭주 방어 캡** - 예상치에 맞춘 limit은 사일런트 데이터 소실 (Phase 17).

    9. **RN 전용 모듈 최상단 import는 웹을 깬다** (63f797b) - 플랫폼 분기·지연 로드.

    10. **추측 픽스 금지** - 계측이 반증한 가설(Phase 10 C7)은 그럴듯해도 손대지 않는다.'
