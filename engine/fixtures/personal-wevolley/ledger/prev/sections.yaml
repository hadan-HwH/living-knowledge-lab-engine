- anchor: reference/bot-ops-runbook#4-2.-db-reset-후-필수:-_push_config-로컬-리다이렉트
  doc: reference/49-bot-ops-runbook.md
  text: '### 4-2. db reset 후 필수: `_push_config` 로컬 리다이렉트


    **로컬 `_push_config`에 prod service key가 시딩돼 있다**(00076). 로컬에서 봇 댓글을 발행하면 알림 트리거(00116)의
    `net.http_post`가 **prod send-push를 실제로 때릴 수 있고**, 로컬 pg_cron의 `invoke_bot_function`도
    같은 값을 읽어 **prod 봇 함수를 호출할 수 있다**. `supabase db reset`이 prod 값으로 되돌리므로 **리셋 후마다**
    재실행:


    ```sql

    UPDATE _push_config SET value = ''http://127.0.0.1:54321'' WHERE key = ''supabase_url'';

    UPDATE _push_config SET value = ''<로컬 SERVICE_ROLE_KEY>'' WHERE key = ''service_role_key'';

    ```


    (value 컬럼이 NOT NULL이라 NULL 세팅은 불가 - 리다이렉트가 유일한 무력화 방법, E2E 실측.)'
