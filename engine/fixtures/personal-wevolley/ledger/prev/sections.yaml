  doc: reference/08-improvement-catalog.md
  text: '### BUG. 채팅 실시간·로딩 → [10 상세 문서](../작업완료/10-chat-realtime-bugfix.md) ✅


    - **증상**: (S1) 인앱 실시간 메시지 미표시, (S2) 푸시 탭 후 스켈레톤 무한, (S3) cold start만 정상.

    - **근본 원인(전수 조사)**: 라이브 갱신이 realtime `setQueryData` patch **하나에만** 의존 + **실패 시
    폴백 refetch·구독 관측 없음**(`useChatRealtime.ts:100-104`), warm은 staleTime 5분+미영속으로
    stale 서빙(`query-client.ts:45,50`/`query-persister.ts`), focus refetch가 staleTime에
    묶임(`[roomId].tsx:120-128`). 세 증상 = 한 뿌리.

    - **추가(C6, UI)**: 채팅방 로딩이 리스트용 `ListSkeleton`을 써서 **메시지 버블이 아닌 리스트 카드 모양** → 같은
    로딩 지점이라 `ChatSkeleton` 신설로 함께 처리.

    - **접근/검증/효과**: → [10 문서](../작업완료/10-chat-realtime-bugfix.md). **버그 수정**(화면 분해
    A3와 분리). 네이티브 검증 필수(푸시는 web 불가).'
