  doc: 57-bot-skill-split-quality.md
  text: '# 57 — 봇 스킬 4+1 재편과 콘텐츠 품질 파이프라인 (Bot Skill Split & Content Quality Pipeline)


    > 작성일: 2026-07-20

    > 상위 문서: [작업완료/54-content-channel-design.md](./작업완료/54-content-channel-design.md)
    · [reference/49-bot-ops-runbook.md](./reference/49-bot-ops-runbook.md)

    > 선행/연계: 55(콘텐츠 채널 구현)·56(Phase 1.5 format/highlight)이 만든 v3 규격·발행 경로를 그대로 사용.
    DB·Edge Function·앱 코드는 건드리지 않는다.

    > 범위: **Claude Code 스킬·bot/ 문서·scripts/bot-auto.sh만.** 앱/DB/함수 변경 없음.

    > 한 줄 요약: 역할이 섞인 봇 스킬 2개를 발행 형태 기준 4개로 쪼개고, 카드뉴스·아티클에 리서치·비평 서브에이전트 파이프라인을 넣어
    "피상적 요약 카드" 수준을 벗어난다.'
- anchor: bot-skill-split-quality#§1-최종-목표-(Definition-of-Done)
  doc: 57-bot-skill-split-quality.md
  text: '## §1 최종 목표 (Definition of Done)


    1. 스킬이 발행 형태 기준 4개로 분리된다: `/bot-react`(댓글·대댓글 반응 + 좋아요 점검), `/bot-chat`(잡담 글),
    `/bot-cards`(카드뉴스), `/bot-article`(아티클). `/bot-daily`(장면 주입)는 그대로 유지된다.

    2. `bot-tick`·`bot-content` 스킬 디렉토리는 삭제되고, 저장소 내 참조(런북·bot/README·bot-auto.sh·liker
    주석)가 새 이름으로 갱신된다 (잔존 참조 grep 0건).

    3. `/bot-cards`·`/bot-article`은 기본 실행이 3단 파이프라인이다: 리서치 서브에이전트(팩트팩) → 본체 집필 → 비평
    서브에이전트(팩트 대조·무정보 리젝·규격 검증) → 퇴고 → 예약.

    4. `deep` 인자를 주면 Workflow 오케스트레이션(리서치 3앵글 팬아웃 → 초안 2개 경쟁 → 심사 → 합성 → 비평)으로 승격된다.

    5. article 규격이 확장된다: 포인트 4~~6개, 포인트당 body 150~~300자(기존 90자 권장 폐지), 전체 800~1500자.
    title ≤24자·summary 15자 내외·cards 하드 상한(head ≤17자·body ≤90자)은 유지된다.

    6. 비평 단계가 리젝 기준을 명문화해 적용한다: 팩트팩에 근거 없는 사실 주장 금지, "연습은 짧게 자주" 류 무정보 포인트 리젝, highlight
    부분문자열·ep 연속성·태그 1~3개 기계 검증.

    7. `bot/README.md`의 운영 루틴·표가 새 스킬 체계로 갱신된다.

    8. launchd 자동화(`scripts/bot-auto.sh`)가 `/bot-react`를 호출하도록 수정되고, 기존 plist 사용자는
    `bot-auto.sh on` 재실행으로 갈아탈 수 있음이 README에 명시된다.


    **성공 측정**: 콘텐츠 1건당 리서치 근거(수치·사례) 포인트 비율(현행 0 - 리서치 단계 자체가 없음 → 포인트 과반), 운영자 재집필
    요청 빈도(현행: EP.01을 cards→article로 재발행 1건, content-log.md:13-14), 스킬 1개당 역할 1개(현행
    bot-tick은 반응+잡담 2역할).'
- anchor: bot-skill-split-quality#§2-현재-상황-분석-(실측)
  doc: 57-bot-skill-split-quality.md
  text: '## §2 현재 상황 분석 (실측)'
- anchor: bot-skill-split-quality#이미-갖춰진-것-—-재사용
  doc: 57-bot-skill-split-quality.md
  text: '### 이미 갖춰진 것 — 재사용


    | 자산                                              | 위치                                          |
    상태                                   |

    | ------------------------------------------------- | ---------------------------------------------
    | -------------------------------------- |

    | v3 포인트 정형 파서 (points 1~8, 길이 무검증)     | `lib/utils/content-post.ts:28`                |
    그대로 사용 - article 확장을 이미 수용 |

    | article 상세 렌더러 (클램프 없는 줄글)            | `app/(tabs)/community/[id].tsx:393-415`       |
    그대로 - body 장문 안전                |

    | article 피드 카드 (커버+제목만, 포인트 미노출)    | `components/community/ContentPostCard.tsx:96`
    | 그대로 - 피드 오버플로 없음            |

    | 예약 INSERT·승인 게이트·심야 조정·ep 교차확인 SQL | `bot-content/SKILL.md` §4~5                   |
    새 스킬 2개에 이식                     |

    | 반응 확률표·enqueue RPC·이벤트 드레인             | `bot-tick/SKILL.md` §2~4·§6                   |
    `/bot-react`로 이식                    |

    | 잡담 집필 절차 (소재 풀·태그·예약)                | `bot-tick/SKILL.md` §5-1                      |
    `/bot-chat`으로 이식                   |

    | 소재·발행 대장                                    | `bot/topics.md` · `bot/content-log.md`        |
    형식 유지, 소비 주체만 변경            |

    | liker 크론 (좋아요 자동)                          | `supabase/functions/community-bot-liker`      |
    로직 이관 안 함 - 점검만               |'
- anchor: bot-skill-split-quality#구멍-—-이번에-닫는다
  doc: 57-bot-skill-split-quality.md
  text: '### 구멍 — 이번에 닫는다


    - **역할 혼재**: `bot-tick/SKILL.md` 172줄에 반응(§3~4)과 잡담 집필(§5-1)이 한 스킬. `bot-content/SKILL.md`
    172줄에 cards·article이 format 필드 하나로 동거 (§4: "애매하면 article").

    - **품질 파이프라인 부재**: `bot-content/SKILL.md`에 리서치·검수 단계가 없다 - §4 집필 규격 → §5 예약으로
    직행. 초안 = 최종안. 운영자 진단(2026-07-20): 깊이 부족·포맷 제약·무검수 3중.

    - **article이 cards 제약에 갇힘**: §4 "body는 2~4문장 최대 90자 (cards는 하드 상한, article은 권장)"
    - 렌더러 실측상 article은 이 제약이 불필요한데 규격이 눌러놓아 "요약 카드 같은 아티클"이 나옴.

    - **개명 파급점 3곳**: `scripts/bot-auto.sh:23` launchd plist에 `claude -p "/bot-tick"`
    하드코딩, `reference/49-bot-ops-runbook.md` /bot-tick·/bot-content 참조 20여 곳(§6-1·6-1b
    포함), `community-bot-liker/index.ts:8,28` 주석.'
- anchor: bot-skill-split-quality#핵심-통찰
  doc: 57-bot-skill-split-quality.md
  text: '### 핵심 통찰


    1. **article 확장은 공짜다.** 파서(길이 무검증)·상세(무클램프)·피드(포인트 미노출) 모두 실측 확인 - 스킬 텍스트만 고치면
    되고 EAS 빌드·마이그레이션이 없다.

    2. **품질 문제의 구조적 원인은 "한 패스 집필"이다.** 소재(topics.md)가 넓은 제목뿐이고, 리서치 없이 학습 지식만으로 90자
    안에 쓰니 피상적 일반론만 남는다. 팩트팩 → 집필 → 비평의 분업이 최소 해법.'
- anchor: bot-skill-split-quality#§3-설계-고려사항
  doc: 57-bot-skill-split-quality.md
  text: '## §3 설계 고려사항'
- anchor: bot-skill-split-quality#3-1.-분리-기준:-포맷-우선,-채널-자유-(가장-중요한-결정)
  doc: 57-bot-skill-split-quality.md
  text: '### 3-1. 분리 기준: 포맷 우선, 채널 자유 (가장 중요한 결정)


    - A안 채널별 스킬(오늘의배구/배구연구소/장비창고): 슬롯과 1:1이지만 채널 추가마다 스킬 증식, format 판단 문제는 그대로.

    - **B안(채택) 포맷별 스킬 + 채널 자유**: `/bot-cards`·`/bot-article` 모두 어느 채널이든 집필. 인자 없으면
    오늘 슬롯 채널 기본값, "소재 성격에 맞는 포맷 고르기"는 운영자 몫으로 명시 이동 (2026-07-20 사용자 결정). "애매하면 article"
    같은 자동 판단 규칙은 폐기.'
- anchor: bot-skill-split-quality#3-2.-파이프라인-무게:-기본-경량,-deep-인자-(사용자-결정)
  doc: 57-bot-skill-split-quality.md
  text: '### 3-2. 파이프라인 무게: 기본 경량, deep 인자 (사용자 결정)


    기본 = 서브에이전트 2회(리서치 1 + 비평 1), 본체가 집필·퇴고. `deep` = Workflow 오케스트레이션 승격. 항상-deep은
    주 3회 발행이라도 비용·시간 부담이 커서 기각 (2026-07-20 사용자 결정: "기본=경량, deep 인자"). deep의 Workflow
    호출은 스킬 지시문에 명시 - 스킬 경유 실행이 곧 opt-in.'
- anchor: bot-skill-split-quality#3-3.-좋아요:-크론-유지,-스킬은-점검만
  doc: 57-bot-skill-split-quality.md
  text: '### 3-3. 좋아요: 크론 유지, 스킬은 점검만


    liker는 LLM 무호출 서버 크론(하루 3회)으로 이미 완결. 로직을 스킬로 옮기면 딸깍 누락 = 좋아요 정지가 되므로 기각. `/bot-react`
    리포트에 오늘 liker 동작 여부(`community_post_likes` 최근 봇 좋아요 시각)와 분포만 표시.'
- anchor: bot-skill-split-quality#3-4.-공통-블록-복제-vs-공유-문서
  doc: 57-bot-skill-split-quality.md
  text: '### 3-4. 공통 블록 복제 vs 공유 문서


    cards·article 스킬은 예약 SQL·ep 확인·대장 갱신·승인 안내가 동일하다. 공유 문서로 빼면 스킬 자립성이 깨지고(스킬 단독
    로드 시 맥락 유실), 복제하면 드리프트 위험. **복제를 택하되** 두 파일 헤더에 "예약·대장 절차는 bot-cards/bot-article
    동일 - 한쪽 수정 시 다른 쪽도" 상호 주석을 남긴다. 과표준화 경고: 리서치 지시문은 채널·포맷마다 달라야 하므로 억지로 합치지 않는다.'
- anchor: bot-skill-split-quality#3-5.-개명-파급:-launchd-plist는-재생성-필요
  doc: 57-bot-skill-split-quality.md
  text: '### 3-5. 개명 파급: launchd plist는 재생성 필요


    plist는 `bot-auto.sh on` 시점의 문자열이 박제되므로 스크립트만 고치면 기존 가동분은 계속 `/bot-tick`을 부른다(스킬
    삭제 후엔 헤드리스 실패). README·리포트에 "재실행 필요" 명시 + 구현 직후 `bot-auto.sh status`로 가동 여부 확인.'
- anchor: bot-skill-split-quality#§4-구현-계획-(단계별)
  doc: 57-bot-skill-split-quality.md
  text: '## §4 구현 계획 (단계별)


    - [ ] **Step 1 — `/bot-react` 신설**: `bot-tick/SKILL.md`에서 §5-1(잡담)·§5-2(콘텐츠 안내)를
    들어내고 `.claude/skills/bot-react/SKILL.md`로 이동. 좋아요 점검 항목·콘텐츠 슬롯 리마인드(두 스킬명으로) 추가.
    리포트 형식 갱신.

    - [ ] **Step 2 — `/bot-chat` 신설**: §5-1 잡담 절차를 `.claude/skills/bot-chat/SKILL.md`로
    독립 (접속 대상·게이트·소재 풀·태그·예약·심야 조정 포함. "하루 첫 틱" 게이트 → "오늘 잡담 예약 0건" 게이트로 치환).

    - [ ] **Step 3 — `/bot-article` 신설**: bot-content 골격 + format=''article'' 고정 +
    §1-5 확장 규격 + 3단 파이프라인(리서치 팩트팩 스키마, 비평 리젝 기준, 퇴고 루프 1회) + `deep` 인자 Workflow 정의.

    - [ ] **Step 4 — `/bot-cards` 신설**: article과 동일 파이프라인, cards 하드 상한 유지 + "한 장 =
    한 액션 + 구체 디테일 1개 의무" 원칙.

    - [ ] **Step 5 — 구 스킬 삭제**: `.claude/skills/bot-tick/`·`.claude/skills/bot-content/`
    제거.

    - [ ] **Step 6 — 참조 일괄 갱신** (전체 범위 한 번에): `scripts/bot-auto.sh`(LABEL·로그명·호출 스킬),
    `bot/README.md`(§2 표·§3 루틴·§4 방법·§8 링크), `reference/49-bot-ops-runbook.md`(§6-1·6-1b
    등 20여 곳), `community-bot-liker/index.ts` 주석 2곳, `bot/topics.md`·`content-log.md`
    헤더의 "틱이" 표현.

    - [ ] **Step 7 — 검증(§5) 후 커밋**: 스킬·문서·스크립트 한 커밋 (동작 코드 변경 없음 - 앱/DB 무관).'
- anchor: bot-skill-split-quality#§5-검증-(Verification)
  doc: 57-bot-skill-split-quality.md
  text: '## §5 검증 (Verification)


    - [ ] 양성: `grep -rn "bot-tick\|bot-content" --include="*.md" --include="*.sh"
    --include="*.ts"` (node_modules·작업완료 제외) → 히스토리 문서 외 0건.

    - [ ] 양성: 4개 SKILL.md frontmatter의 name·description이 유효하고 역할이 1개씩인지 육안 확인.

    - [ ] 양성: 로컬 DB에서 `/bot-article` 리허설 1회 - 리서치 팩트팩 산출 → 비평 리포트 산출 → 예약 행 생성(`content`
    JSONB의 points 4~~6·body 150~~300자)까지 관찰. `/bot-cards`도 동일 1회.

    - [ ] 양성: 리허설 산출물 detail 화면 렌더 확인 (verifier-web) - 장문 article이 상세에서 정상 줄글 렌더.

    - [ ] 음성: 비평 단계에 무정보 포인트("꾸준히 하면 늘어요" 류)를 의도적으로 넣은 초안을 주면 리젝하는지 1회 확인.

    - [ ] 음성: highlight가 head의 부분문자열이 아닌 초안 → 비평이 잡아내는지 확인 (파서 null 처리 예방).

    - [ ] `bot-auto.sh status`로 launchd 가동 여부 확인 - 가동 중이면 off→on 재생성 안내 수행.'
- anchor: bot-skill-split-quality#§6-이번-범위-밖-(후속/별도)
  doc: 57-bot-skill-split-quality.md
  text: '## §6 이번 범위 밖 (후속/별도)


    - **앱·DB·Edge Function 변경 없음**: 파서 확장(길이 검증 추가 등), cards 슬라이드 UI 변경, 이미지 소싱(image_url)
    - 필요해지면 별도 문서.

    - **liker 크론 로직 변경 없음**: 확률·시간대 조정은 별도.

    - **`/bot-daily` 개편 없음**: 장면 주입은 현행 유지.

    - **기존 발행물 소급 수정 없음**: EP.01 article 재발행분은 그대로.

    - **topics.md 백로그 소재 리라이팅 없음**: 넓은 소재를 앵글로 좁히는 건 리서치 단계 책임으로 이관 - 대장 자체는 그대로.

    - **prod 딸깍 자동화 고도화(원격 크론 등)**: backlog 후보.'
- anchor: bot-skill-split-quality#§7-리스크-&-완화
  doc: 57-bot-skill-split-quality.md
  text: '## §7 리스크 & 완화


    | 리스크                                     | 영향                                 |
    완화                                                                                                       |

    | ------------------------------------------ | ------------------------------------
    | ----------------------------------------------------------------------------------------------------------
    |

    | launchd plist가 구 `/bot-tick` 호출 지속   | 헤드리스 틱 조용히 실패, 반응봇 정지 | bot-auto.sh 수정
    + README에 `on` 재실행 명시 + 구현 직후 status 확인 (§5)                                  |

    | 리서치 서브에이전트의 할루시네이션 팩트    | 틀린 수치·규칙이 콘텐츠로 발행       | 팩트팩에 출처 URL 필수, 비평 단계가
    팩트팩 밖 주장 리젝, 승인 게이트(운영자 최종 검수) 유지                |

    | article 장문화로 폴백 body(구버전 앱) 비대 | 구버전 피드에 긴 텍스트 노출         | 폴백은 기존대로 title+head
    위주 압축 유지 (본문 전문을 넣지 않는다고 규격에 명시)                          |

    | cards·article 공통 블록 드리프트           | 한쪽만 규격 갱신돼 어긋남            | 상호 주석(§3-4)
    + 리뷰 시 두 파일 동시 확인 습관                                                           |

    | deep 워크플로우 비용 폭주                  | 토큰 과소비                          | 기본 경량,
    deep은 명시 인자일 때만 + 스킬에 대략 비용 고지 문구                                            |

    | 스킬 5개로 운영 딸깍 부담 증가             | 루틴 이탈                            | README §3
    루틴을 "매일 1개(/bot-react) + 주 3회 콘텐츠 택1"로 단순 명시, /bot-react 리포트가 슬롯 리마인드 |'
- anchor: bot-skill-split-quality#§8-구현-후-—-무엇이-달라지나-&-어떻게-활용하나-(기대)
  doc: 57-bot-skill-split-quality.md
  text: '## §8 구현 후 — 무엇이 달라지나 & 어떻게 활용하나 (기대)


    - **Before → After (운영)**: "bot-tick이 반응·잡담을 한꺼번에, bot-content가 포맷을 자동 판단" → 발행
    형태 1개 = 스킬 1개. 운영자가 소재를 보고 `/bot-cards`냐 `/bot-article`이냐를 직접 고르고, 잡담은 원할 때만 `/bot-chat`.

    - **Before → After (품질)**: 리서치 0·검수 0의 한 패스 집필 → 팩트팩 근거 집필 + 비평 리젝 통과분만 예약. article은
    90자 요약 카드에서 800~1500자 읽을거리로.

    - **개선 지표**: §1 성공 측정 참조 - 근거 있는 포인트 비율, 재집필 요청 빈도, 스킬당 역할 수. 구현 후 실측으로 갱신.

    - **누가 어떻게 쓰나**: 운영자는 매일 `/bot-react` 딸깍(자동화 시 launchd), 화·목·토엔 topics.md를 보고
    포맷 스킬 택1 (공들일 소재면 `deep` 붙이기). 개발자 관점에선 새 발행 형태(예: 투표형)가 생기면 스킬 1개 추가로 끝 - 기존
    스킬 무수정.

    - **유저 관점**: 커뮤니티 콘텐츠의 깊이·읽는 맛 개선 (수치·사례가 있는 아티클). 앱 UI 변화는 없음.

    - **보이나/안 보이나**: 스킬 재편 자체는 안 보이는 운영 인프라지만, 콘텐츠 품질 상승은 유저에게 직접 보인다 - prod 90명 유저
    리텐션(메모리: prod-scale-live)에 복무.'
- anchor: backlog/club-treasury#33.-클럽-금고-(동호회-회계)-—-기획
  doc: backlog/33-club-treasury.md
  text: '# 33. 클럽 금고 (동호회 회계) — 기획


    - 상태: draft (2026-07-02, 브레인스토밍 세션 결과 구체화)

    - 관련: ADR-0005(게스트 신청 도입), planning/32 P1-1(notify 단일 진입점), ADR-0004(supersede
    대상)


    **한 줄 정의**: 은행 연동 없이 동호회의 회비 수금·지출·투명성 보고를 대체하는 장부. 자동화되는 것은 **청구 생성과 독촉**이고,
    입금 확인은 셀프 신고 + 총무 승인의 반자동.


    ---'
- anchor: backlog/club-treasury#1.-문제
  doc: backlog/33-club-treasury.md
  text: '## 1. 문제


    동호회 총무는 회비(월 3만원 안팎, 월/분기 주기, 연납 할인·가입비 변형)를 은행 계좌로 받아 엑셀로 관리하고 카톡으로 공지·독촉한다.
    페인 3개:


    1. **대조 노동**: 은행 내역과 멤버 명단을 수동 대조 — 입금자명이 제각각, 몰아내기(3개월치)·대납이 섞임.

    2. **독촉의 감정 비용**: 미납자에게 개인적으로 돈 얘기를 꺼내는 어색함. 기능이 아니라 관계 문제.

    3. **투명성 보고**: 회식비·유니폼·장비비 지출까지 엑셀에 적어 총회 때 공개 — 보고가 연 1~2회 이벤트라 평소엔 블랙박스.


    근거: 운영자 본인이 1차 사용자(도그푸딩). 엑셀+카톡이 사실상 표준 워크플로.


    **핵심 판단: v1이 엑셀을 완전히 대체하지 못하면 만들 가치가 없다.** 지출이 엑셀에 남으면 장부의 진실은 엑셀에 있고 앱은 이중 입력
    부담만 추가 → 총무 이탈. 따라서 수입+지출+잔액+리포트까지가 v1 스코프.'
- anchor: backlog/club-treasury#2.-목표-/-성공-지표
  doc: backlog/33-club-treasury.md
  text: '## 2. 목표 / 성공 지표


    | 목표 | 지표 | 측정 |

    |---|---|---|

    | 총무의 엑셀 대체 | 활성 클럽 중 금고 기능 사용 클럽 수 (첫 목표: 자기 클럽 포함 3개) | charges 발행 클럽 count
    |

    | 확인 노동 압축 | 월 청구 발행→전원 확정까지 총무 앱 체류 시간 (감각 목표: 월 10분 이내) | 정성 + 이벤트 |

    | 셀프 신고 채택 | confirmed charge 중 셀프 신고(reported) 경유 비율 ≥ 60% | status 전이 로그 |

    | 멤버 리텐션 견인 | 금고 사용 클럽 멤버의 WAU vs 미사용 클럽 | 코호트 비교 |'
- anchor: backlog/club-treasury#3.-비목표-(명시적-제외)
  doc: backlog/33-club-treasury.md
  text: '## 3. 비목표 (명시적 제외)


    - **은행 계좌 연동 전면**: 마이데이터(허가제, 자본금 5억) 기각. 오픈뱅킹 이용기관은 법인 설립 시 재검토. 스크래핑(직접/대행)
    기각 — 신용정보법·신뢰 비용.

    - **송금/결제 대행**: 돈은 앱을 거치지 않는다. 앱은 장부·독촉·투명성만. (미래 결제는 planning/32 Phase C — Edge
    Fn 관문)

    - **거래내역 복붙/엑셀 업로드 파싱**: v1 제외, v1.5 후보. 셀프 신고 채택률이 낮을 때의 보강 수단.

    - **출석/노쇼 자동 집계**: 게스트 흐름은 참석 확정까지만. 노쇼 이력은 수요 확인 후.

    - **예산/승인 워크플로**(지출 품의 등): 과설계. 지출은 기록만.'
- anchor: backlog/club-treasury#4.-코어-루프
  doc: backlog/33-club-treasury.md
  text: "## 4. 코어 루프\n\n```\n[청구 발행]  charge_plan이 매월/분기 자동 발행 (또는 총무 수동 발행)\n   \
    \ ↓ 알림: 금액·계좌·지정 입금자명 원탭 복사 (+가능 시 송금 딥링크)\n[멤버 송금]  은행앱에서 이체 — 입금자명을 앱이 지정(\"\
    김철수0403\")\n    ↓ 앱에서 \"냈어요\" 셀프 신고 (선택: 이체 스크린샷 첨부)\n[총무 승인]  확인 대기 인박스 — 은행앱\
    \ 대조 후 스와이프 승인 / 일괄 처리\n    ↓\n[장부 갱신]  잔액·리포트 자동 반영. 미납은 N일차 자동 리마인드 (앱이 독촉,\
    \ 총무 아님)\n```\n\n설계 원칙: **입력을 멤버에게 분산**(셀프 신고), **매칭을 상류에서 제거**(지정 입금자명), **독촉을\
    \ 시스템에 외주**(자동 리마인드). 이 3개가 은행 연동 없이 성립하는 이유."
- anchor: backlog/club-treasury#5.-도메인-모델-(초안)
  doc: backlog/33-club-treasury.md
  text: "## 5. 도메인 모델 (초안)\n\n```\nclub_finance_settings   클럽당 1행 — 수금 계좌(은행/번호/예금주),\
    \ 입금자명 규칙,\n                        재정 요약 공개 범위 설정. 계좌는 민감 정보 → 별도 테이블 + RLS\n\
    charge_plans            청구 템플릿 — cycle(monthly|quarterly), amount, issue_day,\
    \ active\nclub_charges            장부의 원자 단위 —\n                        type: dues\
    \ | guest_fee | join_fee | other\n                        amount, title, due_date\n\
    \                        status: pending → reported → confirmed | exempt | void\n\
    \                        reported_at, evidence_image, confirmed_by/at,\n     \
    \                   source_plan_id?, guest_request_id?\nclub_expenses        \
    \   지출 — amount, category(회식|장비|유니폼|대관|기타), memo,\n                        receipt_image,\
    \ spent_at, created_by\nguest_requests          게스트 신청 (ADR-0005) — club_id, event_id,\
    \ user_id, message,\n                        status: pending → accepted | rejected\
    \ | cancelled\n잔액                    = Σ confirmed charges − Σ expenses (뷰/집계\
    \ 쿼리, 컬럼 아님)\n```\n\n모델링 원칙: **규칙은 얇게, 장부는 멍청하게.** 연납 할인 = \"33만원 charge 1건\"\
    (plan이 아니라 수동 발행), 가입비 = 가입 승인 시 1회 charge 옵션. 몰아내기·대납은 총무가 여러 charge를 선택 일괄 승인으로\
    \ 흡수 — 입금:charge 1:N 매칭을 모델이 아니라 UX로 푼다."
- anchor: backlog/club-treasury#6.-게스트-흐름-변경-(기능-변경-—-ADR-0005)
  doc: backlog/33-club-treasury.md
  text: "## 6. 게스트 흐름 변경 (기능 변경 — ADR-0005)\n\n현행: 클럽 상세 → \"게스트 문의\" → DM. 변경:\n\n\
    ```\n게스트: 클럽 상세 → 일정(club_event) 선택 → 게스트 신청(메시지)\n운영진: 신청 알림 → 승인/거절\n승인 부수효과:\
    \ guest_fee charge 자동 생성 → 게스트에게 납부 안내 알림\n              (금액·계좌·지정 입금자명 — 멤버 회비와\
    \ 동일 루프)\n게스트: 송금 → 셀프 신고 → 총무 승인 → 참석 확정\n```\n\n- DM 문의는 **공존** — 신청 전 사전 문의\
    \ 채널로 유지.\n- guest_fee 금액 기본값 = 기존 `clubs.guest_fee_info`(텍스트) → settings의 구조화\
    \ 금액 필드로 이관 필요.\n- 요청·승인 도메인의 4번째 인스턴스 → planning/32 Phase B 관문 발동: **notify()\
    \ 단일 진입점(P1-1)을 이 기능 첫 마이그레이션 전에 선행**, 승인 부수효과(charge 생성+알림)는 공통 헬퍼로."
- anchor: backlog/club-treasury#7.-화면-(클럽-상세-내-'회계'-진입)
  doc: backlog/33-club-treasury.md
  text: '## 7. 화면 (클럽 상세 내 ''회계'' 진입)


    | 화면 | 사용자 | 내용 |

    |---|---|---|

    | 재정 요약 | 전체 멤버 | 잔액, 이번 달 수입/지출 총계, 최근 지출 목록. 개인 납부 상태는 미노출 |

    | 내 납부 현황 | 본인 | 내 charge 목록, "냈어요" 신고, 계좌·입금자명 복사 |

    | 총무 대시보드 | 운영진 | "3월 회비 18/22" 한 줄 + 확인 대기 인박스(스와이프 승인, 일괄 처리, 면제) |

    | 지출 입력 | 운영진 | 금액+항목+메모+영수증 사진 — 30초 입력 |

    | 월간 리포트 | 운영진→전체 | 기간 수입/지출/잔액 요약 → **카톡 공유용 이미지 생성** (카톡 문화에 순응 + 하단 로고 = 자연
    홍보) |

    | 게스트 신청/관리 | 게스트/운영진 | §6 흐름 |'
- anchor: backlog/club-treasury#8.-알림-(신규-6종-—-P1-1-선행-조건)
  doc: backlog/33-club-treasury.md
  text: '## 8. 알림 (신규 6종 — P1-1 선행 조건)


    charge_issued(청구 발행), dues_reminder(미납 N일차, push 중심), payment_reported(총무에게),
    payment_confirmed(멤버에게), guest_request(운영진에게), guest_approved+납부안내(게스트에게). 전부
    기존 notifications 인프라 재사용하되, **notify() 단일 진입점 마이그레이션을 이 기능 첫 스키마 작업으로 선행**한다(planning/32
    P1-1).'
- anchor: backlog/club-treasury#9.-권한-/-프라이버시-/-RLS
  doc: backlog/33-club-treasury.md
  text: '## 9. 권한 / 프라이버시 / RLS


    - 회계 쓰기 권한 = `club_members.role = admin` (별도 ''총무'' 역할 신설 안 함 — admin_positions
    표시용 활용은 선택).

    - 개인 납부 상태 열람: **본인 + 운영진** 기본. 클럽 설정으로 "미납 현황 전체 공개" 옵션(미납자 명단 공개 문화 클럽용) — 기본값은
    비공개 권장.

    - 재정 요약(총계·잔액·지출)은 멤버 전체 열람 — 이 기능의 차별 가치(상시 투명성).

    - 수금 계좌 정보: 멤버에게는 납부 화면에서만 노출, 비멤버·게스트는 승인 후에만.

    - 민감 상태 전이(승인·면제·void)는 RPC 경유 — 기존 컨벤션 유지.'
- anchor: backlog/club-treasury#10.-요구사항-우선순위
  doc: backlog/33-club-treasury.md
  text: '## 10. 요구사항 우선순위


    **P0 (없으면 배포 안 함)** — Phase 1

    - charge 발행(plan 자동 + 수동), 멤버 납부 화면(복사+셀프 신고), 총무 인박스(승인/일괄/면제), 미납 자동 리마인드, 총무
    대시보드 한 줄 현황

    - 수락 기준 예: "plan(월 3만, 1일 발행) 설정 시 매월 1일 활성 멤버 전원에게 pending charge 생성 + charge_issued
    알림 발송" / "멤버 신고 시 총무에게 payment_reported, 총무 승인 시 status=confirmed + 멤버에게 확인 알림"


    **P1** — Phase 2

    - 지출 기록(사진+태그), 재정 요약 화면, 월간 리포트 + 카톡 공유 이미지


    **P1.5** — Phase 3

    - 게스트 신청→승인→guest_fee 루프 (§6). ADR-0005 accepted 전환 후 착수


    **P2 (설계만 고려, 빌드 안 함)**

    - 거래내역 복붙/엑셀 파싱 매칭(셀프 신고 채택률 <40%면 승격), 오픈뱅킹(법인 시), 노쇼 집계, 회비 통계·연체 이력'
- anchor: backlog/club-treasury#11.-리스크
  doc: backlog/33-club-treasury.md
  text: '## 11. 리스크


    | 리스크 | 판정 | 방어 |

    |---|---|---|

    | 멤버가 셀프 신고를 안 함 (**최대 가정**) | 채택률 60% 미달 시 가치 반감 | 리마인드 알림이 앱 진입 강제, 신고는 2탭,
    미신고분은 총무 대리 입력으로 성립. 40% 미만이면 P2 파싱 승격 |

    | 총무의 이중 입력기(전환기 엑셀 병행) | 초기 이탈 요인 | 첫 달 온보딩: 기존 미납 상태 일괄 입력 도구(멤버별 체크 1회) |

    | 금액 분쟁("나 냈는데") | 신뢰 훼손 | evidence_image + 상태 전이 이력 보존, confirmed 취소는 void+재발행(수정
    불가 원장) |

    | 계좌 정보 노출 | 보안 | 별도 테이블+RLS, 멤버 한정 노출 |'
- anchor: backlog/club-treasury#12.-오픈-퀘스천
  doc: backlog/33-club-treasury.md
  text: '## 12. 오픈 퀘스천


    1. **[결정 대기 — 운영자]** 미납 공개 범위 기본값: 본인+운영진(권장) vs 전체 공개. 두 차례 논의 미결.

    2. **[설계]** 게스트 신청을 일정(club_event) 단위로 한정할지, 일정 없는 일반 신청도 허용할지 — 일정 단위 한정 권장(금액·일자
    명확).

    3. **[이관]** 기존 `clubs.fee_info`/`guest_fee_info` 텍스트 필드 → settings 구조화 필드 이관 시
    기존 데이터 처리.

    4. **[검증]** 다른 클럽 총무 2~3명에게 이 코어 루프 검증 — 셀프 신고 가정의 외부 확인 (본인 클럽만으론 표본 1).'
- anchor: backlog/club-treasury#13.-아키텍처-연결-(planning/32-정합)
  doc: backlog/33-club-treasury.md
  text: '## 13. 아키텍처 연결 (planning/32 정합)


    - **ADR-0005**: 게스트 신청/승인 도입 — ADR-0004 supersede. 게스트 단위=일정 1회, 라이프사이클=신청→승인→charge→확인→참석.

    - **P1-1 notify() 선행**: 이 기능 첫 마이그레이션 전 완료 (Phase B 관문 발동).

    - **ledger 계보**: club_charges/expenses는 미래 결제(Phase C)의 원장 전신 — 상태 전이를 수정 불가(append-only에
    준하게) 설계해 이관 여지 확보.

    - **승인 부수효과 공통화**: guest 승인 헬퍼를 club_join/scrimmage 승인과 공용화할지는 이번엔 게스트만 — 소급 통합
    안 함(ADR-0004 계승).'
- anchor: backlog/guest-request#34.-게스트-신청→승인-—-기획
  doc: backlog/34-guest-request.md
  text: '# 34. 게스트 신청→승인 — 기획


    - 상태: ready (2026-07-02 — 오픈 퀘스천 4건 전부 결정, 구현 착수 가능)

    - **구현: ✅ 완료 [../작업완료/52-guest-request.md](../작업완료/52-guest-request.md) (2026-07-17)**
    — 45A 이후 드리프트 교정 포함: §6의 "기존 club_events 정책은 멤버 한정" 전제는 낡음(00048/00113의 visibility
    축 존재), guest_payment_guide는 clubs 컬럼으로는 은닉 불가(행 단위 RLS)라 별도 테이블+RPC로 변경, 훈련 일정은
    크론 자동 생성이라 토글 위치는 폼이 아닌 일정 상세.

    - 관련: DECISIONS.md 0005(구체화 대상), backlog/33 §6(금고 연동은 거기서), planning/32 P1-1(notify
    선행)

    - **독립 배포 전제**: 클럽 금고(33) 없이 배포 가능. v1 납부 = 승인 후 안내 텍스트. 금고 출시 시 charge 연동으로 승격(P2).'
- anchor: backlog/guest-request#1.-문제
  doc: backlog/34-guest-request.md
  text: '## 1. 문제


    배구 동호회는 코트 인원이 모자란 날 게스트를 받는다. 현재 앱의 게스트 흐름은 `guest_allowed` 플래그 + DM 문의가 전부라,
    실제 성사는 "언제 가면 되나요 / 이번 주 목요일이요 / 몇 명이나요…" 같은 DM 왕복으로 처리되고, 운영진은 같은 질문에 반복 응답한다.
    게스트 입장에선 어느 클럽이 **언제** 게스트를 받는지 알 방법이 없어 탐색 자체가 막혀 있다.


    **전략적 의미**: 클럽에 소속되지 않은 개인 유저에게 이 앱의 현재 가치는 희박하다. "이번 주 게스트 뛸 곳 찾기"는 개인 유저의 **첫
    번째 명확한 사용 이유**가 되고, 게스트 참여는 클럽 가입의 자연 퍼널이 된다(체험 → 가입 신청). 유저 120명 단계에서 잔존을 견인할
    후보.'
- anchor: backlog/guest-request#2.-목표
  doc: backlog/34-guest-request.md
  text: '## 2. 목표


    | 목표                     | 지표 (선행)                 | 지표 (지행)                              |

    | ------------------------ | --------------------------- | ----------------------------------------
    |

    | 게스트 모집이 구조화된다 | 게스트 모집 켠 일정 수 / 주 | —                                        |

    | DM 왕복이 신청으로 대체  | 신청 건수, 승인율           | 게스트 문의 DM 감소(정성)                |

    | 개인 유저의 사용 이유    | 무소속 유저의 신청 비율     | 게스트 경험 유저의 4주 잔존              |

    | 가입 퍼널                | —                           | 게스트 참여 → 해당 클럽 가입 신청 전환율
    |


    첫 검증 목표(출시 4주): 자기 클럽 포함 **3개 클럽이 모집을 켜고, 신청 10건 발생**.'
- anchor: backlog/guest-request#3.-비목표
  doc: backlog/34-guest-request.md
  text: '## 3. 비목표


    - **결제/장부 연동**: 게스트비 수금 확인은 33(금고)의 일 — v1은 안내 텍스트만. 이유: 독립 배포.

    - **출석/노쇼 관리**: DECISIONS 0005에서 스코프 외 확정. 수요 확인 후.

    - **게스트 평가/후기**: 신뢰 시스템은 별도 기획감. 지금은 프로필 카드가 신뢰 근거.

    - **비로그인 신청**: 신청은 로그인 유저만. 공유 랜딩에서의 노출은 기존 share 인프라 확장으로 별도.

    - **경기(scrimmage) 게스트**: 이번 대상은 클럽 일정(club_events)만. scrimmage 인원 충원은 별개 문제.'
- anchor: backlog/guest-request#4.-코어-플로우
  doc: backlog/34-guest-request.md
  text: "## 4. 코어 플로우\n\n```\n운영진: 일정 생성/수정 시 \"게스트 모집\" 토글 on + 모집 인원(정원) 설정\n  \
    \      (기본 off — 자리 남는 날만 여는 게 현실)\n게스트: 클럽 상세 → 모집 중 일정 목록 → 일정 선택 → 한마디 작성 →\
    \ 신청\n        ※ 신청에 내 프로필 카드(레벨·포지션·구력·성별) 자동 첨부 — 카톡 대비 핵심 우위\n운영진: 알림 → 신청자\
    \ 프로필 확인 → 승인 / 거절(사유 선택 필수)\n승인:   게스트에게 알림 + 상세 안내 노출(정확한 장소·시간 + 게스트비·납부 안내\
    \ 텍스트)\n        정원 도달 시 자동 마감(추가 신청 차단)\n당일:   참석 (추적 없음 — v1)\n취소:   게스트 취소(시작\
    \ 전까지), 운영진 취소(사유 선택) — 양쪽 알림\n```"
- anchor: backlog/guest-request#5.-유저-스토리-(우선순위순)
  doc: backlog/34-guest-request.md
  text: '## 5. 유저 스토리 (우선순위순)


    **게스트(무소속/타클럽 유저)**


    - 게스트를 받는 클럽의 일정을 보고, 내 실력 정보와 함께 신청해서 DM 왕복 없이 참여를 확정받고 싶다.

    - 승인되면 정확한 장소·시간·게스트비·입금 방법을 한 화면에서 보고 싶다.

    - 일정이 사라지거나 거절돼도 방치되지 않고 알림으로 알고 싶다.

    - 내 신청 현황(대기/승인/거절)을 마이페이지에서 보고 싶다.


    **운영진**


    - 자리가 남는 일정에만 게스트 모집을 열고 인원을 제한하고 싶다.

    - 신청자의 실력·포지션을 보고 우리 수준에 맞는지 판단해서 승인하고 싶다.

    - 정원이 차면 자동으로 마감되어 추가 신청에 응답할 필요가 없으면 좋겠다.


    **기존 멤버**


    - 이번 훈련에 게스트가 몇 명 오는지 일정 상세에서 알고 싶다.


    **엣지**: 이미 멤버인 유저의 신청 차단 / 같은 일정 중복 신청 차단 / 일정 시작 이후 신청 차단 / 승인 후 일정 취소 시 게스트
    전원 알림 / 밴 유저 차단(기존 RLS).'
- anchor: backlog/guest-request#6.-도메인-모델
  doc: backlog/34-guest-request.md
  text: "## 6. 도메인 모델\n\n```\nguest_requests (신설 — 요청 도메인 4번째, 0005)\n  id, club_id,\
    \ event_id(FK club_events), user_id, message,\n  status: pending → accepted |\
    \ rejected | cancelled,\n  responded_at, responded_by, created_at\n  UNIQUE(event_id,\
    \ user_id)\n\nclub_events (확장)\n  + guest_open BOOLEAN NOT NULL DEFAULT false\n\
    \  + guest_capacity INT NULL          -- null = 무제한\n\nclubs (확장)\n  + guest_payment_guide\
    \ TEXT NULL    -- 승인 후에만 노출 (계좌·금액·규칙)\n  ※ 기존 guest_fee_info(공개 텍스트)는 유지 — 목록/상세의\
    \ 공개 안내용\n```\n\n구현 노트:\n\n- **notify() 단일 진입점(P1-1)을 이 기능 첫 마이그레이션으로 선행** — 알림\
    \ 4종(신청 접수→운영진, 승인/거절→게스트, 일정 취소→승인 게스트)이 첫 소비자.\n- 승인은 RPC(SECURITY DEFINER):\
    \ 정원 검사 + status 전이 + 알림을 트랜잭션으로 — 동시 승인 초과 방지.\n- **RLS 신규 지점**: 비멤버가 guest_open=true\
    \ 일정을 조회 가능해야 함. 노출 필드 최소화(제목·일시·장소명·클럽·정원/현황). 정확한 위치 등 상세는 승인 후. 기존 club_events\
    \ 정책은 멤버 한정일 것 — 별도 SELECT 정책 추가.\n- `my-requests`(lib/api/account.ts fetchMyRequests)가\
    \ 3종 union — **게스트가 4번째 섹션으로 추가** 필요.\n- 클럽 상세 CTA: 현행 \"게스트 문의(DM)\" 버튼 → \"\
    게스트 신청\"(모집 일정 있을 때) + DM은 보조 문의로 유지."
- anchor: backlog/guest-request#7.-요구사항
  doc: backlog/34-guest-request.md
  text: '## 7. 요구사항


    **P0 — 이것 없이 배포 안 함**

    | # | 요구사항 | 수락 기준(요약) |

    |---|---|---|

    | 1 | 일정별 게스트 모집 토글+정원 | 일정 생성/수정 폼에서 설정, 기본 off |

    | 2 | 모집 일정 노출 | 클럽 상세에서 비멤버에게 모집 중 일정 목록 표시. guest_open=false 일정은 비멤버에게 불가시 |

    | 3 | 신청 (프로필 카드 첨부) | 로그인+비멤버+시작 전+정원 미달일 때만 가능. 중복 시 "이미 신청함" |

    | 4 | 승인/거절 (RPC) | 정원 초과 승인 시도 시 실패+안내. **거절은 사유 선택 필수**(정원 마감/수준 미스매치/일정 사정/기타+메모)
    — 게스트 알림에 사유 포함. 응답 시 게스트에게 알림 |

    | 5 | 승인 후 안내 | 승인된 게스트에게만 guest_payment_guide+정확한 일정 상세 노출 |

    | 6 | 정원 자동 마감 | accepted 수 = 정원 → 신규 신청 차단, 목록에 "마감" 표시 |

    | 7 | 취소 | 게스트 취소(시작 전), 운영진 일정 취소 시 승인 게스트 전원 알림 |

    | 8 | 알림 4종 + notify() 선행 | §6 구현 노트 |

    | 9 | 내 신청 현황 | my-requests에 게스트 섹션 |


    **P1 — 빠른 후속**


    - **게스트 모집 피드**: 게임 탭 또는 홈에 지역 필터 기반 "게스트 모집 중" 목록 — 이 기능의 성장 엔진이지만 코어 루프 검증 후.
    클럽 상세 진입만으로 시작.

    - 일정 상세에 게스트 참석자 표시(멤버용).

    - 신청 시 운영진에게 신청자 수 뱃지.


    **P2 — 설계만 고려**


    - 금고 연동: 승인 부수효과로 guest_fee charge 자동 생성(33 §6) — guest_requests에 FK 여지만 남김(33의
    charge.guest_request_id).

    - 일정별 게스트비 오버라이드, 노쇼 이력, 게스트 후기.'
- anchor: backlog/guest-request#8.-확정-결정-(2026-07-02,-운영자-답변)
  doc: backlog/34-guest-request.md
  text: '## 8. 확정 결정 (2026-07-02, 운영자 답변)


    1. **공개 범위 = 클럽 상세 진입만.** 클럽의 정기 운동 시간은 이미 공개 정보(clubs.regular\_\*)라 게스트가 시간대를
    파악하는 데 별도 피드 불필요. 피드는 P1 유지. ※ 비멤버의 개별 club_events 조회 RLS는 여전히 구현 확인 사항(§6).

    2. **거절 사유 필수.** 선택지(정원 마감/수준 미스매치/일정 사정/기타+메모) → 게스트 알림에 포함.

    3. **승인 후 소통 = 기존 DM 재사용.** 추가 개발 없음.

    4. **반복 신청은 감수.** 준단골 게스트의 마찰 완화 장치 안 만듦 — 알아서 할 일.'
