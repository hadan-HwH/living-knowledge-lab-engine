  doc: reference/08-improvement-catalog.md
  text: '## A. 남은 중복·구조 정리 (Phase 5·6의 연장)'
- anchor: reference/improvement-catalog#A1.-스크리미지-폼-통합-useScrimmageForm-→-09-상세-문서(../작업완료/09-scrimmage-form-unification.md)-✅
  doc: reference/08-improvement-catalog.md
  text: '### A1. 스크리미지 폼 통합 `useScrimmageForm` → [09 상세 문서](../작업완료/09-scrimmage-form-unification.md)
    ✅


    - **현재(증거)**: `game/create.tsx`(203) · `game/[id]/edit.tsx`(197) — `ScrimmageFormValues`는
    `ScrimmageCreateSteps.tsx:26`에 이미 있으나 edit는 플랫 prop. `useScrimmageForm` **없음**.
    club과 동일한 "분기 불일치"(검증 drift·state 타입 어긋남)가 그대로.

    - **스코프 정정**: `game/tournament/[id]/edit.tsx`(290)는 **다른 엔티티**(`tournaments` 테이블,
    필드·create 화면 다름) → scrimmage와 합치지 않고 **별도**(`useTournamentForm` 후속). 09 §6 참고.
    → ✅ **완료: [21 대회 장소·폼 통합](../작업완료/21-tournament-location-form-unification.md)**
    (장소 좌표/주소 영속 + `useTournamentForm` + level drift 해소).

    - **접근/검증/효과**: → [09 문서](../작업완료/09-scrimmage-form-unification.md) 참조. Phase
    5의 `useClubForm` 패턴을 **미러링**(제네릭 추상화 아님).'
- anchor: reference/improvement-catalog#A2.-useQuery-에러-UX-정합화-→-20-상세-문서(../작업완료/20-query-error-ux-coverage.md)-✅
  doc: reference/08-improvement-catalog.md
  text: '### A2. useQuery 에러 UX 정합화 → [20 상세 문서](../작업완료/20-query-error-ux-coverage.md)
    ✅


    - **스코프 정정(실측)**: 초기 "처리율 ~49%, 절반이 빈 화면"은 **파일단위 grep 착시**였다. 전수 감사하니 **1차(주)
    쿼리는 이미 ErrorRetry로 처리됨**(user-profile·game/[id]·chat/[roomId]·club/[id] 등). 진짜
    구멍은 두 가지: ① **임베디드 컴포넌트의 에러 삼킴**(`CompleteMatchModal`·`ClubAnnouncementTab`·`ClubListContent`
    totalCount), ② **다중쿼리 훅의 보조쿼리 무음 저하**(`useChatRoom`·`useUserProfileData`·`useScrimmageDetail`).

    - **접근**: 전수 ErrorRetry 강제가 아니라 **"표시 필수 / 무음 저하 허용" 분류** 후 필수만 닫고 허용은 주석으로 명시.
    로딩은 이미 양호(스켈레톤) → **에러 UX만**. → [20 문서](../작업완료/20-query-error-ux-coverage.md).

    - **개선 효과(§8)**: "빈 화면이 실패인지 진짜 빈 데이터인지" 구분됨. 표시-필수 에러 누락 3~5건 → 0. 컨벤션 가드로 재발
    방지(F2 연동).'
- anchor: reference/improvement-catalog#A3.-채팅-화면-스크롤/키보드-분리-→-23-상세-문서(../작업완료/23-chat-screen-scroll-keyboard-extraction.md)-✅
  doc: reference/08-improvement-catalog.md
  text: '### A3. 채팅 화면 스크롤/키보드 분리 → [23 상세 문서](../작업완료/23-chat-screen-scroll-keyboard-extraction.md)
    ✅


    - **재조사 정정**: 초판은 "거대 화면 분해(home 390줄·chat 413줄, 오케스트레이션+로직 혼재, CLAUDE.md 위반)"라
    했으나 **과장이었다.** 전수 확인 결과 `home/index.tsx`(390)·`chat/[roomId].tsx`(410) 모두 이미 도메인
    훅으로 잘 분해돼 화면은 조립 역할. "오케스트레이션만" 위반 아님 → 범위를 chat 스크롤/키보드로 축소.

    - **완료(2026-06-03)**: `chat/[roomId].tsx`의 스크롤·키보드 인라인 로직을 `useChatScroll`(63줄)·`useChatKeyboard`(37줄)로
    추출. 화면 **410→373줄**. 라인 추정은 카탈로그 메모(149-169, 207-250)가 아니라 실측(스크롤 149-173 + 키보드
    53-57·302-311; 207-250은 헤더라 제외)으로 잡음.

    - **검증**: 순수 리팩토링·동작 불변. tsc 0 / lint 78≤88 / 단위 136 / L3 `05-chat` 2/2 통과. native
    키보드 분기 코드 보존. → [23 문서](../작업완료/23-chat-screen-scroll-keyboard-extraction.md).

    - **개선 효과(§8)**: 08 §A 섹션(A1·A2·A3) **전부 완료**. 다음 채팅 스크롤/키보드 변경이 화면 아닌 훅에서.


    ---'
- anchor: reference/improvement-catalog#B.-백엔드·데이터-모델
  doc: reference/08-improvement-catalog.md
  text: '## B. 백엔드·데이터 모델'
- anchor: reference/improvement-catalog#B1.-데이터-모델-정규화
  doc: reference/08-improvement-catalog.md
  text: '### B1. 데이터 모델 정규화


    - **현재(증거)**: `admin_positions TEXT[]` 배열(마이그레이션 00066/67/68, `lib/api/clubs.ts`·`ClubDetailContext`·`useClubMemberActions`에서
    사용, 사용처 18곳). `clubs.level/positions`도 배열. jsonb(`notifications.metadata` 등) 스키마
    검증 없음. **마이그레이션 fix류 비율 실측 11.5%(12/104)** — 스키마 아직 흔들림(초판 "18%"는 과대였음).

    - **접근**: 배열→enum/정규화 테이블(예: `club_admin_positions`), 유니크 제약. jsonb는 경계 zod(Phase
    7과 연계). **마이그레이션 전진만(00105+)**, 점진.

    - **검증**: 마이그레이션 후 `db:types:local` drift 0, L2 통합 테스트(권한·직책).

    - **개선 효과(§8)**: 직책/레벨 쿼리·제약이 타입·DB 레벨로 보장. 배열 인덱스 성능 위험 제거.

    - **착수 시**: Phase 4(권한)·7(타입)과 묶어 판단. 영향 크니 신중히. **단 동작엔 문제 없으므로 E·D1·G 뒤.**'
- anchor: reference/improvement-catalog#B2.-푸시-Receipt-확인-(Tier-3)
  doc: reference/08-improvement-catalog.md
  text: '### B2. 푸시 Receipt 확인 (Tier 3)


    - **현재(검증)**: Phase 4가 Tier 1(로그)·2(재시도)까지. `send-push/index.ts:249-256`은 Expo
    응답의 `ticket_id`만 저장 → **receipt(실제 단말 도달) 미확인**.

    - **접근**: 발송 시 ticket 저장 → 별도 cron이 Expo receipt 조회 → 최종 상태 `_push_log` 기록.

    - **검증**: 발송→receipt 폴링→상태 기록 확인.

    - **개선 효과(§8)**: 전달률을 "서버가 보냄"에서 "단말이 받음"으로. **실유저 90명 리텐션에 직접** — 알림이 안 가면 안
    돌아옴. 그래서 백엔드 중 가장 상위(권장순 4).'
- anchor: reference/improvement-catalog#B3.-RLS-정책-전수-재감사
  doc: reference/08-improvement-catalog.md
  text: '### B3. RLS 정책 전수 재감사


    - **현재**: 채팅 재귀(00027)·anon 우회(00085)는 사후 발견·수정됨. 다른 자기참조/정책 일관성은 미검증.

    - **접근**: 자기참조 정책이 모두 SECURITY DEFINER 헬퍼 경유하는지, 정책 네이밍·banned 적용 일관성 점검. L2로
    음성 테스트.

    - **개선 효과(§8)**: "사후 발견" 보안 결함을 사전 차단. 안 보이지만 사고 예방.


    ---'
- anchor: reference/improvement-catalog#C.-안전망-확장
  doc: reference/08-improvement-catalog.md
  text: '## C. 안전망 확장'
- anchor: reference/improvement-catalog#C1.-네이티브-E2E-(Android)
  doc: reference/08-improvement-catalog.md
  text: '### C1. 네이티브 E2E (Android)


    - **현재**: Phase 3은 **web-only**(Playwright). 네이티브 회귀는 자동 안 잡힘.

    - **접근**: Detox 또는 Maestro로 핵심 플로우(로그인·참여·채팅) Android. 시드/로컬 supabase 재사용.

    - **개선 효과(§8)**: 앱 본체(네이티브) 회귀 차단. web만 잡던 안전망을 양 플랫폼으로.

    - **비용 큼** — 여력 보고 결정.'
- anchor: reference/improvement-catalog#C2.-소스맵-업로드-검증
  doc: reference/08-improvement-catalog.md
  text: '### C2. 소스맵 업로드 검증


    - **현재**: Phase 1에서 설정은 했고 "다음 EAS production 빌드에서 검증" 잔여.

    - **접근**: production 빌드 후 Sentry에서 minify 아닌 원본 스택 확인.

    - **개선 효과(§8)**: 프로덕션 에러 스택이 읽힘 → 디버깅 속도. 소(작은) 마무리.


    ---'
- anchor: reference/improvement-catalog#D.-확장성-/-제품
  doc: reference/08-improvement-catalog.md
  text: '## D. 확장성 / 제품'
- anchor: reference/improvement-catalog#D1.-제품-분석-—-퍼널·리텐션-가시화-(재정의·상향-—-2026-06-03)-→-24-상세-문서-§D1(../작업완료/24-scalability-product-infra.md)
  doc: reference/08-improvement-catalog.md
  text: '### D1. 제품 분석 — 퍼널·리텐션 가시화 (재정의·상향 — 2026-06-03) → [24 상세 문서 §D1](../작업완료/24-scalability-product-infra.md)


    - **현재(검증)**: `lib/analytics.ts`의 `trackEvent`/`identifyUser`가 **`console.log`
    스텁이고 호출처 0건**(전수 확인). 즉 **실유저 90명의 행동을 전혀 측정하지 못함** — 의사결정이 깜깜이.

    - **재정의**: 초판의 "분석 활성화(스텁 채우기)"가 아니라 **"90 유저의 activation/retention 가시화"**가 목표.
    단순 이벤트 송신이 아니라 **퍼널(가입→프로필완성→동호회참여→경기신청→재방문)과 7/30일 리텐션**을 본다.

    - **접근**: 백엔드 연결(PostHog/Amplitude) + 핵심 이벤트 정의 + PII 스크럽(Phase 1 패턴 재사용) + 퍼널/리텐션
    대시보드. Sentry 알림은 F1과, 푸시 도달은 B2와 연계.

    - **검증**: 이벤트가 대시보드에 도달, PII 스크럽 확인.

    - **개선 효과(§8)**: "어디서 새는지"가 보임 → 다음 작업(G. 리텐션 대응)의 **유일한 근거**. 데이터 없이 기능 늘리던 바이브
    코딩의 반대.

    - **권장순 2(상향)** — 실유저가 이미 있으니 늦었음. E(폴리시) 바로 다음. **측정이 없으면 G도 못 함.**'
- anchor: reference/improvement-catalog#D2.-의존성-건강-전략-→-24-상세-문서-§D2(../작업완료/24-scalability-product-infra.md)
  doc: reference/08-improvement-catalog.md
  text: '### D2. 의존성 건강 전략 → [24 상세 문서 §D2](../작업완료/24-scalability-product-infra.md)


    - **✅ 완료(2026-06-04)**: RN `^0.83.4`→exact 고정(위험 caret 1→0), `.cursor/rules/dependency-policy.mdc`(변동성
    3등급표·patch-package 추적표), `.github/dependabot.yml`(weekly·그룹 6개·major ignore·PR
    한도 5).

    - **개선 효과(§8)**: 다음 메이저에서 안 헤맴. 안 보이지만 유지보수 비용↓. 메이저 업그레이드 자체(React 19/RN 0.83/Reanimated
    4 조합)는 dependabot 인지 후 별도 계획.'
- anchor: reference/improvement-catalog#D3.-릴리즈-자동화-→-24-상세-문서-§D3(../작업완료/24-scalability-product-infra.md)
  doc: reference/08-improvement-catalog.md
  text: '### D3. 릴리즈 자동화 → [24 상세 문서 §D3](../작업완료/24-scalability-product-infra.md)


    - **✅ 완료(2026-06-04)**: share-link 헬스체크(`deploy-healthcheck.yml` + `scripts/check-share-links.sh`),
    배포 설정 정적 게이트(`scripts/check-deploy-config.sh` → ci.yml fail-fast 스텝), 릴리즈 체크리스트(`.cursor/rules/release-checklist.mdc`
    — DB·엣지 함수 수동 단계 포함).

    - **개선 효과(§8)**: "배포가 무서운" 상태 완화, share-link 회귀가 사람 손 없이 잡힘. EAS 빌드 자동 트리거·단계적
    롤아웃은 범위 밖 잔여(24 §6).


    ---'
- anchor: reference/improvement-catalog#G.-리텐션·활성화-대응-(신규-·-2026-06-03-·-08의-사각지대)
  doc: reference/08-improvement-catalog.md
  text: '## G. 리텐션·활성화 대응 (신규 · 2026-06-03 · 08의 사각지대)


    > 초판은 13개 항목 전부 **내부 기술부채**였고 사용자 가치·성장·리텐션은 스코프 0이었다. 그러나 유저 90명·동호회 56개가 도는
    지금, 핵심 질문은 *"이들이 다시 오는가, 동호회가 살아있는가, 어디서 새는가"*다. D1(측정)이 도구라면, G는 **그 측정 결과에 대응하는
    제품 작업**이다. **D1 선행 필요.**'
- anchor: reference/improvement-catalog#G2.-동호회-활성도-실태-점검-(싼-선행-조사-—-권장순-0)
  doc: reference/08-improvement-catalog.md
  text: '### G2. 동호회 활성도 실태 점검 (싼 선행 조사 — 권장순 0)


    - **현재(가설)**: prod 동호회는 대부분 `registration_type=''shared''`로 추정. 56개 중 **실제 멤버십·활동이
    도는 managed가 몇 개인지** 미확인.

    - **왜 중요**: 56이 다 활성이면 콘텐츠 충분, 대부분 정보성 shared면 "동호회는 많은데 참여 동선은 비어있는" 다른 그림 →
    G1·D1 이벤트 정의 방향이 갈림.

    - **접근**: DB 집계 한 방(`registration_type`·멤버수·최근 활동 분포)이면 나옴. **비용 소, 레버리지 큼** →
    G1·D1·E보다 먼저 슬쩍.

    - **권장순 0**: 이후 방향을 가르는 사전 확인.'
- anchor: reference/improvement-catalog#G1.-이탈-지점-대응-루프-(권장순-3)
