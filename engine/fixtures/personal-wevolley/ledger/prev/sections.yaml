- anchor: backlog/view-as-member-v2#37-—-일반-회원-모드-v2:-클럽-관리자-표면까지-(View-as-Member-v2)
  doc: backlog/37-view-as-member-v2.md
  text: '# 37 — 일반 회원 모드 v2: 클럽 관리자 표면까지 (View-as-Member v2)


    > 작성일: 2026-07-02

    > 선행/연계: PR #81(v1 — `viewAsMember` 토글 + auth.tsx 단일 파생 지점)이 인프라. 이 문서는 v1의 **체감
    0 문제 진단 + 표면 확장**.

    > 범위: **클라이언트 뷰 모드만.** 서버(RLS·RPC) 권한 전환(impersonation)은 하지 않는다.

    > 한 줄 요약: v1 토글은 app_role 게이트만 내렸는데, 유저가 일상에서 보는 관리자 UI의 대부분은 club_members role(진짜
    클럽 관리자)에서 나온다 — 그래서 켜도 아무것도 안 달라져 보였다. v2는 클럽 관리자 표면까지 내리고, 모드 상태를 화면에 상시 표시한다.


    ---'
- anchor: backlog/view-as-member-v2#§1-최종-목표-(Definition-of-Done)
  doc: backlog/37-view-as-member-v2.md
  text: '## §1 최종 목표 (Definition of Done)


    1. 일반 회원 모드 ON 상태에서 **홈 내 동호회 카드의 운영 액션 행([일정 등록·공지 쓰기·관리])이 사라진다** (실제 club admin이어도).

    2. ON 상태에서 **자기 클럽 상세가 일반 회원 시점**이 된다: 관리 탭/버튼·회원 승인·수정 진입이 숨고, 회원용 CTA만 남는다 (`ClubDetailContext.isClubAdmin`
    게이트 일괄).

    3. ON 상태에서 **모든 화면 상단에 모드 인디케이터**(얇은 배너 "일반 회원 모드로 보는 중 · 끄기")가 떠서, 켜져 있음을 잊거나
    "변화 없음"으로 오인하지 않는다. 배너의 "끄기"로 즉시 복귀된다.

    4. OFF로 되돌리면 1~3이 전부 원상복구된다 (새로고침 불필요).

    5. 정보성 role 뱃지(my-clubs·members 화면의 ''관리자'' 라벨)는 **바꾸지 않는다** — 행동 게이트만 내린다 (§3.2).

    6. web에서 1~5가 성립한다 (native는 다음 EAS 빌드에서 확인 — planning/35·36 잔여와 함께).


    **성공 측정**: 토글 ON 직후 유저가 "달라졌다"를 3초 안에 인지 (배너 + 홈 footer 소멸). 정성적으로: 운영자가 일반 회원의
    빈 화면/CTA 문제를 재현해 리포트하는 사례 발생.'
