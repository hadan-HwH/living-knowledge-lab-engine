- anchor: backlog/view-as-member-v2#구멍-—-왜-체감이-0인가-(근본-원인)
  doc: backlog/37-view-as-member-v2.md
  text: "### 구멍 — 왜 체감이 0인가 (근본 원인)\n\n**관리자 UI는 두 계통인데 v1은 한 계통만 내렸다:**\n\n1. **app_role\
    \ 계통** (v1이 내림) — `useAuth().isSuperAdmin/isAdmin` 소비처 15파일. 그런데 이 게이트가 가리는 표면은\
    \ 마이페이지 메뉴 2~3줄, admin 화면(`app/admin/*`), claims, **남의** 클럽/대회에서의 승격뿐. 운영자는 평소\
    \ 자기 클럽만 보므로 이 표면을 거의 안 지나간다.\n2. **club_members role 계통** (v1이 안 내림) — 소비처 실측:\n\
    \   - `components/home/MyClubsSection.tsx:138` `const isAdmin = item.role ===\
    \ 'admin'` → **홈 관리자 카드 footer** (36에서 방금 추가한, 홈에서 가장 눈에 띄는 관리자 UI)\n   - `lib/contexts/ClubDetailContext.tsx:103`\
    \ `isClubAdmin = membership?.role === 'admin'` → 클럽 상세의 관리 UI 전부 (`isAdmin`:105,\
    \ `isPresident`:104, `canEdit`:109가 여기서 파생)\n   - `app/(tabs)/club/[id]/index.tsx:61`\
    \ 인라인 `isClubAdmin` (알려진 부채 화면 — CLAUDE.md의 인라인 read 4곳 중 하나) → `ClubDetailHeader`의\
    \ 게스트 문의 분기(:163)\n   - 정보성 뱃지: `my-clubs.tsx:81`, `MemberCard.tsx:42,53` (행동\
    \ 아님 — §3.2)\n\n   **실제 운영자(super_admin)는 자기 클럽들의 진짜 club admin이기도 하므로**, 토글을\
    \ 켜도 홈 footer·클럽 관리 UI가 전부 그대로다. 이게 \"달라지는 게 없는데?\"의 정체.\n\n3. **모드 표시 부재** —\
    \ 켜져 있음을 아는 방법이 마이페이지 토글 행 하나뿐. 다른 탭으로 이동하는 순간 모드 상태가 보이지 않는다.\n4. (참고) **서버 계통**\
    \ — migrations에서 `super_admin` 언급 30파일, 정책류(using/check) 12건, `app_role` 체크 RPC\
    \ 13파일. RLS가 super admin에게 더 반환하는 행은 클라이언트 토글로 못 막는다. v2에서도 범위 밖 (§6)."
- anchor: backlog/view-as-member-v2#핵심-통찰
  doc: backlog/37-view-as-member-v2.md
  text: '### 핵심 통찰


    - **"일반 회원처럼 보기"의 체감은 app_role이 아니라 club role 표면에서 나온다.** 홈 footer(방금 36에서 추가)와
    클럽 상세 관리 UI가 유저 시야의 90%.

    - club role 게이트도 사실상 두 곳(`MyClubsSection:138`, `ClubDetailContext:103` + 부채 인라인
    1곳)에 모여 있어 v2 변경도 좁다 — v1과 같은 "파생 지점만 고치면 일괄 적용" 구조가 성립한다.'
- anchor: backlog/view-as-member-v2#§3-설계-고려사항
