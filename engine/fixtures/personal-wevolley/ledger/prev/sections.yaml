- anchor: reference/bot-ops-runbook#4-4.-상태-확인-치트시트
  doc: reference/49-bot-ops-runbook.md
  text: "### 4-4. 상태 확인 치트시트\n\n```sql\nSELECT kind, status, count(*) FROM community_bot_schedule\
    \ GROUP BY 1,2 ORDER BY 1,2;\nSELECT status, count(*) FROM community_bot_events\
    \ GROUP BY 1;\nSELECT s.status, s.kind, s.category, s.scheduled_at, left(s.body,40)\
    \ AS body, cp.nickname\n  FROM community_bot_schedule s JOIN community_profiles\
    \ cp ON cp.user_id = s.persona_user_id\n WHERE s.run_id = '<RUN_ID>' ORDER BY\
    \ s.scheduled_at;\n```\n\nUI 확인은 verifier-web 스킬(시드 계정 로그인 → 커뮤니티 탭 스크린샷)."
- anchor: reference/bot-ops-runbook#§5-트러블슈팅
  doc: reference/49-bot-ops-runbook.md
  text: '## §5 트러블슈팅


    1. **`SERVICE_ROLE_KEY`는 반드시 JWT 형태**(role=service_role 클레임) - `SECRET_KEY` 아님(시드
    스크립트 헤더 주석 실측). 401이 나면 이것부터 의심.

    2. **로컬 크론이 prod를 호출한다** - 로컬 스택이 떠 있는 동안 5분마다 `invoke_bot_function`이 `_push_config`의
    prod 값으로 prod publisher를 때릴 수 있다. §4-2 리다이렉트를 기동 습관으로.

    3. **승인 시프트 도배** - psql 승인 시 §3-3 시프트 문장을 빼먹으면 지난 시각 예약이 한 틱에 몰려 발행된다. prod에서는
    psql 승인 자체를 지양(§1).

    4. **GoTrue 시드 버그** - 로컬 CLI GoTrue ES256 이슈로 Admin API 유저 생성이 403. `auth.users`
    직접 INSERT로 우회(§4-3).

    5. **콘텐츠 예약을 body만 고치면 깨진다** - `admin_update_bot_schedule`은 content JSONB를 안 건드린다.
    취소 후 재집필이 정답(§2).

    6. **publisher 재배포 순서** - 새 컬럼을 쓰는 publisher를 마이그레이션보다 먼저 배포하면 없는 컬럼 SELECT로 5분마다
    500. 항상 `supabase db push` 먼저, `functions deploy` 나중.

    7. **디렉터 `no active personas`** - 페르소나 미시드 상태. §4-3 최초 1회 시드.

    8. `.env`(리포 루트)는 prod 자격증명을 담고 있다 - service_role은 항상 쉘에서 명시적으로 넘기고, 어느 URL을 향해
    쏘는지 커맨드마다 확인. API 키를 리포 파일에 커밋하지 말 것(로컬은 gitignore된 `supabase/functions/.env`,
    prod는 secrets만).'
- anchor: reference/bot-ops-runbook#§6-봇별-매뉴얼
  doc: reference/49-bot-ops-runbook.md
  text: '## §6 봇별 매뉴얼


    §0 지도의 컴포넌트별 상세. 각 항목 = 역할 / 트리거 / 조작 손잡이 / 자주 하는 작업 / 이상 징후.'
- anchor: reference/bot-ops-runbook#6-1.-/bot-react-(Claude-Code-스킬)---반응-두뇌
  doc: reference/49-bot-ops-runbook.md
  text: "### 6-1. /bot-react (Claude Code 스킬) - 반응 두뇌\n\n- **역할**: 이벤트 큐 소비 → 반응 댓글\
    \ 판단·집필(확률표, 한두 줄 상한) + liker 건강 점검.\n  **글은 집필하지 않는다** - 잡담·콘텐츠 리마인드만 리포트에 띄운다\
    \ (planning/57).\n- **트리거**: 수동 딸깍(하루 2~3회 권장) 또는 `scripts/bot-auto.sh on`(launchd\
    \ 45분).\n- **조작**: 대상 DB는 `WEVOLLEY_BOT_DB_URL` export 여부(없으면 로컬). 킬스위치·상한은 전부\n\
    \  `community_bot_config` (enabled, max_posts_per_day, require_approval, auto_react_enabled).\n\
    - **자주 하는 작업**: 틱 실행 → 리포트 확인 → awaiting_approval 있으면 승인(§1).\n- **이상 징후**: 리포트에\
    \ skipped 사유가 반복되면 §5 트러블슈팅. RPC 에러(캡 도달 등)는\n  정상 방어 동작 - 우회 금지. \"liker 오늘 무활동\"\
    \ 경고는 크론·킬스위치 확인."
- anchor: reference/bot-ops-runbook#6-1b.-/bot-chat-(Claude-Code-스킬)---잡담-두뇌
  doc: reference/49-bot-ops-runbook.md
  text: "### 6-1b. /bot-chat (Claude Code 스킬) - 잡담 두뇌\n\n- **역할**: 대화 페르소나 잡담 글 1건\
    \ 집필·예약. 소재는 DB 풀(community_bot_topics) +\n  WebSearch 뉴스, 태그 0~2개. 콘텐츠채널 페르소나는\
    \ 제외.\n- **트리거**: 수동 딸깍 - 원할 때 (매일 강제 아님, 하루 1건 이하 리듬).\n- **조작**: 킬스위치·승인 게이트·글\
    \ 예산(max_posts_per_day)은 콘텐츠와 공유.\n- **이상 징후**: \"오늘 잡담 이미 있음\" = 정상 게이트 (더 쓸지\
    \ 사용자 확인)."
- anchor: reference/bot-ops-runbook#6-1c.-/bot-cards·/bot-article-(Claude-Code-스킬)---콘텐츠-두뇌
  doc: reference/49-bot-ops-runbook.md
  text: "### 6-1c. /bot-cards·/bot-article (Claude Code 스킬) - 콘텐츠 두뇌\n\n- **역할**:\
    \ 콘텐츠 채널 글 1건 집필·예약 - /bot-cards는 스텝형 카드뉴스(하드 상한),\n  /bot-article은 줄글 아티클(확장\
    \ 규격). **포맷은 운영자가 스킬 선택으로 결정** - 자동\n  판단 없음. 채널은 요일 슬롯(화 뉴스·목 꿀팁·토 장비) 기본값 +\
    \ 어느 채널이든 지정 가능.\n  소재는 `bot/topics.md` 백로그 소비, 발행 기록은 `bot/content-log.md`.\n\
    - **파이프라인**: 리서치 서브에이전트(팩트팩·앵글) → 집필 → 비평 서브에이전트(팩트 대조·\n  무정보 리젝·규격 검증) → 퇴고\
    \ → 예약. `deep` 인자로 Workflow 승격(리서치 팬아웃 3 +\n  초안 경쟁 2 + 심사 - 비용 수 배, 공들일 소재에만).\n\
    - **트리거**: 수동 딸깍 - 슬롯 요일에, 또는 \"이 주제로 카드뉴스 써줘\" 같은 지정 실행.\n- **조작**: /bot-react와\
    \ 같은 킬스위치·승인 게이트·글 예산(max_posts_per_day) 공유.\n- **이상 징후**: \"오늘 콘텐츠 이미 집필됨\" =\
    \ 정상 게이트(카드뉴스·아티클 합산 하루 1건,\n  재집필은 기존 예약 취소 후). 잘못 쓴 콘텐츠는 body만 고치지 말고 취소 후 재집필(§2)."
- anchor: reference/bot-ops-runbook#6-1d.-/bot-cards-insta---인스타-추출-(집필과-별개)
  doc: reference/49-bot-ops-runbook.md
  text: "### 6-1d. /bot-cards insta - 인스타 추출 (집필과 별개)\n\n- **역할**: 이미 쓴 콘텐츠(또는 새 원고)를\
    \ VOLT 템플릿 PNG 묶음(1080×1350)으로 굽는다.\n  업로드는 운영자 수동 - 자동 게시 경로는 없다.\n- **DB 읽기\
    \ 전용**: 예약·발행 SQL을 타지 않는다. 글 예산·승인 게이트와 무관.\n- **앱과의 관계**: 앱 카드뉴스는 계속 텍스트 v3 JSON을\
    \ `ContentDeckCarousel`이 그린다.\n  PNG는 앱 파이프라인에 끼지 않는다 (planning/58, DECISIONS\
    \ 0020).\n- **아티클 커버**: /bot-article이 같은 템플릿(5a~5d)에서 구워 `image_url`에 넣는다.\n-\
    \ **이상 징후**: \"폰트 로드 실패\" = 네트워크(CDN 미도달). 오프라인에서는 굽지 않는다 -\n  대체 폰트로 렌더된 PNG를\
    \ 만드느니 죽도록 설계돼 있다. \"슬롯이 비었습니다\"는 스펙\n  누락, \"카드 크기가 어긋납니다\"는 글자 초과 - 우회하지 말고\
    \ 원문을 줄인다.\n- **산출물**: `bot/cardnews/out/<이름>/` (gitignore). 템플릿·규칙은 `bot/cardnews/README.md`."
- anchor: reference/bot-ops-runbook#6-2.-community-bot-publisher---손
  doc: reference/49-bot-ops-runbook.md
  text: "### 6-2. community-bot-publisher - 손\n\n- **역할**: 시각 도달한 `community_bot_schedule`\
    \ 예약을 실제 글/댓글로 INSERT. content JSONB\n  패스스루(00146). 발행분을 다시 이벤트 큐에 적재(봇끼리 창발\
    \ 루프).\n- **트리거**: 5분 크론(00145). 로컬은 크론 대신 §3-4 수동 틱.\n- **조작**: 킬스위치 종속. CAS\
    \ 클레임이라 중복 발행 없음.\n- **이상 징후**: 5분마다 500 → 마이그레이션보다 함수를 먼저 배포한 경우(§5-6). 발행이 안\
    \ 되면\n  status·scheduled_at 확인(§4-4 치트시트)."
- anchor: reference/bot-ops-runbook#6-3.-community-bot-liker---좋아요
  doc: reference/49-bot-ops-runbook.md
  text: "### 6-3. community-bot-liker - 좋아요\n\n- **역할**: 최근 48h 글에 페르소나 좋아요. **사람\
    \ 글 0.8 · 봇 글(콘텐츠 포함) 0.4** 확률\n  (2026-07-18 확장), 자기 글 금지, 글당 페르소나 1명씩 누적. 틱당\
    \ 0~3개 랜덤(조용한 틱 있음),\n  일일 상한 `max_likes_per_day`.\n- **트리거**: 크론 3회/일 KST 09:10·14:10·20:50(00140).\n\
    - **조작**: 킬스위치 종속. 확률·틱당 개수는 함수 상수(HUMAN_POST_P/BOT_POST_P/PER_RUN_MAX) -\n  수정\
    \ 시 `supabase functions deploy community-bot-liker` 수동 배포.\n- **이상 징후**: 좋아요가\
    \ 안 찍히면 enabled·일일 상한·활성 페르소나 수 확인. LLM 무관이라\n  키 이슈는 없다."
- anchor: reference/bot-ops-runbook#6-4.-community-bot-moderator---감시
  doc: reference/49-bot-ops-runbook.md
  text: "### 6-4. community-bot-moderator - 감시\n\n- **역할**: 신규·수정 글/댓글을 하드 룰과 대조해\
    \ 자동 숨김 + 검토 큐 적재. **사람 글도 대상,\n  킬스위치와 무관하게 돈다**(안전장치는 봇 정지와 독립).\n- **트리거**:\
    \ 크론 2회/일 KST 13:10·21:10(00136).\n- **조작**: 하드 룰은 키 없이 동작. LLM 판정 보강은 ANTHROPIC\
    \ 키가 있을 때만(prod엔 없음 = 하드 룰 온리).\n- **이상 징후**: 오탐 숨김은 검토 큐에서 복원. 규칙 변경은 마이그레이션으로."
- anchor: reference/bot-ops-runbook#6-5.-community-bot-director---수동-주입-(레거시-경로)
  doc: reference/49-bot-ops-runbook.md
  text: "### 6-5. community-bot-director - 수동 주입 (레거시 경로)\n\n- **역할**: 대본(scenes JSON)\
    \ 수동 주입 - LLM 무호출, 검증·시각 배정·승인 흐름만(§3).\n  일상 운영은 /bot-react가 대체했고, 특정 장면을 정확히\
    \ 심고 싶을 때만 쓴다(/bot-daily 스킬 경유 권장).\n- **트리거**: POST 수동 호출. 크론(00126)은 남아 있으나\
    \ prod에 키가 없어 자동 집필은 안 돈다.\n- **이상 징후**: `no active personas` → §4-3 시드. 검증 위반\
    \ 행은 조용히 드롭되니 dry=1로 먼저."
- anchor: reference/bot-ops-runbook#6-6.-community-bot-events-retention---청소
  doc: reference/49-bot-ops-runbook.md
  text: '### 6-6. community-bot-events-retention - 청소


    - **역할**: 이벤트 큐 정리(done/skipped 14일·pending 30일 경과분 삭제). 틱 마무리 정리의 백스톱.

    - **트리거**: 크론 매일 KST 04:05(00145). 조작할 일 없음.'
- anchor: reference/bot-ops-runbook#6-7.-scripts/bot-auto.sh---자동-딸깍-(옵션)
  doc: reference/49-bot-ops-runbook.md
  text: "### 6-7. scripts/bot-auto.sh - 자동 딸깍 (옵션)\n\n- **역할**: launchd가 45분마다 `claude\
    \ -p \"/bot-react\"` 헤드리스 실행.\n- **조작**: `bot-auto.sh on|off|status`. prod 자동화는\
    \ `WEVOLLEY_BOT_DB_URL` export한 셸에서\n  `on` 실행(plist에 박힘). 맥이 꺼져 있으면 안 돈다 - 수동\
    \ 딸깍과 병행 전제.\n  스킬명이 plist에 박제되므로 2026-07-20 개명 이전 plist는 off→on 재생성."
- anchor: reference/bot-ops-runbook#6-8.-운영-대장-(bot/-폴더)
  doc: reference/49-bot-ops-runbook.md
  text: '### 6-8. 운영 대장 (bot/ 폴더)


    `bot/topics.md`(소재 대장)·`bot/content-log.md`(발행 대장) - 콘텐츠 딸깍·/bot-chat이 갱신,

    커밋은 운영자. 규칙과 진실의 원천 구분은 `bot/README.md`.'
- anchor: reference/linkedin-100days-series#링크드인-연재:-100일간의-1인-풀스택-개발-(위볼리)
  doc: reference/linkedin-100days-series.md
  text: '# 링크드인 연재: 100일간의 1인 풀스택 개발 (위볼리)


    > 작성일: 2026-07-18 (개정 1: 포지셔닝·관통 서사 반영). 편별 초안의 원자재 문서. 모든 수치는 repo 실측 (git log,
    PR 목록, planning/ 문서).

    > 원칙: 잘한 것 자랑이 아니라 "실패 장면 -> 선택과 근거(기각한 대안 포함) -> 실측 결과 -> 업무에 가져간 것" 4단 고정 스켈레톤.
    수치는 사실만, 프레이밍은 메시지 중심으로.'
- anchor: reference/linkedin-100days-series#0-A.-포지셔닝-(시리즈-전체의-정체성)
  doc: reference/linkedin-100days-series.md
  text: "## 0-A. 포지셔닝 (시리즈 전체의 정체성)\n\n**저자 페르소나**: \"코딩 못하는데 AI로 성공\" 서사가 아님. 그 장르는\
    \ 이미 포화. 저자는\n\n- 전공자이자, 개발에 깊게 관여해온 PM/기획자\n- 앱 개발 지식 + 인프라 지식 보유. 특히 **DB 구조를\
    \ 중심으로 사고**하는 사람\n- 그래서 바이브코딩이지만, 아키텍처의 중심을 잡고 확장성을 전제한 상태에서 시작\n\n**관통 메시지 (모든\
    \ 편의 저류)**:\n\n> \"AI가 실행을 맡는 시대에 사람의 일은 두 가지로 수렴한다. 아키텍처를 잡는 일과, 요구사항을 발견하는 일.\
    \ 바이브코딩의 상한은 프롬프트 실력이 아니라 설계 역량이 정한다.\"\n\n이 포지셔닝의 실측 근거 (반박 대비): 출시 한 달 뒤 자체\
    \ 감사(planning/00)의 진단이 정확히 \"구조(아키텍처 선언)는 좋다. 강제와 관측성이 없다\"였음. 즉 설계는 버텼고, 무너진\
    \ 건 규율. \"설계를 머리에 넣고 시작했다\"는 주장이 사후 감사 문서로 증명되는 구조.\n\n**시작 동기 (두 층 구조, 1편 오프닝,\
    \ 5편 수미상관)**:\n\n개인 동기 (진짜 동기, 1편의 축):\n\n- \"모든 것을 나 혼자 해보자. 혼자 한다면 어디까지 갈까?\"\
    라는 오래된 궁금증.\n- 수번의 창업을 거치며 기획/프론트/백엔드/디자인/사업/마케팅을 조금씩 다 만졌지만, 지식이 흩어져 있었다. 분야\
    \ 사이의 뚜렷한 경계선에 대한 막연한 두려움.\n- 흩어진 실무 지식을 하나로 연결해서 **파이프라인화 + 최적화**하고 싶었다. 이건 사업이\
    \ 아니라 **나의 공부**다.\n- AI 동기: AI를 어디까지 활용할 수 있는지, 최신 기술을 직접 적용하며 배우고 싶었다. \"잘\"\
    \ 쓴다는 게 뭔지는 끝까지 써본 사람만 아니까.\n\n제품 비전 (명분이자 소재 선택 이유):\n\n> \"운영자가 갈려 나가지 않는 동호회.\
    \ 총무 없이, 공지 담당 없이, 완전 자동화와 탈중앙화로 돌아가는 커뮤니티. 멋지지 않나?\"\n\n두 층의 관계: 공부가 목적이므로 소재는\
    \ 제일 잘 아는 도메인(배구 동호회)을 골랐고, \"완전 자동화\"라는 제품 목표가 공부 범위(운영/자동화까지)를 끝까지 밀어붙이는 장치가\
    \ 됐다. 1편에서 두 층을 다 깔고, 5편에서 제품 비전은 크론 테이블과 봇 파이프라인으로, 개인 동기는 회사 적용으로 각각 회수된다.\n\
    \n**관통 서사 2: 요구사항은 발견되는 것** (매 편에 한 장면씩 심기):\n\n- 요구사항의 1차 원천 = 저자 본인이 실사용자 (배구\
    \ 동호회 활동). 기획서가 아니라 코트에서 나온 백로그.\n- 출시 후 원천 이동 = 유저 90명의 실사용. 실기기 피드백이 당일 PR로\
    \ (#90, #91).\n- 기획이 기획을 낳는 순간들 = 클럽 금고를 기획하다 게스트비 수금 요구를 발견, 같은 날 게스트 도메인 결정이\
    \ 뒤집힘 (DECISIONS 0004 -> 0005, 번복 기록 보존).\n- 메시지: \"요구사항은 문서에서 안 나온다. 운영에서 나온다.\
    \ 그래서 결정 로그는 append-only여야 한다.\"\n\n**관통 서사 3: 성장 아크 (두려움 -> 사이클 완성 -> 회사 적용)**\
    \ (1편에서 심고 5편에서 회수):\n\n- 시작점의 고백: 수번의 창업으로 여러 분야를 만져봤지만 지식이 흩어져 있었고, 분야 사이의 **뚜렷한\
    \ 경계선에 대한 막연한 두려움**이 있었다. 특히 풀스택 엔지니어링(백엔드, 인프라, 배포)은 \"개발자의 땅\"이라고 선을 그어 왔다.\n\
    - 100일의 결과: 요구사항 -> 기획 -> 아키텍처/DB 설계 -> 프론트 -> 백엔드 -> 구현/배포까지 **한 사이클을 혼자 완주**.\
    \ 흩어져 있던 지식이 하나의 파이프라인으로 연결됨. 두려움의 정체는 능력 부족이 아니라 사이클을 끝까지 돌아본 경험의 부재였다.\n- 회사\
    \ 적용 (5편 마무리의 실체, 시리즈의 최종 답):\n  - 백엔드를 이해하게 되면서 회사의 audit, builder 앱 **프론트 개발을\
    \ 직접 맡아** 바로 적용. API 경계와 데이터 구조를 아는 프론트 개발은 협업 비용 자체가 다르다.\n  - 기획/정책 문서도 이 사이클을\
    \ 담은 형식으로 전환 (요구사항의 출처 -> 데이터 모델 영향 -> 검증 방법까지 한 문서에).\n  - 도구까지 바꿈: **노션과 피그마를\
    \ 버리고, 기획 문서를 전부 GitHub에서 하자고 회사에 제안**. 이 프로젝트의 planning/ + DECISIONS.md 체제(코드와\
    \ 문서가 같은 repo, 같은 PR, 같은 리뷰)를 그대로 이식한 것. 문서가 코드 옆에 있어야 AI도 사람도 같은 컨텍스트로 일한다.\n\
    - 메시지: \"사이드 프로젝트의 가치는 포트폴리오가 아니라, 본업에서 맡을 수 있는 일의 범위가 넓어지는 것.\""
- anchor: reference/linkedin-100days-series#0-B.-링크드인-문법-(초안-렌더링-규칙,-개요와-별개)
  doc: reference/linkedin-100days-series.md
  text: '## 0-B. 링크드인 문법 (초안 렌더링 규칙, 개요와 별개)


    이 문서의 편별 섹션은 소재 맵이지 글의 구조가 아님. 초안으로 옮길 때 아래 규칙 적용. (1편 초안 1차본이 "블로그 같다"는 피드백에서
    도출)


    1. **한 포스트 = 한 메시지.** 편별 서사 항목을 전부 넣지 않는다. 그 편의 핵심 문장 하나를 정하고, 나머지 소재는 그 문장을 미는
    데 쓰거나 버린다. 버린 소재는 댓글, 다음 편, 번외로.

    2. **분량 1,000~1,500자.** 3,000자 한도를 채우지 않는다. 길이가 남으면 정보를 더 넣지 말고 문장을 벼린다.

    3. **훅 2줄 승부.** 접힘(더보기) 전에 보이는 1~2문장이 전부라고 생각하고 쓴다. 배경 설명으로 시작 금지.

    4. **문장 단위 줄바꿈, 문단은 1~3문장.** 소제목, 번호 리스트, 표 금지 (숫자 나열이 꼭 필요하면 3줄 이내).

    5. **숫자는 편당 3개만.** 나머지 수치는 캡처 이미지가 말하게 한다.

    6. **정보 밀도는 앞에 몰고 뒤는 가볍게.** 기승전결 완결형(블로그)이 아니라, 훅 -> 전개 -> 여운 구조.

    7. **각 편은 독립적으로 성립.** "지난 편에서 말했듯"으로 시작하지 않는다. 시리즈 연결은 마지막 1~2줄로만.

    8. **말 걸며 끝내기.** 다음 편 예고보다, 독자가 반응할 수 있는 문장(질문 또는 여운)으로 마무리. 예고는 그 뒤 한 줄.

    9. 긴 버전(기승전결 완결형)은 버리지 말고 브런치/블로그 크로스포스팅용으로 보관. 링크드인 본문 마지막이나 첫 댓글에서 블로그로 유도하는
    구조도 가능.'
- anchor: reference/linkedin-100days-series#0-C.-타임라인-앵커-(검증된-숫자만)
  doc: reference/linkedin-100days-series.md
  text: '## 0-C. 타임라인 앵커 (검증된 숫자만)


    | 앵커                                     | 날짜                              | 근거                                                              |

    | ---------------------------------------- | ---------------------------------
    | ----------------------------------------------------------------- |

    | 레포 시작 (전체 코드 첫 커밋)            | 2026-03-14                        | `git log
    --reverse`                                               |

    | Play 스토어 제출 (개인정보처리방침 커밋) | 2026-03-18                        | 커밋 "docs: 개인정보처리방침
    웹 페이지 추가 (Play 스토어 제출용)" |

    | 테스터 모집·심사 대기 공백               | 4/8~4/18 (10일) + 4/21~4/27 (6일) | 커밋 공백 실측.
    Google Play 비공개 테스트 의무 14일과 겹침        |

    | 스토어 정식 출시                         | 2026-04-28                        | `api/landing.ts:25`
    D+ 카운터 기준일 (코드가 증언)                |

    | 코드 프리즈 목표                         | 2026-07-24 = D+87                 | 이번 주
    마감                                                      |

    | D+100                                    | 2026-08-06                        |
    마지막 편 발행일. 랜딩 D+ 카운터가 그날 100 표시 (독자 검증 가능) |


    핵심 스탯 (연재 전체에서 재사용):


    - 총 기간 126일(3/14~7/17 기준), 커밋 활동일 56일, 커밋 639개, 머지 PR 142개

    - 마이그레이션 146개, 테이블 21개 전부 RLS ON

    - 라이브 서비스: 유저 약 90명, 동호회 56개 (프리런치 아님, 실사용 중)

    - 1인, 풀스택 (Expo RN 멀티플랫폼 + Supabase + Vercel), 실행은 AI (Claude Code)


    발행 캘린더 (주 2회, D+100 피날레 역산):


    | 편  | 발행일    | 비고                                                |

    | --- | --------- | --------------------------------------------------- |

    | 1편 | 7/23 (목) |                                                     |

    | 2편 | 7/27 (월) |                                                     |

    | 3편 | 7/30 (목) |                                                     |

    | 4편 | 8/3 (월)  |                                                     |

    | 5편 | 8/6 (목)  | D+100 당일. 랜딩 카운터 스크린샷은 당일 아침에 캡처 |


    연재 전 결정 필요 (4편 발행 전까지):


    - [ ] 봇 비공개 운영(DECISIONS 0010) 상태에서 봇 운영기를 공개하는 문제. 옵션 (a) 연재 전 서비스 내 봇 존재 공지,
    (b) 판별 가능한 디테일(페르소나 수, 발행 시간대 분포, 말투 규칙) 삭제 후 발행. 글감보다 서비스 신뢰가 우선.

    - [ ] 스크린샷에 실유저 닉네임/프로필 노출 여부 전수 확인 (블러 처리)


    ---'
- anchor: reference/linkedin-100days-series#1편.-"운영자-없는-동호회"라는-낭만,-그리고-5일-만의-스토어-제출
  doc: reference/linkedin-100days-series.md
  text: '## 1편. "운영자 없는 동호회"라는 낭만, 그리고 5일 만의 스토어 제출


    개요 편 아님. 비전 + 저자 정체성 + 방법론 선언을 한 편에. 속도 수치는 자랑이 아니라 "설계가 머리에 있으면 실행은 이만큼 빨라진다"의
    증거로 쓴다.


    **훅 문장 후보**


    - "혼자서 전부 하면, 어디까지 갈 수 있을까. 늘 궁금했다."

    - "몇 번의 창업을 거치며 기획도 개발도 마케팅도 조금씩 다 만져봤다. 문제는 그 지식이 전부 흩어져 있었다는 것이다."

    - "이건 사업이 아니라 공부였다. 흩어진 지식을 하나의 파이프라인으로 연결하는 100일짜리 공부."


    **서사 (동기 -> 소재 -> 방법 -> 증거 -> 단서)**


    1. 개인 동기 (진짜 이유): "혼자 한다면 어디까지?"라는 궁금증 + 수번의 창업으로 흩어진 분야별 지식 + 그 사이 경계선에 대한 막연한
    두려움. 이걸 한 파이프라인으로 연결하고 최적화하는 것이 목표. 이건 사업이 아니라 나의 공부.

    2. AI 동기 (같은 결): AI를 어디까지 활용할 수 있는지도 직접 확인하고 싶었다. "잘" 쓴다는 게 뭔지는 끝까지 써본 사람만 안다.
    그래서 타이핑은 AI(Claude Code)에게, 설계와 결정은 나에게로 역할을 갈랐다.

    3. 소재 선택: 공부가 목적이니 도메인 리스크는 0으로. 제일 잘 아는 배구 동호회. 실제로 다니며 본 문제(운영의 짐이 소수에게 몰리고,
    총무가 지치면 모임이 죽는다)에 "운영자 없이 자동으로 돌아가는 동호회, 멋지지 않나?"라는 비전을 걸었다. 이 비전이 공부 범위를 운영/자동화까지
    밀어붙이는 장치.

    4. 방법론 선언 (이 시리즈의 차별점): **시작 전에 DB부터 그렸다.** 동호회, 멤버, 경기, 요청이라는 도메인 모델과 권한 구조(앱
    역할 vs 동호회 역할 분리, 모든 테이블 RLS)를 머리에 넣고 시작. 화면은 바뀌어도 데이터 구조는 안 바꾸는 것이 목표. 실제로 100일간
    21개 테이블의 골격은 유지됨 (마이그레이션 146개는 대부분 추가와 정책이지 구조 재설계가 아님).

    5. 증거로서의 속도: 3/14 레포 시작, 3/18 스토어 제출 (5일), 4/28 정식 출시 (45일). 3월에만 커밋 45개로 인증·지도·장소검색·밴/탈퇴까지.
    속도의 원인 분해: 도메인을 앎(실사용자) + 검증된 스택 고정(Expo+Supabase) + 설계 선행으로 재작업 최소화.

    6. 요구사항 장면 #1: 초기 백로그는 기획서가 아니라 코트에서 나옴. "이건 내가 매주 겪는 불편"이라는 확신이 스펙 논쟁을 대체.

    7. 클리프행어: "그래도 청구서는 왔다. 다만 내가 예상한 곳(아키텍처)이 아니라 다른 곳(규율)으로 왔다. 다음 편."


    **인용 수치**: 5일(제출), 45일(출시), 3월 커밋 45개, 테이블 21개 전부 RLS, 마이그레이션 146개(현재), 유저 ~90명/동호회
    56개(현재)


    **소스**: initial commit f5db6af, 3/18 privacy 커밋, PR #1~#2, `api/landing.ts:25`,
    CLAUDE.md의 역할 구조(app_role vs club_members.role)


    **캡처 목록**


    - [ ] DB 스키마/ERD 다이어그램 (Supabase Studio 스키마 뷰 또는 직접 그린 도메인 모델. "DB부터 그렸다"의 실물)

    - [ ] `git log --reverse --oneline | head` 터미널 (3/14 첫 커밋)

    - [ ] Play Console 앱 등록일 화면

    - [ ] 현재 앱 홈 화면 (최종 모습을 미리: before/after의 after)

    - [ ] 랜딩 페이지 D+ 카운터


    **업무 적용 교훈**: AI 시대 PM의 병목은 실행이 아니라 결정. 데이터 모델과 권한 구조를 먼저 고정하면, 나머지 결정의 절반은 자동으로
    내려진다.


    ---'
- anchor: reference/linkedin-100days-series#2편.-아키텍처는-버텼다,-무너진-건-규율이었다-(3번의-리팩토링)
  doc: reference/linkedin-100days-series.md
  text: "## 2편. 아키텍처는 버텼다, 무너진 건 규율이었다 (3번의 리팩토링)\n\n시리즈의 논지를 증명하는 편. \"설계를 잡고 시작했다\"\
    는 1편의 주장을 사후 감사 문서가 검증한다. 동시에 설계만으로 안 되는 것(강제, 관측성)을 정직하게 보여준다.\n\n**훅 문장 후보**\n\
    \n- \"출시 한 달 뒤, 내 코드를 감사했다. 아키텍처는 멀쩡했다. 대신 테스트 커버리지 1.1%, API 경계에 any 67개, 마이그레이션의\
    \ 18%가 fix. 무너진 건 구조가 아니라 규율이었다.\"\n- \"AI는 컨벤션을 '이해'한다. 그리고 바쁘면 어긴다. 사람 주니어와\
    \ 똑같다. 차이는, AI에게는 게이트가 통한다는 것.\"\n\n**서사**\n\n1. 실패 장면: 5/30 자체 감사. 기능은 도는데 회귀가\
    \ 반복되고 같은 버그가 다른 화면에서 재발.\n2. 진단의 반전 (이 편의 축): 감사 문서의 실제 문장이 \"구조(아키텍처 선언)는 좋다.\
    \ 강제(enforcement)와 관측성이 없다. 큰 재설계 불필요.\" 쿼리 키 팩토리 하드코딩 0, 라우팅 as any 0. 즉 1편의\
    \ 설계 선행이 실제로 버팀. 문제는 선언과 강제의 간극.\n3. 3번의 리팩토링 물결 (PR 번호로 실증):\n   - 1차 5/18 (#5~#12):\
    \ 안정화 + 모달/테마 공용화. 증상 대응.\n   - 2차 5/30~6/2 (#26~#54): Phase 1~7 체계전. 전역 에러 통로(#27)\
    \ -> CI 타입/lint 강제 게이트(#32) -> E2E 안전망+백엔드 하드닝(#33) -> 폼 통합(#41, #53) -> 리스트/맵\
    \ 공통 추출(#43, #44).\n   - 3차 7/2 (#77): 캐시 반영지연 + 아키텍처 정리. 이때부터 DECISIONS.md 체제.\n\
    4. 최종 작업 방식 (부제 \"기획과 아키텍처 설계를 동시에\"의 실체): 모든 작업은 계획 문서 선행. 실측 -> Definition of\
    \ Done -> 설계 트레이드오프와 기각한 대안 -> 검증 방법. 완료 문서 55개. 결정은 DECISIONS.md에 append-only\
    \ (결정/왜/기각 대안 5줄, 뒤집으면 지우지 않고 \"NNNN로 대체\" 표시). PM의 기획 문서와 개발자의 설계 문서가 한 문서인 것이\
    \ 1인 개발의 이점이 아니라 **방법론**임을 강조.\n5. 요구사항 장면 #2: DECISIONS 0004 -> 0005. 게스트를 메시지\
    \ 기반으로 유지하기로 결정한 그날, 클럽 금고를 기획하다 게스트비 수금 요구를 발견하고 결정을 뒤집음. 번복을 지우지 않고 로그로 남긴 것이\
    \ 이후 결정 속도를 올림.\n6. 배움: AI에게 컨벤션을 말로 시키면 안 지켜진다. pre-commit 타입체크 + CI + lint 경고\
    \ 총량 동결(88개, ratchet로 감소만 허용)처럼 기계가 거부하게 만들어야 지켜진다. 규율은 사람이 아니라 게이트가 지킨다.\n\n\
    **인용 수치**: 커버리지 1.1% (35,794줄 중 403줄), `: any` 51 + `as any` 16, 마이그레이션 18%가 fix류,\
    \ Sentry 캡처 5곳뿐, SECURITY DEFINER 134개 권한 체크 제각각, lint 경고 88 동결, 완료 계획 문서 55개\n\
    \n**소스**: planning/작업완료/00-architecture-stabilization-plan.md, 02-phase2-enforcement-gates.md,\
    \ DECISIONS.md (0004/0005 포함), `.husky/pre-commit`, `package.json`의 `--max-warnings\
    \ 88`\n\n**캡처 목록**\n\n- [ ] 00 문서의 진단 섹션 (\"구조는 좋다, 강제가 없다\" 문장 + 구조적 구멍 5개)\n\
    - [ ] DECISIONS.md 0004 -> 0005 번복 기록 (요구사항 발견 서사와 겸용)\n- [ ] pre-commit에 커밋이\
    \ 거부되는 터미널 장면 (타입 에러 하나 일부러 만들어 재현)\n- [ ] planning/작업완료/ 폴더 파일 목록 (55개)\n\n**업무\
    \ 적용 교훈**: 이 문서 체계(계획 문서 + append-only 결정 로그 + ratchet 게이트)는 회사 조직에 그대로 이식 가능.\
    \ AI 협업의 핵심은 프롬프트가 아니라 거부 장치.\n\n---"
- anchor: reference/linkedin-100days-series#3편.-3번의-리브랜딩-(토큰-없이-시작한-대가,-시스템으로-갚다)
  doc: reference/linkedin-100days-series.md
  text: "## 3편. 3번의 리브랜딩 (토큰 없이 시작한 대가, 시스템으로 갚다)\n\n\"예쁘게 3번 바꿈\"이 아니라 \"1, 2차는 하드코딩\
    \ 색을 손으로 바꿨고, 3차 전에 토큰을 깔았더니 리브랜딩이 값 교체가 됐다\"는 서사. 2편(코드 규율)의 디자인 버전임을 명시해 시리즈\
    \ 논지를 반복.\n\n**훅 문장 후보**\n\n- \"같은 앱의 색을 세 번 갈아엎었다. 첫 두 번은 고행이었고 세 번째는 반나절이었다.\
    \ 차이는 디자인 실력이 아니라 아키텍처였다.\"\n\n**서사**\n\n1. v1 (5/18, #6~#11): 디자인 시스템이라 부르던 것.\
    \ Pretendard 도입(#9), 색 팔레트 정리(#8). 하지만 화면 곳곳에 하드코딩 색상 잔존.\n2. v2 (5/31, #38):\
    \ 토큰/시맨틱 불일치 6건 해소. 여전히 토큰과 실제 화면이 따로 노는 상태의 땜질.\n3. VOLT (7/2~7/6, #82~#98):\
    \ 순서를 뒤집음. 리브랜딩 전에 primitives 토큰 치환(#82)부터. 그 다음 본편(#83). 결과: 전역 하드코딩 색상 0 (검증\
    \ 경로 26개), 이후 색 변경은 토큰 값 교체.\n   - 디테일 소재: \"3D 배구공 로고 폐기\" 커밋(76df7c4), 실기기 피드백\
    \ 즉일 반영(#90, #91), 로그인 네온 별똥별(#88)\n4. 요구사항 장면 #3: 실기기에서 본 유저 피드백(아이콘 여백, 뱃지 정렬)이\
    \ 당일 PR로. 출시 후 요구사항의 원천이 \"내 경험\"에서 \"유저 90명의 실사용\"으로 이동.\n5. 양념 인시던트 (6/4): 카카오맵\
    \ prod 키 누락으로 프로덕션 빌드 지도 먹통. EXPO_PUBLIC 환경변수는 빌드 시점에 인라인된다는 것을 사고로 배움 -> 빌드 가드\
    \ + OTA 경계 분리로 재발 방지 (planning/25).\n6. 배움: 브랜드는 바뀐다는 전제로 시스템을 먼저. \"디자인 시스템\"\
    은 Figma가 아니라 코드에서 하드코딩이 0일 때 존재한다.\n\n**인용 수치**: 리브랜딩 3회 (5/18, 5/31, 7/5), 하드코딩\
    \ 0 / 검증 경로 26개, VOLT 스윕 QA (유닛 168 + e2e 20 통과)\n\n**소스**: planning/작업완료/14,\
    \ 36, 38(+38A~E 플레이북 5분할), 25(카카오 사고), PR #6~#11, #38, #82~#98\n\n**캡처 목록**\n\n\
    - [ ] 홈 화면 3버전 비교 (v1/v2/VOLT). 구버전은 git checkout으로 재현하거나 당시 스토어 스크린샷 사용\n- [\
    \ ] 폐기된 3D 배구공 로고 vs 최종 VOLT 로고\n- [ ] 토큰 파일 diff (색 값 몇 줄 교체로 전체가 바뀌는 장면)\n-\
    \ [ ] 카카오맵 먹통 화면 (재현 가능하면)\n\n**업무 적용 교훈**: 리팩토링과 같은 결론의 디자인 버전. 반복될 변경은 시스템으로\
    \ 흡수하고, 1회성 변경만 손으로.\n\n---"
- anchor: reference/linkedin-100days-series#4편.-90명뿐인-커뮤니티에-봇을-풀었다-(페르소나에서-콘텐츠로)
  doc: reference/linkedin-100days-series.md
  text: '## 4편. 90명뿐인 커뮤니티에 봇을 풀었다 (페르소나에서 콘텐츠로)


    7/13~7/17 닷새에 PR 25개가 몰린 구간. 피벗이 PR 타이틀 순서로 재현됨. 1편의 "탈중앙화 비전"이 처음으로 제품 형태를 갖추는
    편이기도 함 (운영자 역할을 봇이 흡수하기 시작).


    **훅 문장 후보**


    - "유저 90명. 커뮤니티를 열면 빈 게시판이 된다. 빈 게시판은 없느니만 못하다."

    - "봇에게 인격을 줬다. 그런데 사람들이 원한 건 인격이 아니라 콘텐츠였다."


    **서사**


    1. 문제 정의: 콜드스타트. 약 90명 규모에서 커뮤니티 오픈 = 빈 게시판 = 역효과 (45C 문서 첫 줄의 실제 진단). 그리고 이것은
    비전의 시험대: 운영자 없이 돌아가려면 "초기 활성화"라는 운영 업무부터 자동화되어야 한다.

    2. 1차 결정과 번복 (정직 포인트): 처음엔 "공개 페르소나 (AI 배지 명시)"로 결정(DECISIONS 0009). 같은 주에 비공개
    가명 운영으로 뒤집음(0010). 번복을 지우지 않고 로그로 남긴 것 자체가 소재.

    3. 1차 구현 (7/15, #117~#124): 대본형 봇. 디렉터 LLM이 하루치 "대화 장면"을 한 호출로 통째로 집필 (글 3~5개
    + 답글 0~3개), 발행 시각은 LLM이 아니라 코드 난수가 결정 (매일 같은 시각 발행 = 봇 티 방지). 페르소나 8~12명.

    4. 피벗 (7/16, #131): 대본은 살아있지 않다. "사람이 모여야 하는 커뮤니티인데 사람이 쓸까?"라는 질문을 계속 굴린 끝에, 사람들이
    쓰게 만드는 건 결국 양질의 콘텐츠라는 결론 -> 콘텐츠봇 (배구 뉴스/꿀팁을 페르소나가 자기 관점으로 소화). 동시에 모더레이션 (#132,
    하드 룰 자동 숨김 + 검토 큐).

    5. 2차 피벗 (7/17, #141): 살아있는 페르소나. 대본 예약이 아니라 이벤트 큐 (사람 글/댓글 INSERT -> 큐 적재 ->
    봇이 맥락 읽고 반응). 봇끼리의 대화도 창발.

    6. 안전장치 소재 (설계 역량의 증거): 킬 스위치 1개로 전체 정지, 글당 봇 댓글 최대 1개, 사람 재답글에 봇 재응답 금지, 사람 활동량에
    반비례해 봇 발화량 자동 감소. "봇이 사람을 밀어내지 않게 하는 상한"을 스키마 레벨에서 강제.

    7. 배움: "사람이 모일까"라는 질문의 답은 기술(페르소나 정교화)이 아니라 가치(콘텐츠 퀄리티)였다.


    **인용 수치**: 유저 ~90명, 닷새간 PR 25개(#113~#141), 페르소나 8~12명, 글당 봇 댓글 상한 1개


    **소스**: planning/작업완료/45B, 45C, planning/49(운영 런북), 51, 53, DECISIONS 0009/0010,
    PR #113, #117~#124, #131, #132, #141


    **캡처 목록** (비공개 운영 결정에 따라 범위 조정. 상단 체크리스트 참조)


    - [ ] 커뮤니티 피드 (실유저 닉네임 블러)

    - [ ] 봇 콘솔 (타임라인/킬 스위치)

    - [ ] DECISIONS 0009 -> 0010 번복 기록

    - [ ] 디렉터가 집필한 장면 하나 (글 + 답글이 실제로 응답하는 예)


    **업무 적용 교훈**: 결정 번복은 비용이 아니라 데이터. 번복 기록을 남기면 다음 결정이 빨라진다.


    ---'
- anchor: reference/linkedin-100days-series#5편.-D+100,-낭만이-크론-테이블이-됐다-(발행일-8/6)
  doc: reference/linkedin-100days-series.md
  text: "## 5편. D+100, 낭만이 크론 테이블이 됐다 (발행일 8/6)\n\nD+100 당일 발행. 1편 오프닝 문장을 그대로 다시\
    \ 불러와 회수하는 수미상관 구조. \"코드는 D+87에 멈췄다. 오늘은 D+100인데 서비스는 돌고 있다.\"\n\n**훅 문장 후보**\n\
    \n- \"100일 전, '운영자 없이 돌아가는 동호회'는 낭만이었다. 오늘 그것은 크론 테이블 몇 줄과 이벤트 큐 하나다.\"\n- \"\
    13일 전에 마지막 커밋을 했다. 그 뒤로 서비스는 혼자 돌았다. 오늘이 100일째다.\"\n- \"이 프로젝트에서 내가 얻은 가장 큰 것은\
    \ 앱이 아니다. 두려워서 선을 그어 뒀던 풀스택 한 사이클을 완주한 경험, 그리고 그걸 다음 주 월요일 회사 업무에 바로 쓸 수 있었다는\
    \ 것이다.\"\n\n**서사**\n\n1. 비전 회수: 1편의 문장 재인용. 자동화/탈중앙화는 기능이 아니라 시작할 때부터의 설계 목표였고,\
    \ 그래서 아키텍처가 그 방향으로 수렴할 수 있었다 (초대 링크로 셀프 가입, 승인 생명주기, 봇이 흡수한 운영 업무, 알림 파이프라인).\n\
    2. 목표 재정의: 완전 자동화 = 사람이 0이 아니라, 사람 없이도 안 죽고 + 사람이 있으면 더 좋아지는 구조. 내 일과는 하루 한 번\
    \ 딸깍, 혹은 그 이하.\n3. 킬러 아키텍처, 키 0: prod에 LLM API 키가 없다. DB 파이프라인(트리거 -> 이벤트 큐 ->\
    \ 크론 발행)은 키 없이 완전 자율. LLM 두뇌만 로컬 Claude Code 구독(/bot-tick)이 하루 1회 소비. LLM 운영비\
    \ 0원 (구독료 안에서). DB 중심 사고의 종착점: 지능은 갈아끼울 수 있게 바깥에, 상태와 안전장치는 전부 스키마에.\n4. 자동화 목록:\
    \ 발행 크론(5분), 좋아요 봇, 릴리즈 헬스체크(#62, share-link 자동 검증), dependabot, CI 게이트.\n5. 정직\
    \ 포인트, 자동화의 경계: 일부러 수동으로 남긴 것들. prod DB 마이그레이션과 Edge Function 배포는 손으로 (사고 반경 때문),\
    \ EAS 빌드도 사람이 누름. \"전부 자동화\"가 아니라 \"무엇을 수동으로 남길지 결정\"이 진짜 설계.\n6. 양념 인시던트: 푸시\
    \ 채널 롤아웃 순서 사고 (#127, #128). 서버를 먼저 바꾸면 구버전 클라이언트의 푸시가 조용히 드롭. 클라 선배포 후 서버 전환으로\
    \ 교정. 자동화는 순서가 전부라는 교훈.\n7. 성장 아크 회수 (시리즈의 진짜 결말): 1편의 고백(\"풀스택이 두려웠다\")을 다시 불러온다.\
    \ 100일간 요구사항 -> 기획 -> 아키텍처/DB 설계 -> 프론트 -> 백엔드 -> 구현/배포의 **한 사이클을 혼자 완주**했고, 두려움의\
    \ 정체는 능력이 아니라 사이클을 끝까지 돌아본 경험의 부재였음을 확인.\n8. 그리고 회사로 (독자가 가져갈 실용 결론):\n   - 백엔드를\
    \ 이해하게 된 상태로 회사의 audit, builder 앱 프론트 개발을 맡아 즉시 적용. 데이터 구조를 아는 사람의 프론트 개발은 API\
    \ 협의 왕복이 줄어든다.\n   - 기획/정책 문서를 이 사이클(요구사항 출처 -> 데이터 모델 영향 -> 검증 방법)이 담긴 형식으로 전환.\n\
    \   - 노션과 피그마를 버리고 기획 문서를 전부 GitHub으로 옮기자고 제안. 위볼리의 planning/ + DECISIONS.md 체제를\
    \ 회사에 이식. 문서와 코드가 같은 repo에 있어야 리뷰도, AI 협업도 같은 컨텍스트에서 돈다.\n9. 마무리: 100일 회고 총계 (커밋\
    \ 639+, PR 142+, 마이그레이션 146+, 활동일 56일) + 관통 메시지 회수. \"바이브코딩으로 어디까지? 설계를 아는 사람이라면,\
    \ 라이브 서비스와 그것을 혼자 유지할 수 있는 구조까지. 그리고 사이드 프로젝트의 진짜 보상은 서비스가 아니라, 본업에서 맡을 수 있는 일의\
    \ 범위가 넓어진 나였다.\"\n\n**인용 수치**: 코드 프리즈 D+87 (7/24), 발행일 D+100 (8/6), 무인 기간 13일,\
    \ LLM API 비용 0원, 발행 크론 5분 간격\n\n**소스**: PR #141 (이벤트 큐 + /bot-tick, 키 0), #62\
    \ (릴리즈 자동화), #127/#128 (푸시 채널 사고), planning/49 런북, planning/51 §1 아키텍처 다이어그램\n\
    \n**캡처 목록**\n\n- [ ] 8/6 당일 랜딩 D+ 카운터 100 (아침에 캡처)\n- [ ] git log 마지막 커밋 날짜가 7/24인\
    \ 터미널\n- [ ] /bot-tick 실행 리포트 한 장면\n- [ ] planning/51의 아키텍처 다이어그램 (키 0 구조)\n\n\
    **업무 적용 교훈**: 자동화 설계의 질문은 \"얼마나 자동화했나\"가 아니라 \"무엇을 왜 수동으로 남겼나\".\n\n---"
- anchor: reference/linkedin-100days-series#부록.-편별로-안-쓴-예비-소재
  doc: reference/linkedin-100days-series.md
  text: '## 부록. 편별로 안 쓴 예비 소재


    - 채팅 실시간 유령 구독 사고 3부작 (#22 룸 채널 churn, #39 포그라운드 회복, #99 zombie 복원력): 실시간 기능의
    난이도 소재. 2편이나 별도 번외 편.

    - FlashList 웹 갭 버그 연쇄 (#18, #20~#23): RN 멀티플랫폼의 함정 소재.

    - 이미지 픽커 행 복구 (#139, planning/50): OS 레벨 버그를 워치독으로 우회한 이야기.

    - 게스트 신청 플로우 (#142): 마지막 기능. "출시 후에도 도메인 결정은 계속 뒤집힌다"(DECISIONS 0004 -> 0005)
    소재. 2편에서 요구사항 장면으로 쓰면 여기선 생략.

    - 연재 반응 좋으면 번외: "AI와 일하는 방식" 편 (CLAUDE.md, 스킬, 서브에이전트, plan-doc 워크플로 공개). 포지셔닝상
    본편보다 이 번외가 더 터질 가능성도 있음.'
