- anchor: reference/bot-ops-runbook#3-3.-터미널-승인-(psql,-로컬용---시프트-문장-필수)
  doc: reference/49-bot-ops-runbook.md
  text: "### 3-3. 터미널 승인 (psql, 로컬용 - 시프트 문장 필수)\n\n승인 RPC(`admin_approve_bot_run`)는\
    \ `auth.uid()` 기반 super_admin 가드라 psql superuser로는 호출 불가. 직접 UPDATE로 승인하되, **RPC와\
    \ 동일한 시프트 문장을 반드시 먼저** 실행한다 - 빼먹으면 지난 시각 예약이 다음 발행기 틱에 한꺼번에 발행돼 도배된다(00128 로직\
    \ 복제):\n\n```sql\n-- psql \"postgresql://postgres:postgres@127.0.0.1:54322/postgres\"\
    \nBEGIN;\nUPDATE community_bot_schedule SET scheduled_at = scheduled_at + interval\
    \ '1 day'\n WHERE status = 'awaiting_approval' AND run_id = '<RUN_ID>'\n   AND\
    \ scheduled_at <= now() + interval '5 minutes';\nUPDATE community_bot_schedule\
    \ SET status = 'pending'\n WHERE status = 'awaiting_approval' AND run_id = '<RUN_ID>';\n\
    COMMIT;\n```\n\n취소는 `SET status='cancelled'` (pending·awaiting_approval 대상만)."
