    text: '`guest_requests` 테이블 신설 — 기존 3개 요청 테이블처럼 도메인별 테이블 유지(범용 requests 통합은 FK·RLS
      희생으로 기각)'
  wevolley#sc-home-state-branching:
  - key: quote
    text: 홈 상단 구성은 무소속/멤버/관리자 상태별로 다르게 렌더한다 — 모두에게 같은 CTA를 주는 전역 요소(퀵액션 그리드, 등록 버튼)는
      두지 않는다.
  wevolley#sc-http-refetch-owns-consistency:
  - key: quote
    text: 어느 쪽이든 재구독·focus 시 HTTP refetch가 정합성을 소유
  wevolley#sc-immutable-ledger:
  - key: quote
    text: confirmed 취소는 void+재발행(수정 불가 원장)
  wevolley#sc-impersonation-rejected:
  - key: quote
    text: C는 과욕 (테스트 계정이 대체재).
  wevolley#sc-is-anonymous-dropped:
  - key: quote
    text: '**is_anonymous/"익명의 배구인"은 도입 안 함**(사용자 결정)'
  wevolley#sc-is-bot-never-exposed:
  - key: quote
    text: '`is_bot`은 어떤 공개 뷰/API에도 미노출(유출 = 즉시 판별)'
  wevolley#sc-launchd-plist-restale:
  - key: quote
    text: plist는 `bot-auto.sh on` 시점의 문자열이 박제되므로 스크립트만 고치면 기존 가동분은 계속 `/bot-tick`을
      부른다
  wevolley#sc-lib-api-on-demand:
  - key: quote
    text: '여러 곳 재사용 또는 복잡 조인만 lib/api로 승격. 이유: 훅 안 쿼리는 이미 qk·에러 분류 규율 안에 있고, 추상화는
      재사용 시점에 사는 게 싸다.'
  wevolley#sc-liker-cron-stays:
  - key: quote
    text: 로직을 스킬로 옮기면 딸깍 누락 = 좋아요 정지가 되므로 기각.
  wevolley#sc-modal-three-tier:
  - key: quote
    text: '3계층: 순수 액션 메뉴 = CenterMenuModal(카카오톡식, 아이콘 없는 텍스트 행), 제목+본문+푸터 정형 = AppModal(기존,
      커뮤 첫 진입이 기준 시각), 자유 콘텐츠(폼·픽커·목록) = CenterModal'
  wevolley#sc-mode-indicator-pill:
  - key: quote
    text: '**결정: C (좌하단 pill, "👁 일반 회원 모드 · 끄기").**'
  wevolley#sc-nickname-app-wide-unique:
  - key: quote
    text: 앱 정책을 **"닉네임은 유일"** 하나로 통일(사용자 결정).
  wevolley#sc-nickname-numeric-suffix:
  - key: quote
    text: 자동 파생 닉네임에 결정적 숫자 접미 2자리(`든든한리베로07` — 풀 120→12,000, 첫 진입 원탭이 UNIQUE에 안 막힘)
  wevolley#sc-no-direct-supabase-in-view:
  - key: quote
    text: 쿼리·뮤테이션은 `lib/hooks/{domain}/`에. 예외는 auth 플로우
  wevolley#sc-no-money-through-app:
  - key: quote
    text: '- **송금/결제 대행**: 돈은 앱을 거치지 않는다. 앱은 장부·독촉·투명성만.'
  wevolley#sc-nonblocking-heuristic-gate:
  - key: quote
    text: 차단 승격 안 함 — ±6줄 휴리스틱이라 거짓양성이 구조적으로 가능, 판정이 비결정적인 가드는 차단 부적합.
  wevolley#sc-notify-single-entry-precondition:
  - key: quote
    text: '**notify() 단일 진입점(P1-1)을 이 기능 첫 마이그레이션 전에 선행**'
  wevolley#sc-one-pass-writing-root-cause:
  - key: quote
    text: 2. **품질 문제의 구조적 원인은 "한 패스 집필"이다.**
  wevolley#sc-open-banking-rejected:
  - key: quote
    text: '- **은행 계좌 연동 전면**: 마이데이터(허가제, 자본금 5억) 기각.'
  wevolley#sc-persist-denylist:
  - key: quote
    text: persist 정책을 allowlist(10개 opt-in)→**denylist**로 반전.
  wevolley#sc-picker-watchdog:
  - key: quote
    text: 대응은 **픽 호출 컨텍스트 안의 워치독 래퍼**
  wevolley#sc-publish-time-by-code-random:
  - key: quote
    text: 발행 시각은 **LLM 아닌 코드 난수**(가중 시간창 + 분 단위 지터, `created_at := scheduled_at` —
      크론 틱·라운드 시각 패턴 유출 차단)
  wevolley#sc-push-fallback-fail-open:
  - key: quote
    text: '**푸시 함수(00095)는 ELSE 폴백이 실명이라 fail-open** → CHECK 확장·RPC 파라미터화·푸시 분기를 한
      마이그레이션에서 원자 처리.'
  wevolley#sc-realtime-hybrid:
  - key: quote
    text: 전역 상시 구독은 3개 이하(미읽음·채팅 inbox·user 세션 채널), 상세 화면은 진입 시 구독·이탈 시 해제.
  wevolley#sc-research-critique-pipeline:
  - key: quote
    text: '**기본 = 리서치 서브에이전트(팩트팩) → 집필 → 비평 서브에이전트(팩트 대조·무정보 리젝) 3단**'
  wevolley#sc-route-guard-default-deny:
  - key: quote
    text: ① RouteGuard는 **비로그인 허용 경로 화이트리스트(기본 거부)** — 새 화면은 자동으로 로그인 필요.
  wevolley#sc-script-orchestrator:
  - key: quote
    text: '아키텍처는 **대본 오케스트레이터**: 디렉터 1회/일이 글+답글을 한 LLM 호출'
  wevolley#sc-search-client-gate:
  - key: quote
    text: 클라 게이트는 **디바운스 300ms + 최소 2글자**(trigram이 2글자 이하 패턴을 인덱스 못 탐
  wevolley#sc-self-report-adoption-risk:
  - key: quote
    text: 멤버가 셀프 신고를 안 함 (**최대 가정**)
  wevolley#sc-share-deploy-order:
  - key: quote
    text: '**배포 순서 강제**: PR A(웹 게이트 완화 + AppOpenBanner) → PR B(share-page body 제거
      + redirect) — 역순이면 redirect 목적지가 서빙 안 돼 루프.'
  wevolley#sc-share-og-canonical-split:
  - key: quote
    text: '**URL이 아니라 그 URL이 보여주는 것을 바꾼다**'
  wevolley#sc-skeleton-render-contract:
  - key: quote
    text: 렌더 계약은 `!data && isLoading`에만 스켈레톤(콜드), 백그라운드 fetch엔 이전 데이터 유지로 성문화.
  wevolley#sc-skill-per-publish-format:
  - key: quote
    text: 역할 혼재 스킬 2개(bot-tick=반응+잡담, bot-content=cards+article 자동 판단)를 **발행 형태 기준
      4개로 분리**
  wevolley#sc-treasury-ledger:
  - key: quote
    text: '**한 줄 정의**: 은행 연동 없이 동호회의 회비 수금·지출·투명성 보고를 대체하는 장부.'
  wevolley#sc-treasury-must-replace-excel:
  - key: quote
    text: '**핵심 판단: v1이 엑셀을 완전히 대체하지 못하면 만들 가치가 없다.**'
  wevolley#sc-treasury-open-question-visibility:
  - key: quote
    text: '1. **[결정 대기 — 운영자]** 미납 공개 범위 기본값: 본인+운영진(권장) vs 전체 공개. 두 차례 논의 미결.'
  wevolley#sc-treasury-semi-auto:
  - key: quote
    text: 자동화되는 것은 **청구 생성과 독촉**이고, 입금 확인은 셀프 신고 + 총무 승인의 반자동.
  wevolley#sc-treasury-three-principles:
  - key: quote
    text: '설계 원칙: **입력을 멤버에게 분산**(셀프 신고), **매칭을 상류에서 제거**(지정 입금자명), **독촉을 시스템에 외주**(자동
      리마인드). 이 3개가 은행 연동 없이 성립하는 이유.'
  wevolley#sc-treasury-write-role:
  - key: quote
    text: 회계 쓰기 권한 = `club_members.role = admin` (별도 '총무' 역할 신설 안 함
  wevolley#sc-trigram-search:
  - key: quote
    text: '기각: FTS/tsvector(Postgres에 한국어 형태소 분석기 없음 — "배구를"≠"배구", Supabase 관리형에 mecab
      불가)'
  wevolley#sc-two-admin-lineages:
  - key: quote
    text: '**관리자 UI는 두 계통인데 v1은 한 계통만 내렸다:**'
  wevolley#sc-view-as-member:
  - key: quote
    text: '범위: **클라이언트 뷰 모드만.** 서버(RLS·RPC) 권한 전환(impersonation)은 하지 않는다.'
