# 모델 단가 — 백만 토큰당 USD. §9-B 비용 게이트(cost_ladder.py)의 입력.
# ★출처: Anthropic 공식 pricing (platform.claude.com/docs/en/about-claude/pricing),
#   조회 2026-08-02. 표준 목록가 — 기업 볼륨 할인·배치(-50%)·프롬프트 캐싱 별도.
#   실제 청구가 다르면(계약 할인 등) 이 파일만 고치면 cost_ladder가 재판정.
source: anthropic-official-2026-08-02
notes:
  - Sonnet 5는 2026-08-31까지 도입가 $2/$10, 2026-09-01부터 표준 $3/$15.
    아래 값은 현재(오늘) 실효가=도입가. 9/1 이후 재실행 시 sonnet를 3/15로 교체.
  - 세 티어 모두 출력=입력×5 → break_even_input의 k=5·손익분기 2.90× 유효.
  - 배치 API는 입·출력 모두 -50%(비동기 대량 추출 시 게이트 여유↑).
prices:
  claude-haiku-4-5:
    input: 1.0
    output: 5.0
  claude-sonnet-5:            # 현재 도입가(≤2026-08-31). 표준가 sonnet-5-standard 참조.
    input: 2.0
    output: 10.0
  claude-sonnet-5-standard:   # 2026-09-01부터
    input: 3.0
    output: 15.0
  claude-opus-4-8:
    input: 5.0
    output: 25.0
  claude-fable-5:
    input: 10.0
    output: 50.0
